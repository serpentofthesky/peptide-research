China (aprobado por la NMPA en 2025).", "source_ids": ["1801-NEW-03", "1801-NEW-09", "1801-NEW-11", "ID-1801-02", "ID-1801-03"]}, "composition_of_matter": {"en": "Granted Lilly patent US9938335B2 (priority 2015-06-22, filed 2016-06-16, granted 2018-04-10) covers the specific GLP-1/glucagon peptide sequence with Lys20 fatty-acid conjugation; base expiry ~2036-06-16 assuming 20 years from filing, with PTA/PTE not checked; family includes CN107735100B. WO2022268174A1 (Innovent) is a use patent on uric-acid lowering, not composition of matter.", "es": "La patente concedida a Lilly US9938335B2 (prioridad 2015-06-22, presentada 2016-06-16, concedida 2018-04-10) cubre la secuencia peptídica específica GLP-1/glucagón con conjugación de ácido graso en Lys20; vencimiento base ~2036-06-16 asumiendo 20 años desde la presentación, sin verificar PTA/PTE; la familia incluye CN107735100B. WO2022268174A1 (Innovent) es una patente de uso (reducción de ácido úrico), no de composición de materia.", "source_ids": ["1801-NEW-08", "1801-NEW-09", "1801-NEW-10"]}, "additional_protection": {"en": "No additional verified protection: no completed claim chart, know-how documentation or other live patent families for the commercial molecule were obtained; WIPO/CNIPA status could not be directly opened.", "es": "Sin protección adicional verificada: no se obtuvo un cuadro de reivindicaciones completo, documentación de know-how ni otras familias de patentes vigentes para la molécula comercial; no se pudo abrir directamente el estado WIPO/CNIPA.", "source_ids": ["1801-NEW-08"]}, "regulatory_exclusivity": {"en": "China approvals for weight management (2025-06-24) and T2D (2025-09-16) at 4/6 mg maintenance exist; the length of any Chinese data or regulatory exclusivity was not established by retrieved evidence.", "es": "Existen aprobaciones en China para manejo de peso (2025-06-24) y DT2 (2025-09-16) con 4/6 mg de mantenimiento; la duración de cualquier exclusividad regulatoria o de datos china no fue establecida por la evidencia recuperada.", "source_ids": ["1801-NEW-03", "1801-NEW-04"]}, "competitive_workarounds": {"en": "Competition is demonstrably possible: Wegovy (2024-06-25 approval), tirzepatide (2024 guideline-listed), ecnoglutide (2026-03-06) and UBT251 (triple agonist, phase 2) show other peptides address the same Chinese obesity population; a grant does not prevent different molecules from competing.", "es": "La competencia es claramente posible: Wegovy (aprobado 2024-06-25), tirzepatida (listada en la guía 2024), ecnoglutida (2026-03-06) y UBT251 (triple agonista, fase 2) muestran que otros péptidos atienden la misma población china con obesidad; una concesión no impide que moléculas distintas compitan.", "source_ids": ["1801-NEW-12", "1801-NEW-13", "1801-NEW-14", "1801-NEW-18", "1801-NEW-09"]}, "licensing_and_territory": {"en": "Exclusive China development/commercialization license from Lilly (2019); Lilly's ex-China rights belong to Lilly, not Innovent. An upstream chain gives OPKO a 3% worldwide royalty on this program; Innovent's own royalty rate and milestones to Lilly are undisclosed, so net mazdutide economics are unknown.", "es": "Licencia exclusiva de desarrollo/comercialización en China de Lilly (2019); los derechos de Lilly fuera de China son de Lilly, no de Innovent. Una cadena aguas arriba otorga a OPKO una regalía mundial del 3% en este programa; la tasa de regalías y los hitos de Innovent con Lilly no están divulgados, por lo que la economía neta de mazdutida es desconocida.", "source_ids": ["1801-NEW-04", "1801-NEW-11", "ID-1801-02"]}, "enforceability_and_FTO": {"en": "Unknown: live maintenance status, assignments and a claim chart mapping the commercial molecule were not obtained; grant does not establish enforceability or freedom to operate.", "es": "Desconocido: no se obtuvo el estado de mantenimiento vigente, asignaciones ni un cuadro de reivindicaciones que mapee la molécula comercial; la concesión no establece exigibilidad ni libertad de operación.", "source_ids": ["1801-NEW-08", "1801-NEW-10"]}}], "institutional_risk": [], "scenarios": [{"type": "bear", "assumption": {"en": "China's obesity market commoditizes: Wegovy, tirzepatide, ecnoglutide and later UBT251 compete on price, while the 9 mg application is rejected or further delayed and the undisclosed Lilly royalty compresses mazdutide margins.", "es": "El mercado chino de obesidad se comoditiza: Wegovy, tirzepatida, ecnoglutida y luego UBT251 compiten por precio, mientras la solicitud de 9 mg es rechazada o se retrasa y la regalía no divulgada a Lilly comprime los márgenes de mazdutida.", "source_ids": ["1801-NEW-04", "1801-NEW-11", "1801-NEW-12", "1801-NEW-13", "1801-NEW-14", "1801-NEW-18"]}, "trigger": {"en": "A negative or prolonged NMPA decision on 9 mg plus visible price cuts or slower mazdutide uptake versus rivals.", "es": "Una decisión negativa o prolongada de la NMPA sobre 9 mg más recortes de precio visibles o una adopción de mazdutida más lenta frente a rivales.", "source_ids": ["1801-NEW-04", "1801-NEW-12", "1801-NEW-13"]}, "affected_drug_territory": {"en": "Mazdutide, China only.", "es": "Mazdutida, solo China.", "source_ids": ["ID-1801-02"]}, "economic_consequence": {"en": "Lower mazdutide contribution within otherwise profitable group finances; the equity would rest more on non-mazdutide portfolio value, which this evidence does not quantify.", "es": "Menor contribución de mazdutida dentro de finanzas grupales por lo demás rentables; la equity descansaría más en el valor no cuantificado aquí del portafolio distinto de mazdutida.", "source_ids": ["1801-NEW-04"]}, "timing_and_indicators": {"en": "Indicators: NMPA action on 9 mg (timing unconfirmed), quarterly mazdutide sales trends, competitor pricing and ecnoglutide/UBT251 launches.", "es": "Indicadores: acción de la NMPA sobre 9 mg (plazo sin confirmar), tendencias trimestrales de ventas de mazdutida, precios de competidores y lanzamientos de ecnoglutida/UBT251.", "source_ids": ["1801-NEW-04", "1801-NEW-12", "1801-NEW-14"]}}, {"type": "base", "assumption": {"en": "The approved 4/6 mg label persists in weight management and T2D; mazdutide holds a defensible but contested position among multiple weekly injectables in China while group profitability continues.", "es": "La etiqueta aprobada de 4/6 mg persiste en manejo de peso y DT2; mazdutida mantiene una posición defendible pero disputada entre múltiples inyectables semanales en China, mientras la rentabilidad grupal continúa.", "source_ids": ["1801-NEW-03", "1801-NEW-04", "1801-NEW-12", "1801-NEW-13"]}, "trigger": {"en": "Routine commercial execution and incremental label/pen milestones, with the 9 mg decision arriving at any time.", "es": "Ejecución comercial rutinaria e hitos incrementales de etiqueta/pluma, con la decisión de 9 mg llegando en cualquier momento.", "source_ids": ["1801-NEW-03", "1801-NEW-04"]}, "affected_drug_territory": {"en": "Mazdutide, China only.", "es": "Mazdutida, solo China.", "source_ids": ["ID-1801-02"]}, "economic_consequence": {"en": "Continued positive group revenue, profit and operating cash flow with mazdutide as one contributor; net mazdutide economics remain uncertain because the Lilly royalty is undisclosed.", "es": "Continúan ingresos, beneficio y flujo de caja operativo grupales positivos con mazdutida como un contribuyente; la economía neta de mazdutida sigue incierta porque la regalía a Lilly no está divulgada.", "source_ids": ["1801-NEW-04", "1801-NEW-11"]}, "timing_and_indicators": {"en": "Indicators: interim/annual reports, monthly share returns, and peer launch announcements through 2026–2027.", "es": "Indicadores: informes interinos/anuales, retornos mensuales de acciones y anuncios de lanzamientos de competidores durante 2026–2027.", "source_ids": ["1801-NEW-04", "1801-NEW-05"]}}, {"type": "bull", "assumption": {"en": "China approves the 9 mg dose, whose published GLORY-2 results (-16.65% weight loss at 60 weeks) support a best-in-China efficacy claim, and GLORY-3 MAFLD or other phase 3 programs expand the label.", "es": "China aprueba la dosis de 9 mg, cuyos resultados publicados de GLORY-2 (-16.65% de pérdida de peso a 60 semanas) respaldan una afirmación de eficacia líder en China, y GLORY-3 MAFLD u otros programas de fase 3 amplían la etiqueta.", "source_ids": ["1801-NEW-02", "1801-NEW-04"]}, "trigger": {"en": "NMPA approval of 9 mg and positive readouts or new approvals from the ongoing phase 3 pipeline.", "es": "Aprobación de la NMPA de 9 mg y lecturas positivas o nuevas aprobaciones del pipeline de fase 3 en curso.", "source_ids": ["1801-NEW-04"]}, "affected_drug_territory": {"en": "Mazdutide, China only.", "es": "Mazdutida, solo China.", "source_ids": ["ID-1801-02"]}, "economic_consequence": {"en": "Larger mazdutide share within a growing Chinese obesity/T2D market, subject to the undisclosed Lilly economics and the demonstrated GI tolerability burden at 9 mg.", "es": "Mayor participación de mazdutida dentro de un mercado chino creciente de obesidad/DT2, sujeto a la economía no divulgada con Lilly y a la carga demostrable de intolerancia gastrointestinal con 9 mg.", "source_ids": ["1801-NEW-02", "1801-NEW-11", "1801-NEW-15"]}, "timing_and_indicators": {"en": "Indicators: any 9 mg decision (date unconfirmed), GLORY-3 MAFLD/OSA/YOUNG/hypertension readouts and label expansions.", "es": "Indicadores: cualquier decisión sobre 9 mg (fecha sin confirmar), lecturas de GLORY-3 MAFLD/OSA/YOUNG/hipertensión y expansiones de etiqueta.", "source_ids": ["1801-NEW-04"]}}], "risk_scenarios": [{"kind": "regulatory_downside", "trigger": {"en": "China's regulator rejects, restricts or delays the 9 mg application, or tightens obesity-drug requirements; as of 2026-09-29 the application was still under review.", "es": "El regulador chino rechaza, restringe o retrasa la solicitud de 9 mg, o endurece los requisitos de fármacos para obesidad; al 2026-09-29 la solicitud seguía en revisión.", "source_ids": ["1801-NEW-04"]}, "affected_drug_territory": {"en": "Mazdutide, China only.", "es": "Mazdutida, solo China.", "source_ids": ["ID-1801-02"]}, "economic_consequence": {"en": "Mazdutide stays capped at 4/6 mg labels, forfeiting the higher-dose efficacy position GLORY-2 supports, while approved rivals advance.", "es": "Mazdutida queda limitada a las etiquetas de 4/6 mg, perdiendo la posición de eficacia de dosis alta que respalda GLORY-2, mientras los rivales aprobados avanzan.", "source_ids": ["1801-NEW-02", "1801-NEW-12", "1801-NEW-13"]}, "timing_and_indicators": {"en": "Decision date unconfirmed; watch NMPA communications and issuer filings for review status changes.", "es": "Fecha de decisión sin confirmar; vigilar comunicaciones de la NMPA y presentaciones del emisor para cambios de estado de revisión.", "source_ids": ["1801-NEW-04"]}, "mitigation_or_counterevidence": {"en": "Both 4 mg and 6 mg are already approved with published phase 3 evidence, and the multidose pen was approved in May 2026; a 9 mg setback does not remove the existing approvals.", "es": "Tanto 4 mg como 6 mg ya están aprobados con evidencia de fase 3 publicada, y la plena multidosis fue aprobada en mayo de 2026; un revés de 9 mg no elimina las aprobaciones existentes.", "source_ids": ["1801-NEW-01", "1801-NEW-03", "1801-NEW-04"]}}, {"kind": "ip_loss", "trigger": {"en": "A challenge or invalidation against the Lilly compound patent family (e.g., US9938335B2/CN107735100B), or license-terms deterioration, in a context where live maintenance status and a commercial-molecule claim chart were never verified.", "es": "Una impugnación o nulidad contra la familia de patentes de composición de Lilly (p. ej., US9938335B2/CN107735100B), o un deterioro de los términos de la licencia, en un contexto donde nunca se verificó el estado de mantenimiento vigente ni un cuadro de reivindicaciones de la molécula comercial.", "source_ids": ["1801-NEW-08", "1801-NEW-09", "1801-NEW-10", "1801-NEW-11"]}, "affected_drug_territory": {"en": "Mazdutide patent and license position, chiefly China.", "es": "Posición de patente y licencia de mazdutida, principalmente China.", "source_ids": ["ID-1801-02"]}, "economic_consequence": {"en": "Weaker patent cover could invite domestic copies or follow-on peptides, and since Innovent's own royalty and milestone terms to Lilly are undisclosed, any renegotiation impact cannot be quantified from this evidence.", "es": "Una cobertura de patente más débil podría invitar copias domésticas o péptidos derivados, y dado que los términos propios de regalías e hitos de Innovent con Lilly no están divulgados, el impacto de cualquier renegociación no puede cuantificarse con esta evidencia.", "source_ids": ["1801-NEW-09", "1801-NEW-11"]}, "timing_and_indicators": {"en": "Indicators: CNIPA examination or opposition records, litigation filings, or changes in disclosed license terms; base patent expiry ~2036-06-16 assuming 20 years from filing.", "es": "Indicadores: registros de examen u oposición en CNIPA, demandas o cambios en los términos de licencia divulgados; vencimiento base de la patente ~2036-06-16 asumiendo 20 años desde la presentación.", "source_ids": ["1801-NEW-09", "1801-NEW-10"]}, "mitigation_or_counterevidence": {"en": "The compound patent was granted in the US with a Chinese family member, and the license chain (Lilly/OPKO 3% upstream royalty) is documented; no actual challenge is evidenced, and China approvals plus manufacturing scale-up provide non-patent commercial position.", "es": "La patente de composición fue concedida en EE. UU. con un miembro de familia chino, y la cadena de licencias (regalía aguas arriba del 3% de Lilly/OPKO) está documentada; no hay evidencia de impugnación real, y las aprobaciones en China más la escala de manufactura aportan posición comercial no patente.", "source_ids": ["1801-NEW-03", "1801-NEW-09", "1801-NEW-11", "ID-1801-02"]}}], "ratings": [{"dimension": "clinical_evidence", "rating": "GOOD", "reason": {"en": "Two peer-reviewed phase 3 trials (NEJM GLORY-1; JAMA GLORY-2) show strong placebo-controlled weight loss in Chinese adults; the only head-to-head evidence (DREAMS-3 vs semaglutide 1 mg) is sponsor-asserted, and cardiovascular outcomes are undemonstrated.", "es": "Dos ensayos de fase 3 revisados por pares (GLORY-1 en NEJM; GLORY-2 en JAMA) muestran una fuerte pérdida de peso controlada con placebo en adultos chinos; la única evidencia cara-a-cara (DREAMS-3 vs semaglutida 1 mg) es afirmada por el patrocinador, y los resultados cardiovasculares no están demostrados.", "source_ids": ["1801-NEW-01", "1801-NEW-02", "1801-NEW-07"]}}, {"dimension": "ip_economic_defensibility", "rating": "MIDDLING", "reason": {"en": "A granted Lilly compound patent family (base expiry ~2036) and documented China license exist, but the commercial-molecule claim chart, live patent status and Innovent's own royalty terms are all unverified, so net defensibility cannot be confirmed.", "es": "Existe una familia de patentes de composición concedida a Lilly (vencimiento base ~2036) y una licencia china documentada, pero el cuadro de reivindicaciones de la molécula comercial, el estado vigente de patentes y los términos propios de regalías de Innovent no están verificados, por lo que la defendibilidad neta no puede confirmarse.", "source_ids": ["1801-NEW-08", "1801-NEW-09", "1801-NEW-10", "1801-NEW-11", "ID-1801-02"]}}, {"dimension": "financial_strength", "rating": "GOOD", "reason": {"en": "The group is profitable and cash-generative (H1 2026 IFRS profit RMB 1,253.142m; operating cash flow RMB 3,588.344m; cash equivalents RMB 4,523.941m plus >3-month deposits RMB 13,932.203m), though these are group, not mazdutide-only, economics.", "es": "El grupo es rentable y genera caja (beneficio IFRS del S1 2026 de RMB 1,253.142m; flujo operativo de RMB 3,588.344m; equivalentes de efectivo de RMB 4,523.941m más depósitos >3 meses de RMB 13,932.203m), aunque son economías grupales, no solo de mazdutida.", "source_ids": ["1801-NEW-04"]}}, {"dimension": "regulatory_exposure", "rating": "FAIR", "reason": {"en": "China label approvals for weight management and T2D are secured, but the 9 mg application is still under review with an unconfirmed date, all rights are China-only, and no FDA/EMA approval exists.", "es": "Las aprobaciones de etiqueta en China para manejo de peso y DT2 están aseguradas, pero la solicitud de 9 mg sigue en revisión con fecha sin confirmar, todos los derechos son solo para China y no existe aprobación de FDA/EMA.", "source_ids": ["1801-NEW-03", "1801-NEW-04", "ID-1801-02"]}}, {"dimension": "competitive_position", "rating": "MIDDLING", "reason": {"en": "Mazdutide has a real dual-agonist profile and approvals, but faces approved Wegovy and tirzepatide, newly approved ecnoglutide and a strong phase 2 triple agonist (UBT251); cross-trial numbers cannot prove superiority.", "es": "Mazdutida tiene un perfil dual-agonista real y aprobaciones, pero enfrenta a Wegovy y tirzepatida aprobadas, la recién aprobada ecnoglutida y un potente triple agonista en fase 2 (UBT251); los números entre ensayos no pueden probar superioridad.", "source_ids": ["1801-NEW-12", "1801-NEW-13", "1801-NEW-14", "1801-NEW-18"]}}, {"dimension": "valuation_attractiveness", "rating": "UNKNOWN", "reason": {"en": "A dated market cap (≈HKD 161.85bn) and a defined EV proxy (≈RMB 122.73bn) exist, but no independent fair-value anchor, mazdutide-only revenue or net royalty economics were supplied, so attractiveness cannot be rated.", "es": "Existe una capitalización con fecha (≈HKD 161.85 mil millones) y un proxy de EV definido (≈RMB 122.73 mil millones), pero no se suministraron anclas independientes de valor justo, ingresos solo de mazdutida ni economía neta de regalías, por lo que el atractivo no puede calificarse.", "source_ids": ["1801-FX-VERIFIED", "1801-NEW-04", "1801-NEW-05", "1801-NEW-06"]}}, {"dimension": "catalyst_quality", "rating": "FAIR", "reason": {"en": "The 9 mg China decision is a clear, evidence-relevant milestone, but its date is unconfirmed, and the other catalysts (GLORY-3 MAFLD, OSA, YOUNG, hypertension) lack confirmed readout timing.", "es": "La decisión china sobre 9 mg es un hito claro y relevante para la evidencia, pero su fecha no está confirmada, y los demás catalizadores (GLORY-3 MAFLD, OSA, YOUNG, hipertensión) carecen de fechas de lectura confirmadas.", "source_ids": ["1801-NEW-02", "1801-NEW-04"]}}], "unknowns": [{"en": "Innovent's own royalty rate, milestones and full territory definitions with Lilly are not publicly established; only the upstream OPKO 3% royalty is verified.", "es": "La tasa de regalías propia de Innovent, los hitos y las definiciones completas de territorio con Lilly no están establecidos públicamente; solo está verificada la regalía aguas arriba del 3% de OPKO.", "source_ids": ["1801-NEW-11"]}, {"en": "Live CNIPA/USPTO legal status, assignments and a claim chart mapping the commercial mazdutide molecule were not obtained; enforceability and freedom to operate remain unknown.", "es": "No se obtuvo el estado legal vigente en CNIPA/USPTO, asignaciones ni un cuadro de reivindicaciones de la molécula comercial de mazdutida; la exigibilidad y libertad de operación siguen desconocidas.", "source_ids": ["1801-NEW-08", "1801-NEW-10"]}, {"en": "Mature cardiovascular outcomes for mazdutide are undemonstrated, and the 9 mg decision date is not confirmed.", "es": "Los resultados cardiovasculares maduros de mazdutida no están demostrados, y la fecha de decisión de 9 mg no está confirmada.", "source_ids": ["1801-NEW-02", "1801-NEW-04"]}, {"en": "The exact October 9 share count, post-September changes, full dilution and a completely reconciled cross-currency enterprise value remain qualified; individual broker-account tradability is unverified.", "es": "El recuento exacto de acciones al 9 de octubre, cambios posteriores a septiembre, la dilución total y un valor empresarial entre divisas totalmente conciliado siguen calificados; la negociabilidad individual de la cuenta de broker no está verificada.", "source_ids": ["1801-FX-VERIFIED", "1801-NEW-05", "1801-NEW-16", "1801-NEW-17"]}, {"en": "Several key sources (NEJM, ADA abstract, NMPA, CN patent records) could not be opened directly; retained evidence consists of selected factual extracts, not full archived originals.", "es": "Varias fuentes clave (NEJM, resumen de la ADA, NMPA, registros de patentes CN) no pudieron abrirse directamente; la evidencia retenida consta de extractos fácticos seleccionados, no originales archivados completos.", "source_ids": ["1801-NEW-01", "1801-NEW-07", "1801-NEW-08"]}], "coverage_boundary": {"en": "This judgment covers Innovent (HKEX 1801) and its China-licensed mazdutide program plus group finances as of 2026-10-11; it does not attribute Lilly's ex-China mazdutide rights to Innovent, does not value the non-mazdutide oncology/immunology portfolio, and relies on selected extracts rather than complete source archives.", "es": "Este juicio cubre a Innovent (HKEX 1801) y su programa de mazdutida licenciado para China más las finanzas grupales al 2026-10-11; no atribuye a Innovent los derechos de mazdutida de Lilly fuera de China, no valora el portafolio no relacionado con mazdutida de oncología/inmunología, y se basa en extractos seleccionados en lugar de archivos completos de las fuentes.", "source_ids": ["1801-NEW-04", "ID-1801-02"]}}, {"ticker": "4587", "company": "PeptiDream Inc.", "class": "emerging_commercial", "cutoff": "2026-10-11", "regulatory_chips": [], "card": {"what_you_buy": {"en": "PD-32766, a CAIX-targeting macrocyclic peptide radiopharmaceutical (225Ac therapeutic / 64Cu diagnostic), dosed its first therapeutic patient in a US Phase Ia/Ib (NCT07688187) in relapsed/refractory clear-cell RCC in July 2026; evidence is early safety and tolerability only, with no posted results and estimated completion in 2029.", "es": "PD-32766, un radiofármaco peptídico macrocíclico dirigido a CAIX (terapéutico con 225Ac / diagnóstico con 64Cu), dosificó a su primer paciente terapéutico en un ensayo de Fase Ia/Ib en EE. UU. (NCT07688187) en RCC de células claras recaído/refractario en julio de 2026; la evidencia es solo de seguridad y tolerabilidad tempranas, sin resultados publicados y finalización estimada en 2029.", "source_ids": ["4587-CLIN-004", "4587-CLIN-015"]}, "why_it_could_work": {"en": "PeptiDream retains worldwide PD-32766 rights, earns undisclosed milestone income from partners such as MSD (October 7, 2026 PCC milestone), and booked JPY 8.0bn of H1 radiopharma revenue; durable capture depends on confidential partner terms and eventual clinical success.", "es": "PeptiDream conserva derechos mundiales sobre PD-32766, recibe ingresos por hitos no divulgados de socios como MSD (hito PCC del 7 de octubre de 2026) y registró 8.000 millones de JPY de ingresos radiofarmacéuticos en el primer semestre; la captura duradera depende de términos confidenciales con socios y del éxito clínico eventual.", "source_ids": ["4587-CLIN-001", "4587-CLIN-010"]}, "what_can_kill_it": {"en": "Documented: H1 operating loss of JPY 2.5bn, planned Kazusa/Tonomachi capex of roughly JPY 22–27bn in 2027–29, and a mirrored 2028 expiry for the core flexizyme patent. Conditional scenarios: Phase I safety failure, partner milestones not repeating, or patent invalidation could remove most platform value; commercial revenue is largely radiopharma and partner economics, not owned peptide sales.", "es": "Documentado: pérdida operativa de 2.500 millones de JPY en el primer semestre, capex planificado en Kazusa/Tonomachi de unos 22.000–27.000 millones de JPY en 2027–29 y un vencimiento reflejado en 2028 de la patente flexizima central. Escenarios condicionales: un fallo de seguridad en Fase I, hitos de socios que no se repitan o una invalidación de patente podrían eliminar gran parte del valor de la plataforma; los ingresos comerciales son en gran parte radiofarmacéuticos y de economía de socios, no ventas de péptidos propias.", "source_ids": ["4587-CLIN-001", "4587-REG-006", "4587-REG-007"]}, "financial_strength": {"en": "June 30 cash of JPY 23.6bn against JPY 15.7bn borrowings and an H1 operating outflow of JPY 1.82bn looks adequate, but FY2026 profit guidance depends on second-half milestones and heavy 2027–29 facility investment creates funding uncertainty.", "es": "El efectivo del 30 de junio de 23.600 millones de JPY frente a 15.700 millones de JPY en préstamos y una salida operativa de 1.820 millones de JPY en el primer semestre parece adecuado, pero la guía de beneficio de FY2026 depende de hitos del segundo semestre y la fuerte inversión en instalaciones de 2027–29 crea incertidumbre de financiación.", "source_ids": ["4587-FIN-001"]}, "valuation": {"en": "At the October 9 close of JPY 1,075 the approximate market cap is JPY 138.2bn (mixed June balances; EV JPY 130.3bn borrowings-only), but undisclosed partner economics, unverified patent status and no current EV make valuation attractiveness unknown.", "es": "Al cierre del 9 de octubre de 1.075 JPY, la capitalización aproximada es de 138.200 millones de JPY (saldos mixtos de junio; EV de 130.300 millones de JPY solo con préstamos), pero la economía de socios no divulgada, el estado patental no verificado y la ausencia de un EV actual hacen que el atractivo de la valoración sea desconocido.", "source_ids": ["4587-FIN-001", "4587-FIN-002", "4587-FIN-003", "4587-FIN-010"]}, "next_catalyst": {"en": "The Japan 64Cu PSMA diagnostic filing targeted for 2027 is a management plan, and Phase I safety/tolerability data from NCT07688187 are the next peptide catalysts; registry dates are estimates, with primary completion estimated May 2029.", "es": "La presentación del diagnóstico con 64Cu PSMA en Japón prevista para 2027 es un plan de gestión, y los datos de seguridad/tolerabilidad de Fase I de NCT07688187 son los próximos catalizadores peptídicos; las fechas del registro son estimaciones, con finalización primaria estimada en mayo de 2029.", "source_ids": ["4587-CLIN-005", "4587-CLIN-015"]}}, "valuation_inputs": [{"label": {"en": "Tokyo regular-session close (night PTS excluded; adjustment convention not established)", "es": "Cierre de sesión regular de Tokio (PTS nocturno excluido; convención de ajuste no establecida)"}, "value": 1075, "unit": "JPY/share", "as_of": "2026-10-09 Japan Standard Time", "source_ids": ["4587-FIN-002", "4587-FIN-003"], "unknown_reason": null}, {"label": {"en": "Basic economic shares outstanding (issued 130,010,400 less treasury 1,442,676; not diluted)", "es": "Acciones básicas en circulación (emitidas 130.010.400 menos autocartera 1.442.676; no diluidas)"}, "value": 128567724, "unit": "shares", "as_of": "2026-06-30", "source_ids": ["4587-FIN-001"], "unknown_reason": null}, {"label": {"en": "Diluted/weighted-average share count, kept separate from basic outstanding", "es": "Recuento diluido/ponderado de acciones, mantenido separado de las básicas en circulación"}, "value": 128873989, "unit": "shares", "as_of": "H1 2026", "source_ids": ["4587-FIN-001"], "unknown_reason": null}, {"label": {"en": "Cash (IFRS)", "es": "Efectivo (IFRS)"}, "value": 23602821000, "unit": "JPY", "as_of": "2026-06-30", "source_ids": ["4587-FIN-001"], "unknown_reason": null}, {"label": {"en": "Current borrowings", "es": "Préstamos corrientes"}, "value": 2612678000, "unit": "JPY", "as_of": "2026-06-30", "source_ids": ["4587-FIN-001"], "unknown_reason": null}, {"label": {"en": "Non-current borrowings", "es": "Préstamos no corrientes"}, "value": 13076251000, "unit": "JPY", "as_of": "2026-06-30", "source_ids": ["4587-FIN-001"], "unknown_reason": null}, {"label": {"en": "Other current financial liabilities (debt-like components not fully disaggregated)", "es": "Otras pasivos financieros corrientes (componentes similar a deuda no totalmente desglosados)"}, "value": 591342000, "unit": "JPY", "as_of": "2026-06-30", "source_ids": ["4587-FIN-001"], "unknown_reason": null}, {"label": {"en": ream conserva derechos mundiales.", "source_ids": ["4587-CLIN-004", "4587-CLIN-001"]}, "composition_of_matter": {"en": "No molecule-specific PD-32766 composition-of-matter patent was established by examined sources; compound coverage cannot be assumed.", "es": "Ninguna patente de composición de materia específica de PD-32766 fue establecida por las fuentes examinadas; la cobertura del compuesto no puede asumirse.", "source_ids": ["4587-REG-006", "4587-REG-007", "4587-REG-008"]}, "additional_protection": {"en": "Platform know-how and method patents plus a portfolio approach; no generic monopoly on all peptides is claimed.", "es": "Know-how de plataforma y patentes de método más un enfoque de cartera; no se reivindica un monopolio genérico sobre todos los péptidos.", "source_ids": ["4587-REG-009", "4587-REG-006"]}, "regulatory_exclusivity": {"en": "No approval exists; the asset is in recruiting Phase I with no posted results, so no regulatory exclusivity has been earned.", "es": "No existe aprobación; el activo está en Fase I en reclutamiento sin resultados publicados, por lo que no se ha obtenido exclusividad regulatoria.", "source_ids": ["4587-CLIN-015", "4587-CLIN-004"]}, "competitive_workarounds": {"en": "Telix TLX250-Tx, a CAIX antibody radiotherapy already dosing Phase II/III in clear-cell RCC, shows a different carrier route to the same target; lawful design-around requires specific claim analysis.", "es": "Telix TLX250-Tx, una radioterapia con anticuerpo CAIX ya en dosificación de Fase II/III en RCC de células claras, muestra una ruta de vector diferente hacia el mismo objetivo; evitar reclamaciones legalmente requiere un análisis específico.", "source_ids": ["4587-CLIN-012", "4587-REG-009"]}, "licensing_and_territory": {"en": "University of Tokyo exclusive sublicense-right license (from December 2006, through patent term) and SUNY flexizyme agreement (from March 2007); royalties flow to university TLOs and economics are confidential.", "es": "Licencia exclusiva con derecho de sublicencia de la Universidad de Tokio (desde diciembre de 2006, durante la vigencia de la patente) y acuerdo flexizima con SUNY (desde marzo de 2007); las regalías fluyen a los TLO universitarios y la economía es confidencial.", "source_ids": ["4587-REG-006", "4587-REG-009"]}, "enforceability_and_FTO": {"en": "Office-verified patent status and term remain unresolved; mirrored expiries (US8188260 January 2028; US10711268 2037) are not legal confirmation, and FTO is unknown.", "es": "El estado y plazo de las patentes verificados por la oficina siguen sin resolverse; los vencimientos reflejados (US8188260 enero de 2028; US10711268 2037) no son confirmación legal, y la FTO es desconocida.", "source_ids": ["4587-REG-007", "4587-REG-008", "4587-REG-006"]}}, {"drug": "Japan PSMA I&T (64Cu diagnostic; 177Lu therapeutic)", "molecule": {"en": "Curium-origin small-molecule PSMA ligands, in-licensed; they are not peptide-derived despite peptide-radioisotope wording elsewhere.", "es": "Ligandos de PSMA de molécula pequeña de origen Curium, bajo licencia; no son derivados de péptidos pese a la terminología péptido-radioisótopo en otros textos.", "source_ids": ["4587-REG-005"]}, "composition_of_matter": {"en": "Composition-of-matter is not established as PeptiDream/PDR property in examined sources; PDR leads Japan filing, manufacturing and commercialization.", "es": "La composición de materia no está establecida como propiedad de PeptiDream/PDR en las fuentes examinadas; PDR lidera presentación, fabricación y comercialización en Japón.", "source_ids": ["4587-REG-005", "4587-REG-001"]}, "additional_protection": {"en": "No additional protection beyond partner agreements was established by examined sources.", "es": "No se estableció protección adicional más allá de acuerdos con socios en las fuentes examinadas.", "source_ids": ["4587-REG-005"]}, "regulatory_exclusivity": {"en": "Japan submission goals of 2027 (diagnostic) and 2029 (therapeutic) are management plans, not completed approvals; no exclusivity exists yet.", "es": "Los objetivos de presentación en Japón de 2027 (diagnóstico) y 2029 (terapéutico) son planes de gestión, no aprobaciones completadas; aún no existe exclusividad.", "source_ids": ["4587-REG-005"]}, "competitive_workarounds": {"en": "Novartis Pluvicto is an approved PSMA therapeutic rival with an FDA-accepted randomized rPFS benefit, though OS was not statistically significant and 60% of controls crossed over.", "es": "Novartis Pluvicto es un rival terapéutico PSMA aprobado con beneficio aleatorizado de rPFS aceptado por la FDA, aunque la SG no fue estadísticamente significativa y el 60% de los controles cruzó.", "source_ids": ["4587-REG-011"]}, "licensing_and_territory": {"en": "Rights are Japan-specific: Curium/PDR share Japan development costs and profits, limiting economic capture to that territory.", "es": "Los derechos son específicos de Japón: Curium/PDR comparten costes y beneficios de desarrollo en Japón, limitando la captura económica a ese territorio.", "source_ids": ["4587-REG-001", "4587-REG-005"]}, "enforceability_and_FTO": {"en": "Small-molecule FTO and patent enforceability for this program were not examined and remain unknown.", "es": "La FTO de molécula pequeña y la exigibilidad de patentes para este programa no fueron examinadas y siguen desconocidas.", "source_ids": ["4587-REG-005"]}}], "institutional_risk": [], "scenarios": [{"type": "bear", "assumption": {"en": "Conditional assumption: PD-32766 Phase I shows dose-limiting toxicity or no activity, and H2 FY2026 milestone payments fail to repeat at guided levels.", "es": "Supuesto condicional: la Fase I de PD-32766 muestra toxicidad limitante de dosis o falta de actividad, y los pagos por hitos del segundo semestre de FY2026 no se repiten en los niveles previstos.", "source_ids": ["4587-CLIN-015", "4587-CLIN-001"]}, "trigger": {"en": "Safety stopping, negative interim signals in NCT07688187, or a guidance cut tied to missed licensing payments.", "es": "Parada por seguridad, señales provisionales negativas en NCT07688187 o un recorte de guía ligado a pagos de licencias no materializados.", "source_ids": ["4587-CLIN-015", "4587-FIN-001"]}, "affected_drug_territory": {"en": "PD-32766 worldwide; FY2026 revenue/operating-profit guidance and the partnered discovery portfolio.", "es": "PD-32766 a nivel mundial; la guía de ingresos/beneficio operativo FY2026 y la cartera de descubrimiento con socios.", "source_ids": ["4587-CLIN-001", "4587-FIN-001"]}, "economic_consequence": {"en": "Loss of platform proof-of-concept, guidance shortfall against the JPY 32bn/JPY 4.6bn forecast, and greater strain from JPY 22–27bn planned facility capex.", "es": "Pérdida de la prueba de concepto de la plataforma, incumplimiento de la guía frente a los 32.000/4.600 millones de JPY previstos y mayor presión por el capex planificado de 22.000–27.000 millones de JPY.", "source_ids": ["4587-FIN-001"]}, "timing_and_indicators": {"en": "Registry estimates run to 2029 completion, but safety signals could emerge earlier; indicators: registry updates, guidance revisions, disclosure of missed milestones.", "es": "Las estimaciones del registro llegan a 2029, pero señales de seguridad podrían surgir antes; indicadores: actualizaciones del registro, revisiones de guía, divulgación de hitos incumplidos.", "source_ids": ["4587-CLIN-015", "4587-FIN-001"]}}, {"type": "base", "assumption": {"en": "Conditional assumption: partnered milestone income continues near guided levels and PD-32766 Phase I advances per plan without efficacy proof.", "es": "Supuesto condicional: los ingresos por hitos de socios continúan cerca de los niveles previstos y la Fase I de PD-32766 avanza según lo planificado sin prueba de eficacia.", "source_ids": ["4587-FIN-001", "4587-FIN-010"]}, "trigger": {"en": "Further milestone announcements of the MSD type plus steady NCT07688187 enrollment.", "es": "Nuevos anuncios de hitos del tipo MSD más un reclutamiento estable de NCT07688187.", "source_ids": ["4587-FIN-010", "4587-CLIN-015"]}, "affected_drug_territory": {"en": "Partnered discovery programs globally and PD-32766 Phase I in the US.", "es": "Programas de descubrimiento con socios a nivel mundial y Fase I de PD-32766 en EE. UU.", "source_ids": ["4587-CLIN-001", "4587-CLIN-015"]}, "economic_consequence": {"en": "Milestone-driven revenue roughly tracking FY2026 guidance with cash broadly sustained, while 2027–29 facility investment remains a funding requirement.", "es": "Ingresos por hitos aproximadamente acordes con la guía FY2026 con caja sostenida en general, mientras la inversión en instalaciones de 2027–29 sigue siendo un requisito de financiación.", "source_ids": ["4587-FIN-001"]}, "timing_and_indicators": {"en": "H2 FY2026 for milestone income; registry estimated primary completion May 2029; indicators: milestone disclosures and registry status changes.", "es": "Segundo semestre de FY2026 para ingresos por hitos; finalización primaria estimada del registro en mayo de 2029; indicadores: divulgaciones de hitos y cambios de estado en el registro.", "source_ids": ["4587-FIN-010", "4587-CLIN-015"]}}, {"type": "bull", "assumption": {"en": "Conditional assumption: PD-32766 shows preliminary activity (ORR/DCR signals) and new licensing deals are signed on favorable terms.", "es": "Supuesto condicional: PD-32766 muestra actividad preliminar (señales de ORR/DCR) y se firman nuevas licencias en términos favorables.", "source_ids": ["4587-CLIN-015", "4587-CLIN-001"]}, "trigger": {"en": "Interim Phase I activity signals and new partnered-program disclosures of the MSD/J&J type.", "es": "Señales provisionales de actividad en Fase I y nuevas divulgaciones de programas con socios del tipo MSD/J&J.", "source_ids": ["4587-CLIN-004", "4587-CLIN-001"]}, "affected_drug_territory": {"en": "PD-32766 worldwide and the PDPS platform broadly.", "es": "PD-32766 a nivel mundial y la plataforma PDPS en general.", "source_ids": ["4587-CLIN-004", "4587-REG-009"]}, "economic_consequence": {"en": "Higher upfront/milestone income and improved partnering economics, though no owned product revenue arises before late-decade data; value would still rest on undisclosed deal terms.", "es": "Mayores ingresos iniciales/por hitos y mejor economía de alianzas, aunque no surgen ingresos de productos propios antes de datos de finales de la década; el valor seguiría dependiendo de términos de acuerdos no divulgados.", "source_ids": ["4587-CLIN-001", "4587-CLIN-010"]}, "timing_and_indicators": {"en": "Estimated primary completion May 2029 with earlier interim disclosures possible; indicators: registry postings, new deal announcements, dosing milestones.", "es": "Finalización primaria estimada en mayo de 2029 con posibles divulgaciones provisionales anteriores; indicadores: publicaciones del registro, nuevos anuncios de acuerdos, hitos de dosificación.", "source_ids": ["4587-CLIN-015"]}}], "risk_scenarios": [{"kind": "regulatory_downside", "trigger": {"en": "Conditional scenario: the Japan PSMA submissions slip or fail, or PD-32766 encounters safety findings that halt development.", "es": "Escenario condicional: las presentaciones de PSMA en Japón se retrasan o fracasan, o PD-32766 enfrenta hallazgos de seguridad que detengan el desarrollo.", "source_ids": ["4587-REG-005", "4587-CLIN-015"]}, "affected_drug_territory": {"en": "Japan PSMA 64Cu diagnostic (2027 target) and 177Lu therapeutic (2029 target); PD-32766 in the US.", "es": "Diagnóstico 64Cu PSMA en Japón (objetivo 2027) y terapéutico 177Lu (objetivo 2029); PD-32766 en EE. UU.", "source_ids": ["4587-REG-005", "4587-CLIN-015"]}, "economic_consequence": {"en": "Loss of the nearest dated regulatory milestones and a Hit to guidance reliant on H2 licensing payments; direct product economics were already limited to Japan-specific rights.", "es": "Pérdida de los hitos regulatorios con fechas más cercanas y un golpe a la guía dependiente de pagos de licencias del segundo semestre; la economía directa de producto ya estaba limitada a derechos específicos de Japón.", "source_ids": ["4587-REG-001", "4587-FIN-001"]}, "timing_and_indicators": {"en": "2027–2029 management targets; indicators: jRCT trial progress, PMDA interactions, and any revision of submission targets.", "es": "Objetivos de gestión 2027–2029; indicadores: progreso de los ensayos jRCT, interacciones con la PMDA y cualquier revisión de los objetivos de presentación.", "source_ids": ["4587-REG-005"]}, "mitigation_or_counterevidence": {"en": "Counterevidence: multiple partnered programs continue advancing (October 2026 MSD milestone, AK1940 Phase I, FAP NNS309 Phase I), so company value does not rest on a single filing.", "es": " Contraevidencia: múltiples programas con socios siguen avanzando (hito MSD de octubre de 2026, AK1940 en Fase I, FAP NNS309 en Fase I), por lo que el valor de la compañía no descansa en una sola presentación.", "source_ids": ["4587-REG-010", "4587-REG-001"]}}, {"kind": "ip_loss", "trigger": {"en": "Conditional scenario: the core flexizyme patent US8188260 expires (mirrored January 2028) or is invalidated without equivalent protection, and no PD-32766 compound claims exist.", "es": "Escenario condicional: la patente central de flexizima US8188260 expira (enero de 2028 reflejado) o es invalidada sin protección equivalente, y no existen reclamaciones de compuesto para PD-32766.", "source_ids": ["4587-REG-007", "4587-REG-006"]}, "affected_drug_territory": {"en": "PDPS platform economics globally and PD-32766 specifically.", "es": "La economía de la plataforma PDPS a nivel mundial y PD-32766 específicamente.", "source_ids": ["4587-REG-006", "4587-REG-009"]}, "economic_consequence": {"en": "Erosion of platform exclusivity could weaken future licensing terms, while university royalty obligations through patent term would continue regardless.", "es": "La erosión de la exclusividad de la plataforma podría debilitar los términos futuros de licencias, mientras las obligaciones de regalías universitarias durante la vigencia de las patentes continuarían igualmente.", "source_ids": ["4587-REG-006", "4587-REG-009"]}, "timing_and_indicators": {"en": "Mirrored expiry January 2028 for US8188260; office verification is pending, so timing is unconfirmed; indicators: USPTO/JPO records and any reissue or continuation activity.", "es": "Vencimiento reflejado en enero de 2028 para US8188260; la verificación ante la oficina está pendiente, por lo que el plazo no está confirmado; indicadores: registros USPTO/JPO y cualquier actividad de reexamen o continuación.", "source_ids": ["4587-REG-007"]}, "mitigation_or_counterevidence": {"en": "Counterevidence: the newer joint library-method family (US10711268, mirrored 2037 expiry) covers a different technology layer, and the JPO case study describes a portfolio approach anticipating expirations and workaround routes.", "es": "Contraevidencia: la familia más reciente de métodos de biblioteca conjunta (US10711268, vencimiento reflejado 2037) cubre una capa tecnológica distinta, y el estudio de caso de la JPO describe un enfoque de cartera que anticipa vencimientos y rutas de evitación.", "source_ids": ["4587-REG-008", "4587-REG-009"]}}], "ratings": [{"dimension": "clinical_evidence", "rating": "MIDDLING", "reason": {"en": "Actual first therapeutic dosing in a verified recruiting Phase I is real progress, but there are no posted results, endpoints are safety-dominated, and efficacy readouts sit around 2029 estimates.", "es": "La primera dosificación terapéutica real en una Fase I verificada en reclutamiento es un progreso real, pero no hay resultados publicados, los criterios de valoración se centran en seguridad y las lecturas de eficacia están en torno a estimaciones de 2029.", "source_ids": ["4587-CLIN-015", "4587-CLIN-004"]}}, {"dimension": "ip_economic_defensibility", "rating": "MIDDLING", "reason": {"en": "Named platform patents and university licenses are documented, but office-verified status is unresolved, the key flexizyme patent shows a mirrored 2028 expiry, and PD-32766 compound coverage is unestablished.", "es": "Las patentes de plataforma nombradas y las licencias universitarias están documentadas, pero el estado verificado ante la oficina no está resuelto, la patente clave de flexizima muestra un vencimiento reflejado de 2028 y la cobertura de compuesto de PD-32766 no está establecida.", "source_ids": ["4587-REG-006", "4587-REG-007", "4587-REG-008"]}}, {"dimension": "financial_strength", "rating": "FAIR", "reason": {"en": "June 30 cash of JPY 23.6bn exceeds borrowings-adjusted needs near term, but H1 operating losses, milestone-dependent FY2026 guidance, and JPY 22–27bn of planned capex create material funding uncertainty.", "es": "El efectivo del 30 de junio de 23.600 millones de JPY cubre las necesidades a corto plazo ajustadas por préstamos, pero las pérdidas operativas del primer semestre, la guía FY2026 dependiente de hitos y unos 22.000–27.000 millones de JPY de capex planificado crean incertidumbre material de financiación.", "source_ids": ["4587-FIN-001"]}}, {"dimension": "regulatory_exposure", "rating": "MIDDLING", "reason": {"en": "No owned approval exists; value rests on a 2027 Japan diagnostic filing target and early US Phase I, both management plans or estimates rather than secured decisions.", "es": "No existe aprobación propia; el valor descansa en un objetivo de presentación de diagnóstico en Japón 2027 y una Fase I temprana en EE. UU., ambos planes de gestión o estimaciones en lugar de decisiones aseguradas.", "source_ids": ["4587-REG-005", "4587-REG-015"]}}, {"dimension": "competitive_position", "rating": "POOR", "reason": {"en": "The closest CAIX rival, Telix TLX250-Tx, is already dosing Phase II/III, and approved Pluvicto sets the PSMA precedent, leaving PD-32766 years behind in the same tumor type.", "es": "El rival CAIX más cercano, Telix TLX250-Tx, ya dosifica Fase II/III, y el aprobado Pluvicto marca el precedente PSMA, dejando a PD-32766 años atrás en el mismo tipo de tumor.", "source_ids": ["4587-CLIN-012", "4587-CLIN-011"]}}, {"dimension": "valuation_attractiveness", "rating": "UNKNOWN", "reason": {"en": "The approximate JPY 138.2bn market cap uses mixed October price and June balances, while undisclosed partner fees/royalties and unverified patent status prevent any supported value judgment.", "es": "La capitalización aproximada de 138.200 millones de JPY usa precio de octubre y saldos de junio mixtos, mientras las tarifas/regalías no divulgadas de socios y el estado patental no verificado impiden cualquier juicio de valor fundamentado.", "source_ids": ["4587-FIN-001", "4587-FIN-002", "4587-FIN-010"]}}, {"dimension": "catalyst_quality", "rating": "FAIR", "reason": {"en": "Identifiable future catalysts exist — Phase I safety data and the 2027 Japan PSMA filing target — but registry dates are estimates, milestone fees are undisclosed, and past milestones are not themselves future catalysts.", "es": "Existen catalizadores futuros identificables — datos de seguridad de Fase I y el objetivo de presentación de PSMA en Japón 2027 — pero las fechas del registro son estimaciones, las tarifas de hitos no se divulgan y los hitos pasados no son en sí mismos catalizadores futuros.", "source_ids": ["4587-CLIN-015", "4587-REG-005", "4587-REG-010"]}}], "unknowns": [{"en": "Office-verified status, term and enforceability of the PDPS patent family, and any PD-32766 composition-of-matter claim map, remain unresolved; USPTO/JPlatPat retrieval failed and mirror data is not a legal opinion.", "es": "El estado, plazo y exigibilidad verificados ante la oficina de la familia de patentes PDPS, y cualquier mapa de reclamaciones de composición de PD-32766, siguen sin resolverse; la recuperación de USPTO/JPlatPat falló y los datos reflejados no son una opinión legal.", "source_ids": ["4587-REG-006", "4587-REG-007", "4587-REG-008"]}, {"en": "Exact October 2026 balances, current outstanding shares, and the historical price adjustment convention are unknown; no current enterprise value can be asserted from mixed-date inputs.", "es": "Los saldos exactos de octubre de 2026, las acciones en circulación actuales y la convención de ajuste de precios históricos son desconocidos; no se puede afirmar un valor empresarial actual con datos de fechas mixtas.", "source_ids": ["4587-FIN-001", "4587-FIN-002", "4587-FIN-003"]}, {"en": "Confidential partner economics — the MSD milestone fee, royalty percentages, and undisclosed MSD/J&J program terms — cannot be recovered from public sources and limit valuation.", "es": "La economía confidencial de socios — la tarifa del hito de MSD, los porcentajes de regalías y los términos no divulgados de los programas MSD/J&J — no puede recuperarse de fuentes públicas y limita la valoración.", "source_ids": ["4587-FIN-010", "4587-FIN-001"]}, {"en": "Product-level economics of the peptide business are unresolved: program counts and partner deals do not establish retained peptide product revenue, and broker accessibility for the specific 4587 contract is unconfirmed.", "es": "La economía a nivel de producto del negocio de péptidos no está resuelta: el número de programas y acuerdos con socios no establece ingresos retenidos de productos peptídicos, y la accesibilidad de bróker para el contrato específico 4587 no está confirmada.", "source_ids": ["4587-CLIN-001", "4587-SUP-014"]}], "coverage_boundary": {"en": "Coverage extends to commercial radiopharma cash flows and investment-material macrocyclic peptide platform, internal and partnered programs as documented to October 11, 2026; small-molecule in-licensed PSMA/ATSM assets are distinguished from peptide-derived assets. Patent status relies on issuer filings and non-office mirrors; no independent investment judgment or current enterprise value is asserted.", "es": "La cobertura se extiende a los flujos de caja radiofarmacéuticos comerciales y a la plataforma de péptidos macrocíclicos, programas internos y co ents mirror", "source_type": "patent text mirror", "publication_date": "2012-03-06", "retrieved_at": "2026-10-11T14:23:32Z", "retrieval_timezone": "UTC", "document_section": "Bibliography/claims", "saved_representation": "factual paraphrase of browser extraction", "facts": "Novo assignee; priority March18 2005, grant March6 2012; acylated modified GLP-1 compounds. Mirror expiry December6 2030 differs from FDA product-specific December5 2031 and rounded issuer 2032 estimate. Product/territory and extension differences cannot be resolved from mirror alone."}, "NVO-SUP-007": {"source_id": "NVO-SUP-007", "url": "https://www.novonordisk.com/news-and-media/news-and-ir-materials/news-details.html?id=916774", "title": "September CagriSema Phase III results", "publisher": "Novo Nordisk", "source_type": "primary sponsor announcement", "publication_date": "2026-09-21", "retrieved_at": "2026-10-11T14:23:32Z", "retrieval_timezone": "UTC", "document_section": "REIMAGINE5 / REDEFINE9 and FDA timing", "saved_representation": "factual paraphrase of browser extraction", "facts": "REIMAGINE5 in adults with T2D: CagriSema1.0/1.0mg vs tirzepatide5mg over60weeks, efficacy-estimand weight loss12.4% vs9.1%; HbA1c reductions1.71% vs1.67%, noninferior. REDEFINE9 obesity:1.0/1.0mg68weeks weight loss21.0% vs2.0% placebo. Investigational CagriSema NDA filedDecember2025, decision management-expectedQ4 2026. This low-dose T2D comparison does not overturn highest-dose obesity REDEFINE4 result."}, "NVO-SUP-008": {"source_id": "NVO-SUP-008", "url": "https://www.novonordisk.com/content/nncorp/global/en/news-and-media/news-and-ir-materials/news-details.html?id=916501", "title": "REDEFINE4 highest-dose comparison", "publisher": "Novo Nordisk", "source_type": "primary sponsor announcement", "publication_date": "2026-02-23", "retrieved_at": "2026-10-11T14:23:32Z", "retrieval_timezone": "UTC", "document_section": "REDEFINE4", "saved_representation": "factual paraphrase of browser extraction", "facts": "84     if(p.year) bet+=' '+pick('Management expects the important liver result around '+p.year+'.','La dirección espera el resultado importante sobre el hígado hacia '+p.year+'.');
    if(p.capture) bet+=' '+pick('For shareholders to benefit, good results must become a business that rivals cannot easily copy.','Para beneficiar a los accionistas, los buenos resultados deben convertirse en un negocio que los rivales no puedan copiar fácilmente.');
    const betBlock=block(grid,pick('The bet','La apuesta'),bet,['card.next_catalyst','card.why_it_could_work','scenarios']);
    if(p.failure){const fail=para(betBlock,pick('Scenario: if the trial fails, much of the drug’s development value could be lost.','Escenario: si el ensayo fracasa, podría perderse gran parte del valor del fármaco en desarrollo.'),'failure');fail.prepend(h('strong',null,stateLabel('sink')+' · '));}
    let cash=p.funded?pick('Cash is a strength for now, but the company is spending it.','El efectivo es una fortaleza por ahora, pero la empresa lo está gastando.'):(a.card.financial_strength[LANG]||unknown());
    if(p.dilution) cash+=' '+pick('More shares could leave you owning a smaller part of the company.','Más acciones podrían reducir tu participación en la empresa.');
    if(p.price) cash+=' '+pick('Dated share price: ','Precio fechado por acción: ')+p.price.value+' '+p.price.unit+' · '+p.price.as_of+'. ';
    if(p.priceUnknown) cash+=' '+pick('This saved analysis still lacks a dated price and compatible valuation inputs.','A este análisis guardado aún le faltan un precio fechado y datos de valoración compatibles.');
    block(grid,pick('The money','El dinero'),cash,['card.financial_strength','card.valuation','valuation_inputs','ratings']);
    let protection=p.licensed && p.patentTerm?pick('Exclusive licensed rights and granted patents are documented. The composition family has an indicative base term around '+p.patentTerm[2]+'. Other rights have different terms; current legal strength and future challenges remain uncertain.','Se documentan derechos de licencia exclusivos y patentes concedidas. La familia de composición tiene un plazo base indicativo hacia '+p.patentTerm[2]+'. Otros derechos tienen plazos distintos; la solidez jurídica actual y los desafíos futuros siguen siendo inciertos.'):unknown();
    block(grid,pick('Protection','Protección'),protection,['defensibility.0.licensing_and_territory','defensibility.0.composition_of_matter','defensibility.0.enforceability_and_FTO']);
    article.appendChild(grid);
    const controls=h('div','decision-actions');const link=h('a','evidence-button',pick('The evidence →','La evidencia →'));
    link.href=standalone?'#'+LANG+'/evidence':(location.pathname.includes('/cards/')?'ALT.html':'cards/ALT.html')+'#'+LANG+'/evidence';controls.appendChild(link);
    para(controls,pick('Trials, patents, cash, scenarios and sources — fully open.','Ensayos, patentes, efectivo, escenarios y fuentes — todo visible.'),'small-note');article.appendChild(controls);
    const signals=h('section','signals');signals.setAttribute('aria-label',pick('Signals, not scores','Señales, no puntuaciones'));
    signal(signals,pick('Proof','Prueba'),p.fibrosis?pick('Early scarring benefit unproven','Beneficio inicial sobre cicatrices sin demostrar')+(p.alcohol?pick('; drinking result announced by the company','; resultado sobre alcohol anunciado por la empresa'):''):unknown(),p.fibrosis?'mixed':'unknown',['card.what_you_buy']);
    signal(signals,pick('Money','Dinero'),p.funded?pick('Strong for now','Sólido por ahora'):(p.cash?pick('Cash available; financing limits remain','Efectivo disponible; persisten límites financieros'):unknown()),({GOOD:'helps',FAIR:'mixed',POOR:'sink'})[p.strength?.rating]||'unknown',['ratings','valuation_inputs']);
    signal(signals,pick('Protection','Protección'),p.licensed && p.patentTerm?pick('Licensed patents; strength unverified','Patentes bajo licencia; solidez sin verificar'):unknown(),p.licensed && p.patentTerm && p.ipUnknown?'mixed':'unknown',['defensibility.0.composition_of_matter','defensibility.0.enforceability_and_FTO']);
    signal(signals,pick('Regulator','Regulador'),p.phase3?pick('Needs a successful larger trial, then regulatory approval','Necesita un ensayo mayor exitoso y después aprobación regulatoria'):unknown(),p.unapproved?'mixed':'unknown',['card.what_you_buy']);
    signal(signals,pick('Valuation','Valoración'),p.price?pick('Dated price obtained; valuation uses dated financial inputs','Precio fechado obtenido; valoración con datos financieros fechados'):pick('Valuation gap in saved analysis','Faltan datos de valoración en el análisis guardado'),'unknown',['card.valuation']);article.appendChild(signals);
    const legend=h('div','signal-legend');Object.keys(states).forEach(k=>legend.appendChild(h('span',k,stateLabel(k))));article.appendChild(legend);
    para(article,pick('Nothing is averaged. One risk can outweigh several strengths. Grey means the record does not establish an answer.','Nada se promedia. Un solo riesgo puede pesar más que varias fortalezas. El gris indica que el expediente no permite responder.'),'small-note');
    const visuals=h('div','explainer-grid');scarMetaphor(visuals,p);journey(visuals,p);chart(visuals,p);article.appendChild(visuals);
    para(article,pick('Saved evidence as of ','Evidencia guardada al ')+a.cutoff+pick(' · A research view, not a buy or sell instruction.',' · Una vista de investigación, no una instrucción de compra o venta.'),'small-note');
    return article;
  }
  const originalCard=card, originalRender=render;
  const ORDER=['VKTX','ALT','NVO','PTGX','LLY','ZEAL','KLRA','RYTM','CAMX','1276','1801','4587'];
  const STAGE=[
    ['Idea','Idea'],
    ['Early tests','Pruebas iniciales'],
    ['Large trial','Ensayo grande'],
    ['Approval review','Revisión para aprobar'],
    ['In patients\' hands','En manos de pacientes']
  ];
  function books(){return window.APPRAISAL||{};}
  function text(v){return v?v[LANG]||v.en||'':'';}
  function parseRoute(data){
    const single=data.analyses&&data.analyses.length===1?data.analyses[0].ticker:null;
    const parts=location.hash.replace(/^#/,'').split('/').filter(Boolean);
    let lang='es',ticker=single||ORDER[0],i=0,evidence=false;
    if(parts[0]==='en'||parts[0]==='es'){lang=parts[0];i=1;}
    if(parts[i]&&books()[parts[i]]){ticker=parts[i];i++;}
    if(single)ticker=single;
    if(parts[i]==='evidence')evidence=true;
    LANG=lang;
    return {evidence,ticker};
  }
  function hrefFor(ticker,evidence){
    const data=window.PILOT_DATA||{};
    const here=(data.analyses||[]).map(a=>a.ticker);
    const onCard=location.pathname.includes('/cards/');
    const hash=LANG+'/'+ticker+(evidence?'/evidence':'');
    if(onCard&&!here.includes(ticker))return '../index.html#'+hash;
    return '#'+hash;
  }
  function expand(node){
    if(node.tagName==='DETAILS'){const wrapper=h('div');wrapper.appendChild(node);node=wrapper;}
    Array.from(node.querySelectorAll('details')).reverse().forEach(d=>{const section=h('section','record-section');for(const child of Array.from(d.children)){if(child.tagName==='SUMMARY')section.appendChild(h('h3',null,child.textContent));else section.appendChild(child);}d.replaceWith(section);});
    return node;
  }
  function metaphor(parent,book){
    const f=h('figure','metaphor');
    const picture=h('div','metaphor-picture '+book.picture);picture.setAttribute('aria-hidden','true');
    if(book.picture==='scar'){
      const scar=h('span','woven scarred'),arrow=h('span','metaphor-arrow','→'),goal=h('span','woven');
      picture.append(scar,arrow,goal);
    }else if(book.picture==='weight'){
      picture.append(h('span','bob heavy'),h('span','metaphor-arrow','→'),h('span','bob light'));
    }else if(book.picture==='royalty'){
      picture.append(h('span','pile big'),h('span','metaphor-arrow','→'),h('span','pile small'));
    }else if(book.picture==='rare'){
      picture.append(h('span','person'),h('span','person'),h('span','person'));
    }else if(book.picture==='many'){
      picture.append(h('span','block'),h('span','block'),h('span','block accent'));
    }else if(book.picture==='depot'){
      picture.append(h('span','month'),h('span','month on'),h('span','month'));
    }else{
      picture.append(h('span','dot'),h('span','linkline'),h('span','dot'),h('span','linkline'),h('span','dot'));
    }
    f.appendChild(picture);
    f.appendChild(h('figcaption',null,text(book.caption)));
    parent.appendChild(f);
  }
  function road(parent,book){
    const section=h('section','journey');
    section.appendChild(h('h2',null,pick('Where this medicine is','Dónde está este medicamento')));
    const list=h('ol','journey-steps');
    STAGE.forEach((label,i)=>{
      const li=h('li',book.stage===i?'current':'',pick(label[0],label[1]));
      if(book.stage===i){li.setAttribute('aria-current','step');li.prepend(h('strong',null,pick('YOU ARE HERE','ESTÁS AQUÍ')));}
      list.appendChild(li);
    });
    section.appendChild(list);
    para(section,text(book.when),'milestone');
    parent.appendChild(section);
  }
  function bars(parent,rows,note){
    const max=Math.max(...rows.map(r=>r.to||r.value));
    rows.forEach(r=>{
      const row=h('div','cash-row');
      para(row,text(r.label),'cash-label');
      const track=h('div','cash-track');track.setAttribute('aria-hidden','true');
      const fill=h('div','cash-fill '+(r.cls||''));
      fill.style.width=(max>0?(r.to||r.value)/max*100:0)+'%';
      track.appendChild(fill);row.appendChild(track);
      para(row,text(r.figure),'cash-amount');
      parent.appendChild(row);
    });
    if(note)para(parent,text(note),'small-note');
  }
  function valuation(parent,book){
    const section=h('section','worth');
    section.appendChild(h('h2',null,pick('The price, and the picture of success','El precio, y la imagen del éxito')));
    para(section,text(book.price),'price-hero');
    if(book.bars)bars(section,book.bars,book.barsNote);
    const board=h('div','scenario');
    board.appendChild(h('strong','scenario-flag',pick('PICTURE, NOT A FORECAST','IMAGEN, NO UNA PREVISIÓN')));
    para(board,pick('Each column is a set of assumptions. It is not a promise, not a probability and not a target price for the share.','Cada columna es un conjunto de supuestos. No es una promesa, no es una probabilidad y no es un precio objetivo de la acción.'));
    const cols=h('div','scenario-cols');
    book.pictures.forEach(col=>{
      const c=h('div','scenario-col');
      c.appendChild(h('h3',null,text(col.name)));
      para(c,text(col.result),'scenario-result');
      const tag=h('p','assume-tag',pick('Assumption','Supuesto'));
      c.appendChild(tag);
      para(c,text(col.assumes),'scenario-assumes');
      cols.appendChild(c);
    });
    board.appendChild(cols);
    const rev=h('div','reverse');
    rev.appendChild(h('h3',null,pick('Read today\'s price backwards','El precio de hoy, leído al revés')));
    para(rev,text(book.reverse));
    board.appendChild(rev);
    const must=h('div','must');
    must.appendChild(h('h3',null,pick('For any larger picture, all of this has to happen','Para cualquier imagen mayor, todo esto tiene que ocurrir')));
    const ul=h('ul');
    book.must.forEach(item=>ul.appendChild(h('li',null,text(item))));
    must.appendChild(ul);
    board.appendChild(must);
    section.appendChild(board);
    parent.appendChild(section);
  }
  function ideaPage(book){
    const article=h('article','decision');article.dataset.ticker=book.ticker;
    para(article,pick('THE INVESTMENT IDEA','LA IDEA DE INVERSIÓN'),'eyebrow');
    article.appendChild(h('h1',null,book.name));
    para(article,text(book.kind),'kind-tag');
    para(article,text(book.intro),'intro');
    para(article,pick('These are shares in a company, not a vial and not a bottle of the medicine. Nothing here is an instruction to buy or sell.','Son acciones de una empresa, no un vial ni un frasco del medicamento. Nada de esto es una instrucción de comprar o vender.'),'shares-note');
    const visuals=h('div','explainer-grid');
    metaphor(visuals,book);road(visuals,book);article.appendChild(visuals);
    const grid=h('div','brief-grid');
    block(grid,pick('The idea','La idea'),text(book.idea),[]);
    block(grid,pick('The bet','La apuesta'),text(book.bet),[]);
    block(grid,pick('The money','El dinero'),text(book.money),[]);
    block(grid,pick('Protection','Protección'),text(book.protection),[]);
    article.appendChild(grid);
    const sink=h('section','sink-block');
    sink.appendChild(h('h2',null,pick('What can sink it','Qué puede hundirlo')));
    para(sink,text(book.sink));
    article.appendChild(sink);
    valuation(article,book);
    const signals=h('section','signals');
    signals.setAttribute('aria-label',pick('Signals, not scores','Señales, no puntuaciones'));
    [['proof','Proof','Prueba'],['money','Money','Dinero'],['protection','Protection','Protección'],['regulator','Regulator','Regulador'],['valuation','Valuation','Valoración']].forEach(([key,en,es])=>{
      const item=book.signals[key];
      signal(signals,pick(en,es),text(item),item.state,[]);
    });
    article.appendChild(signals);
    const legend=h('div','signal-legend');
    Object.keys(states).forEach(k=>legend.appendChild(h('span',k,stateLabel(k))));
    article.appendChild(legend);
    para(article,pick('Nothing is averaged. One serious weakness can outweigh several strengths. Grey means the record does not answer.','Nada se promedia. Una debilidad seria puede pesar más que varias fortalezas. El gris significa que el expediente no responde.'),'small-note');
    const controls=h('div','decision-actions');
    const link=h('a','evidence-button',pick('The evidence →','La evidencia →'));
    link.href=hrefFor(book.ticker,true);
    controls.appendChild(link);
    para(controls,pick('Trials, patents, contracts, the valuation arithmetic and the sources.','Ensayos, patentes, contratos, la aritmética de la valoración y las fuentes.'),'small-note');
    article.appendChild(controls);
    para(article,pick('Prices are the 9 October 2026 close unless a line says otherwise. Cash and share counts are often an earlier date. The workings on the next page show which is which.','Los precios son el cierre del 9 de octubre de 2026, salvo que una línea diga otra cosa. El efectivo y el número de acciones suelen ser de una fecha anterior. El cálculo de la página siguiente distingue cada fecha.'),'small-note');
    return article;
  }
  function workings(parent,book){
    const section=h('section','workings');
    section.appendChild(h('h2',null,pick('Valuation workings','El cálculo de la valoración')));
    para(section,pick('Facts are what a filing or a named source reports. Assumptions are choices used to draw a picture. The picture is not a forecast.','Los hechos son lo que informa un documento o una fuente citada. Los supuestos son decisiones para dibujar una imagen. La imagen no es una previsión.'),'record-intro');
    const grid=h('div','work-grid');
    const facts=h('div','work-facts');
    facts.appendChild(h('h3',null,pick('Sourced facts','Hechos con fuente')));
    book.facts.forEach(item=>para(facts,text(item)));
    const assumptions=h('div','work-assumptions');
    assumptions.appendChild(h('h3',null,pick('Assumptions — not results','Supuestos: no son resultados')));
    book.assumptions.forEach(item=>para(assumptions,text(item)));
    grid.append(facts,assumptions);
    section.appendChild(grid);
    section.appendChild(h('h3',null,pick('Arithmetic','Aritmética')));
    book.math.forEach(item=>para(section,text(item),'math-line'));
    const links=h('div','source-links');
    (book.sources||[]).forEach(src=>{const a=h('a',null,src.label);a.href=src.url;a.target='_blank';a.rel='noopener';links.appendChild(a);});
    section.appendChild(links);
    para(section,pick('Share prices, cash, share counts and trial facts above this box come from the saved company record that follows. External pages are there for the new valuation inputs only.','Los precios, el efectivo, el número de acciones y los hechos de los ensayos proceden del expediente guardado que sigue. Las páginas externas están solo para los datos nuevos de valoración.'),'small-note');
    parent.appendChild(section);
  }
  function header(ticker,evidence){
    const bar=h('header','alt-header');
    const nav=h('nav','ticker-nav');
    nav.setAttribute('aria-label',pick('Companies','Compañías'));
    ORDER.forEach(code=>{
      const b=h('a',null,code);
      b.href=hrefFor(code,false);
      b.title=(books()[code]||{}).name||code;
      if(code===ticker)b.setAttribute('aria-current','true');
      nav.appendChild(b);
    });
    bar.appendChild(nav);
    const toggle=h('div','langbtns');
    [['es','Español'],['en','English']].forEach(([code,label])=>{
      const b=h('button',null,label);b.type='button';
      b.setAttribute('aria-pressed',String(code===LANG));
      b.onclick=()=>{location.hash=code+'/'+ticker+(evidence?'/evidence':'');};
      toggle.appendChild(b);
    });
    bar.appendChild(toggle);
    return bar;
  }
  render=function(){
    const data=window.PILOT_DATA||{};
    if(!data.analyses||!window.APPRAISAL){originalRender();return;}
    const route=parseRoute(data);
    const book=books()[route.ticker];
    const analysis=(data.analyses||[]).find(a=>a.ticker===route.ticker)||data.analyses[0];
    if(!book||!analysis){originalRender();return;}
    document.documentElement.lang=LANG;
    document.title=book.name+' · '+pick(route.evidence?'The evidence':'The investment idea',route.evidence?'La evidencia':'La idea de inversión');
    const app=$id('app');app.className='alt-app';app.innerHTML='';
    app.appendChild(header(route.ticker,route.evidence));
    const publicationNote=h('aside','disclaimer');
    publicationNote.setAttribute('role','note');
    publicationNote.appendChild(h('strong',null,pick('Research snapshot · 11 October 2026','Investigación al 11 de octubre de 2026')));
    publicationNote.appendChild(h('p',null,pick('AI-assisted research for information and education. Not investment or medical advice. Figures and clinical or regulatory status may have changed; consult the linked sources and their dates.','Investigación asistida por IA con fines informativos y educativos. No constituye asesoramiento financiero ni médico. Las cifras y el estado clínico o regulatorio pueden haber cambiado; consulte las fuentes enlazadas y sus fechas.')));
    app.appendChild(publicationNote);
    if(!route.evidence){app.appendChild(ideaPage(book));return;}
    const back=h('a','back-link',pick('← The investment idea','← La idea de inversión'));
    back.href=hrefFor(route.ticker,false);
    app.appendChild(back);
    app.appendChild(h('h1','evidence-title',pick('The evidence','La evidencia')));
    para(app,pick('The valuation arithmetic is first. The full saved research follows. Shared regulator background is not a finding against this company.','Primero va la aritmética de la valoración. Después, la investigación guardada completa. Los antecedentes regulatorios generales no son un hallazgo contra esta empresa.'),'record-intro');
    workings(app,book);
    const record=expand(originalCard(analysis,data,D[LANG]));
    record.classList.add('full-record');
    app.appendChild(record);
    const institution=Array.from(record.querySelectorAll('.record-section')).find(n=>n.firstElementChild&&n.firstElementChild.textContent===D[LANG].secs.inst);
    if(institution)Array.from(institution.querySelectorAll('.sub2')).forEach((node,i)=>{
      const item=(analysis.institutional_risk||[])[i];const ids=[];
      Object.values(item||{}).forEach(v=>{if(v&&v.source_ids)ids.push(...v.source_ids);});
      if(ids.length&&ids.every(id=>String(id).startsWith('REG-COMMON-')))node.prepend(h('strong','background-label',pick('Shared background · no company-specific adverse finding','Antecedente compartido · sin hallazgo adverso específico de la empresa')));
    });
    app.appendChild(expand(srcSection(data,D[LANG])));
  };
  window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0);});
  render();
})();
</script></body></html>
