gistros del Orange Book de la FDA, finanzas del Q2 2026 y contexto institucional; orforglipron es un no péptido aprobado fuera del mapa de PI peptídica. No existe base de valoración actual sincronizada, los registros de patentes no son exigibilidad, los hallazgos regulatorios compartidos no son penalizaciones para la compañía y no se da puntuación global; la ausencia de evidencia sobre conflictos o mala conducta no es evidencia de ausencia.", "source_ids": ["ID-LLY-01", "LLY-F1", "LLY-SUP-003", "REG-COMMON-03"]}}, {"ticker": "ZEAL", "company": "Zealand Pharma A/S", "class": "clinical_stage_biotech", "cutoff": "2026-10-11", "regulatory_chips": [], "card": {"what_you_buy": {"en": "A clinical-stage Danish biotech whose amylin peptide petrelintide cut weight up to 9.8% versus 1.7% placebo at week 28 in Phase 2 (Lancet-published), including 9.2% versus 2.0% in type 2 diabetes; no approval yet, Phase 3 just started.", "es": "Una biotech danesa clínica cuyo péptido amilina petrelintide redujo peso hasta 9,8% frente a 1,7% con placebo en semana 28 en Fase 2 (publicado en Lancet), incluido 9,2% frente a 2,0% en diabetes tipo 2; sin aprobación aún, Fase 3 recién iniciada.", "source_ids": ["C-ZEAL-7", "C-ZEAL-1", "C-ZEAL-3"]}, "why_it_could_work": {"en": "Value capture runs through partnerships: 50/50 Roche profit split in US/Europe plus ex-territory royalties for petrelintide, and high-single to low-double-digit royalties from Boehringer on survodutide; all depends on Phase 3 success and eventual approvals.", "es": "La captura de valor pasa por alianzas: reparto 50/50 con Roche en EE. UU./Europa más regalías en otros territorios para petrelintide, y regalías de un dígito alto a dos dígitos bajo de Boehringer por survodutide; todo depende del éxito en Fase 3 y aprobaciones futuras.", "source_ids": ["ID-ZEAL-01", "ZEAL-SUP-05", "REG-ZEAL-01"]}, "what_can_kill_it": {"en": "Fact: no marketed obesity drug yet and ~7,000-participant Phase 3 readouts are years away. Scenarios: pivotal failure or safety signals (nausea 20% vs 6% placebo in Phase 2), entrenched incretin rivals with larger numerical weight losses in different trials (not a head-to-head comparison with petrelintide), or loss/narrowing of patent protection.", "es": "Hecho: aún sin fármaco de obesidad comercializado y las lecturas de Fase 3 (~7.000 participantes) están a años. Escenarios: fracaso pivotal o señales de seguridad (náusea 20% vs 6% placebo en Fase 2), rivales incretina consolidados con pérdidas de peso numéricamente mayores en otros ensayos (sin comparación directa con petrelintida), o pérdida/limitación de patentes.", "source_ids": ["C-ZEAL-3", "C-ZEAL-7", "ZEAL-SUP-RIVAL", "ZEAL-SUP-RIVAL2", "REG-ZEAL-01"]}, "financial_strength": {"en": "Strong for stage: DKK 14,457m cash plus securities against DKK 312m borrowings and DKK 266m H1 operating cash use, though June balances are dated and buybacks/milestones change them.", "es": "Sólida para su etapa: DKK 14.457m en efectivo más valores frente a DKK 312m de deuda y DKK 266m de uso de caja operativa en el S1, aunque los saldos de junio están desactualizados y las recompras/hitos los modifican.", "source_ids": ["ZEAL-F1"]}, "valuation": {"en": "Prepared arithmetic (not a recommendation): DKK 238.0 close on 2026-10-09 times 66,330,663 shares gives ~DKK 15.79bn market cap and ~DKK 1.64bn approximate EV; attractiveness versus peers is unknown without current reconciled comparables.", "es": "Aritmética preparada (no una recomendación): cierre de DKK 238,0 el 09-10-2026 por 66.330.663 acciones da ~DKK 15.790m de capitalización y ~DKK 1.640m de EV aproximado; el atractivo frente a pares es desconocido sin comparables actuales conciliados.", "source_ids": ["ZEAL-SUP-01", "ZEAL-SUP-04", "ZEAL-SUP-02"]}, "next_catalyst": {"en": "European Commission decision on glepaglutide (Zeydovio) following the 17 September 2026 CHMP positive opinion is pending, timing unannounced; full ZUPREME-2 petrelintide data presentation is also outstanding.", "es": "Está pendiente la decisión de la Comisión Europea sobre glepaglutide (Zeydovio) tras la opinión positiva del CHMP del 17 de septiembre de 2026, sin fecha anunciada; también falta la presentación completa de datos de ZUPREME-2 de petrelintide.", "source_ids": ["C-ZEAL-5", "C-ZEAL-1"]}}, "valuation_inputs": [{"label": {"en": "Closing price, Nasdaq Copenhagen ordinary share", "es": "Precio de cierre, acción ordinaria de Nasdaq Copenhagen"}, "value": 238.0, "unit": "DKK per share", "as_of": "2026-10-09; latest completed session; provider notes split adjustment for history", "source_ids": ["ZEAL-SUP-01"], "unknown_reason": null}, {"label": {"en": "Common shares outstanding (issued 71,610,005 minus treasury 5,279,342)", "es": "Acciones comunes en circulación (71.610.005 emitidas menos 5.279.342 en tesorería)"}, "value": 66330663, "unit": "shares", "as_of": "2026-10-05; buyback completed that date", "source_ids": ["ZEAL-SUP-04"], "unknown_reason": null}, {"label": {"en": "Cash DKK 4,038m plus marketable securities DKK 10,419m", "es": "Efectivo DKK 4.038m más valores negociables DKK 10.419m"}, "value": 14457, "unit": "DKK million", "as_of": "2026-06-30 balance sheet; not an October cash stock", "source_ids": ["ZEAL-F1", "ZEAL-SUP-02"], "unknown_reason": null}, {"label": {"en": "Noncurrent borrowings", "es": "Deuda no corriente"}, "value": 312, "unit": "DKK million", "as_of": "2026-06-30", "source_ids": ["ZEAL-F1"], "unknown_reason": null}, {"label": {"en": "Operating cash used", "es": "Caja operativa utilizada"}, "value": 266, "unit": "DKK million", "as_of": "2026-H1; not a steady-state burn forecast", "source_ids": ["ZEAL-F1"], "unknown_reason": null}, {"label": {"en": "Basic market capitalization (prepared calculation)", "es": "Capitalización básica (cálculo preparado)"}, "value": 15786697794.0, "unit": "DKK", "as_of": "2026-10-09 price × 2026-10-05 shares; excludes dilution", "source_ids": ["ZEAL-SUP-01", "ZEAL-SUP-04"], "unknown_reason": null}, {"label": {"en": "Approximate enterprise value (prepared calculation)", "es": "Valor de empresa aproximado (cálculo preparado)"}, "value": 1641697794.0, "unit": "DKK", "as_of": "2026-10-09/05 price and shares with 2026-06-30 cash/debt; post-June buyback bridge adds ~DKK 862m; leases 99m, warrants 43m, FX forward 69m and CT-388 payable ~797m unadjusted", "source_ids": ["ZEAL-SUP-01", "ZEAL-SUP-02", "ZEAL-SUP-04"], "unknown_reason": null}, {"label": {"en": "Historical issuer-reported market cap", "es": "Capitalización histórica reportada por el emisor"}, "value": 20076, "unit": "DKK million", "as_of": "2026-06-30 at DKK 289.3/share; historical reference only", "source_ids": ["ZEAL-F1"], "unknown_reason": null}, {"label": {"en": "Rusfertide royalty sale to Royalty Pharma (post-balance date)", "es": "Venta de regalías de rusfertide a Royalty Pharma (posterior al cierre)"}, "value": 100, "unit": "USD million", "as_of": "2026-08-12 agreement; not included in June 30 cash", "source_ids": ["ZEAL-F1"], "unknown_reason": null}, {"label": {"en": "Share buyback accumulated transactions as of 2026-08-07", "es": "Recompras acumuladas al 07-08-2026"}, "value": 742, "unit": "DKK million", "as_of": "2026-08-07; completed program bought 4,408,500 shares for DKK 1,299,996,125 gross by 2026-10-05", "source_ids": ["ZEAL-F1", "ZEAL-SUP-04"], "unknown_reason": null}, {"label": {"en": "2026 collaboration revenue guidance", "es": "Guía de ingresos por colaboración 2026"}, "value": 4500, "unit": "DKK million", "as_of": "FY2026 management guidance; H1 actual was DKK 4,525m, mostly Roche license accounting, not product sales", "source_ids": ["ZEAL-F1"], "unknown_reason": null}], "defensibility": [{"drug": "petrelintide", "molecule": {"en": "Chemically modified synthetic amylin analogue peptide with lactam bridge, N-methyl residues and lipid/linker extension; not unmodified endogenous amylin.", "es": "Péptido análogo sintético de amilina químicamente modificado con puente lactámico, residuos N-metilo y extensión lipídica/enlazador; no es amilina endógena sin modificar.", "source_ids": ["ZEAL-SUP-IP", "REG-ZEAL-01"]}, "composition_of_matter": {"en": "Granted EP3510044B1 claim 11 lists compound 35 and granted US12083164B2 claim 1 claims the matching SEQ ID NO 89 chemistry; later filing links petrelintide/ZP8396 to compound 35. EPO filing 2017-09-11 (priority 2016-09-09) implies a 2037 filing-term calculation only, conditional on law and maintenance.", "es": "La claims 11 de EP3510044B1 concedida lista el compuesto 35 y la claims 1 de US12083164B2 concedida reivindica la química correspondiente al SEQ ID NO 89; un registro posterior vincula petrelintide/ZP8396 al compuesto 35. Presentación ante EPO el 11-09-2017 (prioridad 09-09-2016) implica un cálculo de plazo a 2037 solo, condicionado a ley y mantenimiento.", "source_ids": ["ZEAL-SUP-IP", "ZEAL-SUP-USPTO-12083164", "ZEAL-SUP-IPLINK"]}, "additional_protection": {"en": "US grant reports 112 days patent-term adjustment and a terminal disclaimer; their net effect on effective expiry, plus maintenance status, is unverified.", "es": "La concesión estadounidense informa 112 días de ajuste de plazo y una declaración de término conjunto; su efecto neto sobre la expiración efectiva, más el estado de mantenimiento, no están verificados.", "source_ids": ["ZEAL-SUP-USPTO-12083164"]}, "regulatory_exclusivity": {"en": "No awarded drug-specific regulatory exclusivity established; the asset is pre-approval with Phase 3 initiated September 2026 (~7,000 planned participants).", "es": "Sin exclusividad regulatoria específica otorgada establecida; el activo es previo a aprobación, con Fase 3 iniciada en septiembre de 2026 (~7.000 participantes previstos).", "source_ids": ["C-ZEAL-3"]}, "competitive_workarounds": {"en": "Novo's CagriSema (cagrilintide amylin analogue plus semaglutide; REDEFINE1 -22.7% vs -2.3%, US filing December 2025) is a distinct documented competing amylin approach; the grant does not monopolize every amylin pathway.", "es": "CagriSema de Novo (cagrilintida, análogo de amilina, más semaglutida; REDEFINE1 -22,7% vs -2,3%, presentación en EE. UU. diciembre 2025) es un enfoque competidor de amilina distinto y documentado; la patente no monopoliza todas las vías de amilina.", "source_ids": ["ZEAL-SUP-RIVAL2", "ZEAL-SUP-IP"]}, "licensing_and_territory": {"en": "Roche collaboration: 50/50 profit/loss split in US and Europe, Roche exclusive elsewhere paying double-digit to high-teens royalties; upfront USD 1.65bn (1.4bn closing + 250m over two anniversaries) plus USD 1.2bn development and 2.4bn sales milestones; USD 350m agreed for CT-388 combination rights, offset against milestones. Zealand pays ongoing Phase 2b alone; Roche funds commercial manufacturing.", "es": "Colaboración con Roche: reparto 50/50 de ganancias/pérdidas en EE. UU. y Europa, Roche con exclusividad en otros territorios pagando regalías de dos dígitos a dígitos altos teens; adelanto de USD 1.650m (1.400 al cierre + 250 en dos aniversarios) más USD 1.200m en hitos de desarrollo y 2.400 de ventas; USD 350m acordados por derechos de combinación CT-388, compensables contra hitos. Zealand paga sola la Fase 2b en curso; Roche financia fabricación comercial.", "source_ids": ["ZEAL-SUP-05", "REG-ZEAL-01"]}, "enforceability_and_FTO": {"en": "Unknown: grants prove claim-to-molecule links, not validity, infringement exposure or freedom to operate; no legal opinion or adjudication reviewed.", "es": "Desconocido: las concesiones prueban el vínculo reivindicación-molécula, no validez, exposición por infracción ni libertad de operación; sin opinión legal ni fallos revisados.", "source_ids": ["ZEAL-SUP-IP", "ZEAL-SUP-USPTO-12083164"]}}, {"drug": "survodutide", "molecule": {"en": "Investigational synthetic dual glucagon/GLP-1 receptor agonist peptide, per issuer annual report.", "es": "Péptido agonista dual sintético investigacional de glucagón/GLP-1, según el informe anual del emisor.", "source_ids": ["REG-ZEAL-01"]}, "composition_of_matter": {"en": "Unknown: no drug-specific patent identifiers, validated expiry or claim map established in reviewed sources.", "es": "Desconocido: sin identificadores de patente específicos, expiración validada ni mapa de reivindicaciones establecidos en las fuentes revisadas.", "source_ids": ["REG-ZEAL-01"]}, "additional_protection": {"en": "None established beyond the partnership terms described; no granted claim specifically verified for this molecule in the packet.", "es": "Nada establecido más allá de los términos de la asociación descritos; ninguna reivindicación concedida verificada específicamente para esta molécula en el expediente.", "source_ids": ["REG-ZEAL-01"]}, "regulatory_exclusivity": {"en": "None established: Phase 3 SYNCHRONIZE-2 results (76-week treatment-regimen -9.8% vs -3.9% placebo; sponsor headline up to -13.1% vs -3.1%) do not confer authorization.", "es": "Ninguna establecida: los resultados de Fase 3 SYNCHRONIZE-2 (régimen de tratamiento 76 semanas -9,8% vs -3,9% placebo; titular del patrocinador hasta -13,1% vs -3,1%) no otorgan autorización.", "source_ids": ["C-ZEAL-8", "C-ZEAL-4"]}, "competitive_workarounds": {"en": "Lilly tirzepatide beat semaglutide head-to-head (-20.2% vs -13.7% at week 72, SURMOUNT-5), showing how strong incumbent incretins are; survodutide's dual mechanism competes but no direct comparison exists.", "es": "Tirzepatida de Lilly venció a semaglutida cara a cara (-20,2% vs -13,7% en semana 72, SURMOUNT-5), mostrando la fuerza de los incretinas establecidos; el mecanismo dual de survodutide compite, pero no existe comparación directa.", "source_ids": ["ZEAL-SUP-RIVAL"]}, "licensing_and_territory": {"en": "Boehringer Ingelheim funds and solely conducts global development and commercialization; Zealand holds potential milestones and high-single to low-double-digit global-sales royalties (management assertion).", "es": "Boehringer Ingelheim financia y dirige en solitario el desarrollo y comercialización globales; Zealand conserva hitos potenciales y regalías de un dígito alto a dos dígitos bajo sobre ventas globales (afirmación de la dirección).", "source_ids": ["REG-ZEAL-01"]}, "enforceability_and_FTO": {"en": "Unknown: no freedom-to-operate, validity or enforceability evidence reviewed for survodutide.", "es": "Desconocido: sin evidencia de libertad de operación, validez ni exigibilidad revisada para survodutide.", "source_ids": ["REG-ZEAL-01"]}}], "institutional_risk": [{"category": "OFFICIAL FINDING", "agency": "US GAO / FDA", "jurisdiction": "US", "finding": {"en": "GAO found the FDA drug-inspector vacancy rate rose from 9% to 16% between November 2021 and June 2024, reducing inspections; FDA described hiring steps in March 2026.", "es": "El GAO constató que la tasa de vacantes de inspectores de fármacos de la FDA subió del 9% al 16% entre noviembre de 2021 y junio de 2024, reduciendo inspecciones; la FDA describió medidas de contratación en marzo de 2026.", "source_ids": ["REG-COMMON-03"]}, "company_pathway": {"en": "If a Zealand- or partner-relevant facility awaits US inspection at filing time, staffing limits could delay clearance.", "es": "Si una instalación relevante de Zealand o sus socios espera inspección estadounidense al momento del registro, las limitaciones de personal podrían retrasar la autorización.", "source_ids": ["REG-COMMON-03"]}, "limitations": {"en": "No company- or site-specific delay is established; facility exposure is unverified.", "es": "No se establece ningún retraso específico de la empresa o sitio; la exposición de instalaciones no está verificada.", "source_ids": ["REG-COMMON-03"]}}, {"category": "DOCUMENTED FACT", "agency": "FDA / EMA", "jurisdiction": "US / EU", "finding": {"en": "FDA draft obesity guidance (2025) specifies mean percentage weight change versus control as primary endpoint, and EMA's 2016/2017 weight-management guideline sets patient-selection, efficacy and safety documentation standards; both are non-binding or standing standards.", "es": "El borrador de guía de obesidad de la FDA (2025) especifica el cambio porcentual medio de peso frente a control como endpoint primario, y la guía EMA de manejo de peso 2016/2017 fija estándares de selección de pacientes, eficacia y seguridad; ambas son normas no vinculantes o vigentes.", "source_ids": ["REG-COMMON-01", "REG-COMMON-02"]}, "company_pathway": {"en": "Future ZUPREME and Boehringer filings must meet these evidentiary baselines; a guidance change could alter trial design, duration or analyses.", "es": "Los futuros registros de ZUPREME y de Boehringer deben cumplir estas bases probatorias; un cambio de guía podría alterar diseño, duración o análisis de los ensayos.", "source_ids": ["REG-COMMON-01", "REG-COMMON-02"]}, "limitations": {"en": "Shared institutional background only; no company-specific finding, delay or misconduct established.", "es": "Solo antecedentes institucionales compartidos; sin hallazgo, retraso ni mala conducta específicos de la empresa.", "source_ids": ["REG-COMMON-01", "REG-COMMON-02"]}}], "scenarios": [{"type": "bear", "assumption": {"en": "Assume petrelintide Phase 3 misses efficacy or reveals safety signals, or CagriSema and incretin incumbents dominate prescribing.", "es": "Suponga que la Fase 3 de petrelintide falla en eficacia o revela señales de seguridad, o que CagriSema y los incretinas dominan la prescripción.", "source_ids": ["C-ZEAL-3", "ZEAL-SUP-RIVAL2", "C-ZEAL-7"]}, "trigger": {"en": "Negative ZUPREME-3/4/5 readouts or unfavorable competitive label/profile data.", "es": "Lecturas negativas de ZUPREME-3/4/5 o datos competitivos desfavorables de etiqueta/perfil.", "source_ids": ["C-ZEAL-3"]}, "affected_drug_territory": {"en": "Petrelintide across US/Europe and Roche ex-territories; survodutide royalties via Boehringer.", "es": "Petrelintide en EE. UU./Europa y territorios ex de Roche; regalías de survodutide vía Boehringer.", "source_ids": ["ZEAL-SUP-05", "REG-ZEAL-01"]}, "economic_consequence": {"en": "Pipeline value, 50/50 profit share and royalty streams could largely fail to materialize; no probability or haircut assigned.", "es": "El valor del pipeline, el reparto 50/50 y las regalías podrían no materializarse en gran parte; sin probabilidad ni descuento asignados.", "source_ids": ["ZEAL-SUP-05", "REG-ZEAL-01"]}, "timing_and_indicators": {"en": "Phase 3 runs roughly 2026-2029 by design (week-64/77 assessments; ZUPREME-5 up to three years); watch topline, safety tables and competitor filings.", "es": "La Fase 3 transcurre aproximadamente 2026-2029 según diseño (evaluaciones semanas 64/77; ZUPREME-5 hasta tres años); vigilar topline, tablas de seguridad y registros de competidores.", "source_ids": ["C-ZEAL-3", "ZEAL-SUP-RIVAL2"]}}, {"type": "base", "assumption": {"en": "Assume Phase 3 proceeds as designed with results roughly consistent with Phase 2, while approvals remain years away and cash declines with development and buyback spending.", "es": "Suponga que la Fase 3 avanza según lo previsto con resultados coherentes con la Fase 2, mientras las aprobaciones siguen a años y la caja disminuye por desarrollo y recompras.", "source_ids": ["C-ZEAL-3", "C-ZEAL-7", "C-ZEAL-1"]}, "trigger": {"en": "Steady enrollment and data delivery without regulatory surprises.", "es": "Reclutamiento y generación de datos estables sin sorpresas regulatorias.", "source_ids": ["C-ZEAL-3"]}, "affected_drug_territory": {"en": "Petrelintide globally via Roche; survodutide globally via Boehringer; glepaglutide in the EU pending EC decision.", "es": "Petrelintide globalmente vía Roche; survodutide globalmente vía Boehringer; glepaglutide en la UE pendiente de decisión de la CE.", "source_ids": ["ZEAL-SUP-05", "REG-ZEAL-01", "C-ZEAL-5"]}, "economic_consequence": {"en": "Value tracks pipeline progress against ~DKK 1.64bn approximate EV with DKK 14.46bn dated cash; no forecast price implied.", "es": "El valor sigue el avance del pipeline frente a un EV aproximado de DKK 1.640m con DKK 14.457m de caja fechada; sin precio previsto implícito.", "source_ids": ["ZEAL-SUP-01", "ZEAL-SUP-02", "ZEAL-SUP-04"]}, "timing_and_indicators": {"en": "EC decision on Zeydovio, full ZUPREME-2 presentation, EASD/Lancet data and quarterly cash updates are the nearest markers.", "es": "La decisión de la CE sobre Zeydovio, la presentación completa de ZUPREME-2, datos en EASD/Lancet y actualizaciones trimestrales de caja son los hitos más cercanos.", "source_ids": ["C-ZEAL-5", "C-ZEAL-1", "C-ZEAL-2"]}}, {"type": "bull", "assumption": {"en": "Assume petrelintide confirms Phase 2 efficacy with tolerable GI profile in ~7,000-patient Phase 3 and survodutide filings advance, unlocking 50/50 profits and royalties.", "es": "Suponga que petrelintide confirma la eficacia de Fase 2 con perfil GI tolerable en la Fase 3 de ~7.000 pacientes y que los registros de survodutide avanzan, desbloqueando ganancias 50/50 y regalías.", "source_ids": ["C-ZEAL-3", "C-ZEAL-7", "C-ZEAL-8"]}, "trigger": {"en": "Positive pivotal readouts, successful filings and eventual US/EU approvals for petrelintide and survodutide.", "es": "Lecturas pivote positivas, registros exitosos y eventuales aprobaciones en EE. UU./UE para petrelintide y survodutide.", "source_ids": ["C-ZEAL-3", "C-ZEAL-4"]}, "affected_drug_territory": {"en": "Petrelintide US/Europe profit split and ex-territory royalties; survodutide global royalties.", "es": "Reparto de ganancias de petrelintide en EE. UU./Europa y regalías en otros territorios; regalías globales de survodutide.", "source_ids": ["ZEAL-SUP-05", "REG-ZEAL-01"]}, "economic_consequence": {"en": "Large obesity market (WHO: 890m adults with obesity in 2022, a burden not a revenue figure) accessed via partnered economics; magnitude cannot be quantified from the packet.", "es": "Gran mercado de obesidad (OMS: 890m adultos con obesidad en 2022, una carga, no una cifra de ingresos) accesible vía economías asociadas; la magnitud no puede cuantificarse con el expediente.", "source_ids": ["ZEAL-SUP-EPI", "ZEAL-SUP-05"]}, "timing_and_indicators": {"en": "Week-64/77 Phase 3 assessments and Boehringer filing news over roughly 2026-2029; patent maintenance and exclusivity awards would strengthen durability.", "es": "Evaluaciones de Fase 3 en semanas 64/77 y noticias de registro de Boehringer entre aproximadamente 2026-2029; el mantenimiento de patentes y las exclusividades otorgadas reforzarían la durabilidad.", "source_ids": ["C-ZEAL-3", "ZEAL-SUP-USPTO-12083164"]}}], "risk_scenarios": [{"kind": "regulatory_downside", "trigger": {"en": "FDA/EMA requests additional efficacy, safety or CMC evidence, restricts a label, or a manufacturing inspection finds deficiencies.", "es": "FDA/EMA solicita evidencia adicional de eficacia, seguridad o CMC, restringe una etiqueta, o una inspección de fabricación halla deficiencias.", "source_ids": ["REG-COMMON-01"]}, "affected_drug_territory": {"en": "Petrelintide and survodutide in the US/EU where filed; glepaglutide EU approval currently pending EC decision.", "es": "Petrelintide y survodutide en EE. UU./UE donde se registren; aprobación europea de glepaglutide actualmente pendiente de decisión de la CE.", "source_ids": ["C-ZEAL-5", "REG-COMMON-01"]}, "economic_consequence": {"en": "Review delay or label limits could postpone launch, shrink eligible populations or raise costs; partnered royalties and milestones might shift rather than direct sales.", "es": "Un retraso o límites de etiqueta podrían posponer el lanzamiento, reducir poblaciones elegibles o encarecer costos; las regalías e hitos asociados podrían desplazarse en lugar de ventas directas.", "source_ids": ["REG-ZEAL-01"]}, "timing_and_indicators": {"en": "Next filings/inspections or postmarketing reviews; drug-specific schedule unknown. Watch FDA/EMA decision records, inspection findings and partner filing updates.", "es": "Próximos registros/inspecciones o revisiones postcomercialización; calendario específico desconocido. Vigilar decisiones FDA/EMA, hallazgos de inspección y actualizaciones de registro de los socios.", "source_ids": ["REG-COMMON-03"]}, "mitigation_or_counterevidence": {"en": "Shared GAO staffing findings do not establish any Zealand-specific delay; no company-specific regulatory misconduct or adverse finding exists in reviewed sources.", "es": "Los hallazgos compartidos del GAO sobre personal no establecen retraso alguno específico de Zealand; no existe hallazgo adverso ni mala conducta regulatoria específica en las fuentes revisadas.", "source_ids": ["REG-COMMON-03", "REG-COMMON-07"]}}, {"kind": "ip_loss", "trigger": {"en": "Relevant petrelintide claims expire, are narrowed or invalidated, or a lawful competing amylin molecule or combination (e.g., CagriSema-type) gains authorization.", "es": "Las reivindicaciones relevantes de petrelintide expiran, se limitan o se invalidan, o una molécula o combinación competidora legal de amilina (p. ej., tipo CagriSema) obtiene autorización.", "source_ids": ["ZEAL-SUP-IP", "ZEAL-SUP-RIVAL2"]}, "affected_drug_territory": {"en": "Petrelintide in all territories (US/Europe profit share; Roche ex-territory royalties).", "es": "Petrelintide en todos los territorios (reparto de ganancias EE. UU./Europa; regalías de Roche en otros territorios).", "source_ids": ["ZEAL-SUP-05"]}, "economic_consequence": {"en": "Weaker exclusivity could increase competition and compress the 50/50 profit share and royalty value; no numerical sensitivity is assigned.", "es": "Una exclusividad más débil podría aumentar la competencia y comprimir el reparto 50/50 y el valor de las regalías; sin sensibilidad numérica asignada.", "source_ids": ["ZEAL-SUP-05"]}, "timing_and_indicators": {"en": "EP filing 2017-09-11 implies a conditional 2037 twenty-year term; US grant carries PTA and terminal disclaimer making effective expiry unverified. Watch patent-office records, litigation and generic/alternative approvals.", "es": "La presentación EP del 11-09-2017 implica un plazo condicional de veinte años hasta 2037; la concesión estadounidense lleva ajuste de plazo y declaración de término conjunto, por lo que la expiración efectiva no está verificada. Vigilar registros de patentes, litigios y aprobaciones de genéricos/alternativas.", "source_ids": ["ZEAL-SUP-IP", "ZEAL-SUP-USPTO-12083164"]}, "mitigation_or_counterevidence": {"en": "Granted EP and US composition claims explicitly linked to petrelintide provide real, documented barriers; differentiated clinical profile and Roche's manufacturing/distribution may partly offset competitive pressure.", "es": "Las reivindicaciones de composición EP y EE. UU. concedidas y vinculadas explícitamente a petrelintide ofrecen barreras reales y documentadas; un perfil clínico diferenciado y la fabricación/distribución de Roche podrían compensar parcialmente la presión competitiva.", "source_ids": ["ZEAL-SUP-IP", "ZEAL-SUP-USPTO-12083164", "ZEAL-SUP-05"]}}], "ratings": [{"dimension": "clinical_evidence", "rating": "FAIR", "reason": {"en": "Peer-reviewed Phase 2 wins in both non-diabetic and T2D obesity are strong, but no Phase 3 data or approval exists yet.", "es": "Éxitos de Fase 2 revisados por pares tanto en obesidad no diabética como en DBT2 son sólidos, pero aún no hay datos de Fase 3 ni aprobación.", "source_ids": ["C-ZEAL-7", "C-ZEAL-1", "C-ZEAL-3"]}}, {"dimension": "ip_economic_defensibility", "rating": "MIDDLING", "reason": {"en": "Granted EP/US composition claims are explicitly linked to petrelintide, but effective US expiry (terminal disclaimer), maintenance, survodutide patents and FTO are unverified.", "es": "Reivindicaciones de composición EP/EE. UU. concedidas están vinculadas explícitamente a petrelintide, pero la expiración efectiva estadounidense (declaración de término), el mantenimiento, las patentes de survodutide y la FTO no están verificados.", "source_ids": ["ZEAL-SUP-IP", "ZEAL-SUP-USPTO-12083164", "REG-ZEAL-01"]}}, {"dimension": "financial_strength", "rating": "GOOD", "reason": {"en": "DKK 14,457m cash plus securities versus DKK 312m borrowings and modest H1 operating cash use of DKK 266m, with dated-balance caveats.", "es": "DKK 14.457m en efectivo más valores frente a DKK 312m de deuda y un modesto uso de caja operativa de DKK 266m en el S1, con salvedades de saldo fechado.", "source_ids": ["ZEAL-F1"]}}, {"dimension": "regulatory_exposure", "rating": "FAIR", "reason": {"en": "No company-specific adverse findings; exposure is ordinary trial-and-filing risk under FDA/EMA obesity standards, with glepaglutide's EC decision pending.", "es": "Sin hallazgos adversos específicos de la empresa; la exposición es riesgo ordinario de ensayo y registro bajo estándares de obesidad FDA/EMA, con decisión de la CE sobre glepaglutide pendiente.", "source_ids": ["REG-COMMON-01", "REG-COMMON-02", "C-ZEAL-5"]}}, {"dimension": "competitive_position", "rating": "MIDDLING", "reason": {"en": "Incretin incumbents reported larger numerical weight losses in different trials, not head-to-head against petrelintide (-20.2% tirzepatide; CagriSema -22.7% efficacy estimand) while petrelintide's tolerability differentiation rests on early data with nausea 20% vs 6%.", "es": "Los incretinas establecidos notificaron pérdidas numéricamente mayores en ensayos distintos, sin comparación directa con petrelintida (-20,2% tirzepatida; CagriSema -22,7% estimando de eficacia), mientras la diferenciación de tolerabilidad de petrelintide se apoya en datos tempranos con náusea 20% vs 6%.", "source_ids": ["ZEAL-SUP-RIVAL", "ZEAL-SUP-RIVAL2", "C-ZEAL-7"]}}, {"dimension": "valuation_attractiveness", "rating": "MIDDLING", "reason": {"en": "Prepared arithmetic implies ~DKK 1.64bn approximate EV against DKK 14.46bn dated cash and two partnered late-preclinical-to-Phase-3 assets, but this is not a reconciled, current comparable valuation.", "es": "La aritmética preparada implica un EV aproximado de ~DKK 1.640m frente a DKK 14.457m de caja fechada y dos activos asociados de fase tardía preclínica a Fase 3, pero no es una valoración comparable actual conciliada.", "source_ids": ["ZEAL-SUP-01", "ZEAL-SUP-04", "ZEAL-SUP-02"]}}, {"dimension": "catalyst_quality", "rating": "FAIR", "reason": {"en": "Real near-term markers exist (Zeydovio EC decision pending, full ZUPREME-2 data), but the decisive petrelintide pivotal readouts are roughly 2026-2029.", "es": "Existen hitos cercanos reales (decisión de la CE sobre Zeydovio pendiente, datos completos de ZUPREME-2), pero las lecturas pivote decisivas de petrelintide están aproximadamente entre 2026-2029.", "source_ids": ["C-ZEAL-5", "C-ZEAL-1", "C-ZEAL-3"]}}], "unknowns": [{"en": "Survodutide patent protection: no drug-specific claim map, expiry or FTO evidence exists in the packet.", "es": "Protección por patente de survodutide: no existe mapa de reivindicaciones, expiración ni evidencia de FTO en el expediente.", "source_ids": ["REG-ZEAL-01"]}, {"en": "Current national maintenance status, terminal-disclaimer effect and legal enforceability of the US petrelintide composition patent remain unestablished.", "es": "El estado actual de mantenimiento, el efecto de la declaración de término conjunto y la exigibilidad legal de la patente estadounidense de composición de petrelintide siguen sin establecerse.", "source_ids": ["ZEAL-SUP-USPTO-12083164"]}, {"en": "Same-day current cash, share count and diluted ownership cannot be reconstructed; June balances, October buyback completion and unbridged flows differ in date.", "es": "No pueden reconstruirse caja, número de acciones ni propiedad diluida a la misma fecha; los saldos de junio, la recompra completada en octubre y los flujos no conciliados difieren en fecha.", "source_ids": ["ZEAL-SUP-02", "ZEAL-SUP-04"]}, {"en": "Personal broker acceptance and exact orderability of the Danish ZEAL ordinary share were not verified, only public IB country/market eligibility.", "es": "No se verificó la aceptación personal del bróker ni la negociabilidad exacta de la acción ordinaria danesa ZEAL, solo la elegibilidad pública de IB por país/mercado.", "source_ids": ["ZEAL-SUP-03", "ZEAL-SUP-BROKER"]}, {"en": "CagriSema remains investigational in the latest retrieved sponsor update (September 30, 2026); the US decision is management-expected in Q4 2026. Its future decision outcome remains uncertain.", "es": "CagriSema sigue en investigación según la actualización del patrocinador del 30 de septiembre de 2026; la dirección espera la decisión estadounidense en el 4T de 2026. El resultado futuro de esa decisión sigue siendo incierto.", "source_ids": ["ZEAL-QA-CAGRI", "ZEAL-QA-CAGRI-TIMING"]}], "coverage_boundary": {"en": "Judgment covers Zealand Pharma A/S (ZEAL, Nasdaq Copenhagen, DKK ordinary share) through the 2026-10-11 cutoff, focused on petrelintide and partnered survodutide; glepaglutide (CHMP positive opinion, EC decision pending) and dasiglucagon are covered only for regulatory status. Patent mapping, institutional-risk tracing and epidemiology were bounded passes; dapiglutide (paused) and other programs were not assessed.", "es": "El juicio cubre Zealand Pharma A/S (ZEAL, Nasdaq Copenhagen, acción ordinaria en DKK) hasta el corte del 11-10-2026, centrado en petrelintide y survodutide asociado; glepaglutide (opinión positiva del CHMP, decisión de la CE pendiente) y dasiglucagon se cubren solo por estado regulatorio. El mapeo de patentes, el seguimiento de riesgos institucionales y la epidemiología fueron pasadas acotadas; dapiglutide (en pausa) y otros programas no fueron evaluados.", "source_ids": ["ID-ZEAL-01", "C-ZEAL-5", "C-ZEAL-6", "REG-ZEAL-01"]}}, {"ticker": "KLRA", "company": "Kailera Therapeutics, Inc.", "class": "clinical_stage_biotech", "cutoff": "2026-10-11", "regulatory_chips": [], "card": {"what_you_buy": {"en": "A clinical-stage stake in ribupatide, a GLP-1/GIP dual-agonist peptide in Phase 3 for obesity without diabetes; in a Chinese Phase 2, oral ribupatide showed 12.1% mean weight loss at week 26 versus 2.3% placebo, global KaiNETIC Phase 3 results and approvals are pending. Separately, Chinese injectable GEMINI-1 Phase 3 reported 17.7% weight loss at 48 weeks (6 mg, treatment-policy estimand).", "es": "Una participación clínica en ribupatida, un péptido dual agonista GLP-1/GIP en fase 3 para obesidad sin diabetes; en una fase 2 en China, la ribupatida oral mostró una pérdida media de peso del 12,1% a la semana 26 frente al 2,3% con placebo, siguen pendientes los resultados globales de fase 3 KaiNETIC y las aprobaciones. Por separado, GEMINI-1 de fase 3 en China notificó una pérdida de peso del 17,7% a las 48 semanas con ribupatida inyectable (6 mg, estimando de política de tratamiento).", "source_ids": ["C-KLRA-4", "C-KLRA-1", "ID-KLRA-03", "1276-NEW-01", "1276-NEW-02"]}, "why_it_could_work": {"en": "Kailera holds exclusive rights outside Greater China to Hengrui's obesity portfolio, addressing a large burden (WHO: about 890 million adults with obesity in 2022); durable value depends on winning pivotal trials against established incretins and on license economics owed to Hengrui.", "es": "Kailera posee derechos exclusivos fuera de la Gran China sobre la cartera de obesidad de Hengrui, frente a una carga elevada (OMS: unos 890 millones de adultos con obesidad en 2022); el valor duradero depende de ganar los ensayos pivotales frente a incretinas establecidas y de la economía de la licencia debida a Hengrui.", "source_ids": ["ID-KLRA-02", "KLRA-SUP-EPI", "KLRA-SUP-04"]}, "what_can_kill_it": {"en": "Documented: no approval and no global KaiNETIC Phase 3 efficacy data yet, and KaiNETIC-3 must still test superiority versus semaglutide. Conditional: failed or late trials, regulatory setbacks, or IP that does not cover the exact molecule would erode value, while tirzepatide (−20.2%) and CagriSema (−22.7%) set demanding benchmarks.", "es": "Documentado: aún no hay aprobación ni datos globales de eficacia de fase 3 KaiNETIC, y KaiNETIC-3 aún debe probar superioridad frente a semaglutida. Condicional: ensayos fallidos o tardíos, contratiempos regulatorios o una PI que no cubra la molécula exacta erosionarían el valor, mientras que tirzepatida (−20,2%) y CagriSema (−22,7%) marcan referencias exigentes.", "source_ids": ["C-KLRA-2", "C-KLRA-1", "KLRA-SUP-RIVAL", "KLRA-SUP-RIVAL2", "REG-KLRA-01"]}, "financial_strength": {"en": "USD 1,171.8m in cash and securities (30 Jun 2026) with no borrowing debt reported supports management's guidance of funding into mid-2028, though H1-2026 operating burn was USD 145.8m and contingent Hengrui milestones reach up to USD 5.7bn.", "es": "USD 1.171,8 millones en efectivo y valores (30-jun-2026) sin deuda bancaria reportada respaldan la previsión de financiación hasta mediados de 2028, aunque el consumo operativo del 1S-2026 fue de USD 145,8 millones y los hitos contingentes a Hengrui alcanzan hasta USD 5.700 millones.", "source_ids": ["KLRA-F1"]}, "valuation": {"en": "At the 9 Oct 2026 close of USD 11.61, supplied calculations give a basic market cap of about USD 1,505m and enterprise value of about USD 333m on dated, not same-day, inputs, so the market prices the pipeline modestly above net cash, but with no approved product intrinsic value remains unverifiable.", "es": "Al cierre del 9-oct-2026 de USD 11,61, los cálculos suministrados dan una capitalización básica de unos USD 1.505 millones y un valor empresarial de unos USD 333 millones con datos fechados, no sincronizados, de modo que el mercado precia la cartera modestamente por encima del efectivo neto, pero sin producto aprobado el valor intrínseco sigue sin poder verificarse.", "source_ids": ["KLRA-SUP-01", "KLRA-SUP-02"]}, "next_catalyst": {"en": "Company-guided US injectable ribupatide Phase 2b high-dose obesity data anticipated around mid-2027, with oral Phase 3 start planned in H1-2027; these are management timelines, not verified schedules.", "es": "Datos de fase 2b de alta dosis de ribupatida inyectable en EE. UU. previstos hacia mediados de 2027 según la compañía, con inicio de la fase 3 oral planificado para el 1S-2027; son cronogramas de la dirección, no calendarios verificados.", "source_ids": ["C-KLRA-5"]}}, "valuation_inputs": [{"label": {"en": "Closing price, Nasdaq common stock", "es": "Precio de cierre, acción común de Nasdaq"}, "value": 11.61, "unit": "USD per share", "as_of": "2026-10-09", "source_ids": ["KLRA-SUP-01"], "unknown_reason": null}, {"label": {"en": "Common shares outstanding (cover-date count; not a same-day October count)", "es": "Acciones comunes en circulación (cuenta de portada; no sincrónica con octubre)"}, "value": 129643676, "unit": "shares", "as_of": "2026-08-06", "source_ids": ["KLRA-SUP-02"], "unknown_reason": null}, {"label": {"en": "Cash, cash equivalents and marketable securities", "es": "Efectivo, equivalentes y valores negociables"}, "value": 1171.8, "unit": "USD million", "as_of": "2026-06-30", "source_ids": ["KLRA-F1"], "unknown_reason": null}, {"label": {"en": "Borrowing debt (none reported on the June 2026 balance sheet)", "es": "Deuda financiera (ninguna reportada en el balance de junio de 2026)"}, "value": 0, "unit": "USD million", "as_of": "2026-06-30", "source_ids": ["KLRA-SUP-02"], "unknown_reason": null}, {"label": {"en": "Operating leases, excluded from the supplied EV calculation and separately addable", "es": "Arrendamientos operativos, excluidos del cálculo de VE suministrado y sumables por separado"}, "value": 10.216, "unit": "USD million", "as_of": "2026-06-30", "source_ids": ["KLRA-SUP-02"], "unknown_reason": null}, {"label": {"en": "Net cash used in operating activities, first half 2026", "es": "Efectivo neto usado en actividades operativas, primer semestre de 2026"}, "value": 145.837, "unit": "USD million", "as_of": "2026-H1", "source_ids": ["KLRA-F1"], "unknown_reason": null}, {"label": {"en": "IPO net proceeds; already included in June cash, so not added again", "es": "Producto neto de la OPI; ya incluido en el efectivo de junio, no se vuelve a sumar"}, "value": 662.0, "unit": "USD million", "as_of": "2026-04-20", "source_ids": ["KLRA-F1"], "unknown_reason": null}, {"label": {"en": "Basic market capitalisation (calculation: close × dated shares; excludes options, awards and contingencies)", "es": "Capitalización bursátil básica (cálculo: cierre × acciones fechadas; excluye opciones, entregas y contingencias)"}, "value": 1505163078.36, "unit": "USD", "as_of": "price 2026-10-09; shares 2026-08-06", "source_ids": ["KLRA-SUP-01", "KLRA-SUP-02"], "unknown_reason": null}, {"label": {"en": "Approximate basic enterprise value (calculation: close × dated shares − June cash/investments; leases and post-June spending not folded in)", "es": "Valor empresarial básico aproximado (cálculo: cierre × acciones fechadas − efectivo/valores de junio; sin incluir arrendamientos ni gasto posterior a junio)"}, "value": 333363078.36, "unit": "USD", "as_of": "price 2026-10-09; balance sheet 2026-06-30; shares 2026-08-06", "source_ids": ["KLRA-SUP-01", "KLRA-SUP-02"], "unknown_reason": null}], "defensibility": [{"drug": "ribupatide (KAI-9531/HRS9531), injection and oral", "molecule": {"en": "Ribupatide is a GLP-1/GIP receptor dual-agonist peptide licensed from Hengrui, developed as weekly injectable and oral formulations.", "es": "La ribupatida es un péptido dual agonista de los receptores GLP-1/GIP licenciado de Hengrui, desarrollado en formulaciones inyectable semanal y oral.", "source_ids": ["ID-KLRA-03", "KLRA-SUP-PROS", "REG-KLRA-01"]}, "composition_of_matter": {"en": "Issuer reports six in-licensed patent families, one allowed US composition application plus granted/allowed/pending coverage in 15 foreign jurisdictions and potential 2041 expiry if issued; a candidate family includes WO2021239082A1, CN114222755B and mirror-reported US grant US12653865 (16 Jun 2026, assignee Jiangsu Hengrui), but mapping the exact ribupatide structure to a granted claim is unproven.", "es": "El emisor informa seis familias patentarias licenciadas, una solicitud estadounidense de composición permitida más cobertura concedida/permitida/pendiente en 15 jurisdicciones y posible vencimiento en 2041 si se concede; una familia candidata incluye WO2021239082A1, CN114222755B y la patente estadounidense US12653865 reportada por espejos (16-jun-2026, titular Jiangsu Hengrui), pero mapear la estructura exacta de ribupatida a una reivindicación concedida no está probado.", "source_ids": ["REG-KLRA-01", "1276-NEW-14", "1276-NEW-15"]}, "additional_protection": {"en": "No separate formulation, manufacturing know-how or other product-specific protection is established in the reviewed filings beyond the reported patent families.", "es": "Ninguna protección adicional de formulación, know-how de fabricación u otra específica del producto queda establecida en los expedientes revisados más allá de las familias patentarias reportadas.", "source_ids": ["REG-KLRA-01"]}, "regulatory_exclusivity": {"en": "No marketing approval or awarded regulatory exclusivity is established in Kailera territories; FDA draft obesity guidance and the EMA 2017 weight-management guideline define the evidentiary standards any filing must meet.", "es": "No hay aprobación de comercialización ni exclusividad regulatoria otorgada establecida en los territorios de Kailera; el borrador de guía de obesidad de la FDA y la guía EMA de 2017 sobre control de peso definen los estándares probatorios para cualquier presentación.", "source_ids": ["REG-COMMON-01", "REG-COMMON-02"]}, "competitive_workarounds": {"en": "The weekly incretin field is crowded: tirzepatide achieved −20.2% versus semaglutide −13.7% at week 72 in SURMOUNT5, and Novo's CagriSema reported −22.7% in REDEFINE1 with a December 2025 US filing, so rivals could out-perform or design around; the oral small-molecule KAI-7535 adds internal but non-peptide competition context.", "es": "El campo de incretinas semanales está saturado: tirzepatida logró −20,2% frente a −13,7% de semaglutida a la semana 72 en SURMOUNT5, y CagriSema de Novo reportó −22,7% en REDEFINE1 con presentación en EE. UU. en diciembre de 2025, por lo que los rivales podrían superarla o diseñar alternativas; la small molecule oral KAI-7535 añade contexto competitivo interno, aunque no peptídico.", "source_ids": ["KLRA-SUP-RIVAL", "KLRA-SUP-RIVAL2", "ID-KLRA-03"]}, "licensing_and_territory": {"en": "Hengrui grants exclusive, royalty-bearing, sublicensable rights outside Greater China (China, Hong Kong, Macau, Taiwan); Kailera owes diligence, milestones up to USD 200m clinical/regulatory and USD 5.7bn commercial, and tiered royalties of mid-single to low-tens percent of net sales, and uncured breach can terminate the rights.", "es": "Hengrui otorga derechos exclusivos, sujetos a regalías y sublicenciables fuera de la Gran China (China, Hong Kong, Macao y Taiwán); Kailera debe diligencia, hitos de hasta USD 200 millones clínicos/regulatorios y USD 5.700 millones comerciales, y regalías escalonadas de un dígito medio a decenas bajos por ciento de ventas netas, y un incumplimiento no subsanado puede terminar los derechos.", "source_ids": ["ID-KLRA-02", "REG-KLRA-01", "KLRA-SUP-04"]}, "enforceability_and_FTO": {"en": "Unknown: no legal opinion or adjudication establishes validity, enforceability or freedom to operate, the issuer's 2041 expiry is a management claim, and mirror-reported grant status is not a live patent-office certificate.", "es": "Desconocido: ninguna opinión legal ni sentencia establece validez, exigibilidad o libertad de operación, el vencimiento de 2041 del emisor es una afirmación gerencial, y el estado de concesión reportado por espejos no es un certificado oficial de patente.", "source_ids": ["REG-KLRA-01", "1276-NEW-15"]}}, {"drug": "KAI-4729, injectable tri-agonist peptide", "molecule": {"en": "KAI-4729 is an injectable peptide triple GLP-1/GIP/glucagon agonist with Phase 1 initiation planned by end-2026 and data expected in 2027; no human efficacy result or approval exists.", "es": "KAI-4729 es un péptido triple agonista GLP-1/GIP/glucagón inyectable con inicio de fase 1 previsto para finales de 2026 y datos esperados en 2027; no existe resultado de eficacia en humanos ni aprobación.", "source_ids": ["C-KLRA-5"]}, "composition_of_matter": {"en": "Issuer reports only one pending international PCT application for the tri-agonist program; no issued claim or expiry is established.", "es": "El emisor reporta solo una solicitud PCT internacional pendiente para el programa tri-agonista; no hay reivindicación concedida ni vencimiento establecido.", "source_ids": ["REG-KLRA-01"]}, "additional_protection": {"en": "No additional product-specific protection is established in the reviewed filings.", "es": "No se establece protección adicional específica del producto en los expedientes revisados.", "source_ids": ["REG-KLRA-01"]}, "regulatory_exclusivity": {"en": "No approval or awarded regulatory exclusivity exists; any US/EU filing would fall under the FDA draft obesity guidance and EMA weight-management standards.", "es": "No existe aprobación ni exclusividad regulatoria otorgada; cualquier presentación en EE. UU./UE caería bajo el borrador de guía de obesidad de la FDA y los estándares de la EMA sobre control de peso.", "source_ids": ["REG-COMMON-01", "REG-COMMON-02"]}, "competitive_workarounds": {"en": "Tri-agonist competition is unproven for Kailera while rivals advance combination and multi-agonist assets such as CagriSema, so differentiation is hypothetical until human data exist.", "es": "La competencia tri-agonista no está probada para Kailera mientras rivales avanzan activos en combinación y multi-agonistas como CagriSema, por lo que la diferenciación es hipotética hasta que existan datos en humanos.", "source_ids": ["KLRA-SUP-RIVAL2"]}, "licensing_and_territory": {"en": "Covered by the same Hengrui license structure: exclusive rights outside Greater China with diligence, milestone and royalty obligations.", "es": "Cubierto por la misma estructura de licencia de Hengrui: derechos exclusivos fuera de la Gran China con obligaciones de diligencia, hitos y regalías.", "source_ids": ["ID-KLRA-02", "REG-KLRA-01"]}, "enforceability_and_FTO": {"en": "Unknown: a pending PCT application confers no granted right, and enforceability or freedom to operate is unassessed.", "es": "Desconocido: una solicitud PCT pendiente no confiere derecho concedido, y la exigibilidad o libertad de operación no está evaluada.", "source_ids": ["REG-KLRA-01"]}}], "institutional_risk": [{"category": "DOCUMENTED FACT", "agency": "FDA", "jurisdiction": "US", "finding": {"en": "FDA's draft obesity guidance (7 Jan 2025, draft, not for implementation) specifies adult mean percentage body-weight change versus control as the primary efficacy endpoint.", "es": "El borrador de guía de obesidad de la FDA (7-ene-2025, borrador, no para implementación) especifica el cambio porcentual medio de peso corporal frente a control como criterio principal de eficacia en adultos.", "source_ids": ["REG-COMMON-01"]}, "company_pathway": {"en": "KaiNETIC trials already use percent weight change endpoints, consistent with the draft standard; a future revision could alter trial design, duration or required analyses for pending filings.", "es": "Los ensayos KaiNETIC ya usan criterios de cambio porcentual de peso, consistentes con el borrador; una revisión futura podría alterar el diseño, duración o análisis requeridos para presentaciones pendientes.", "source_ids": ["C-KLRA-1", "REG-COMMON-01"]}, "limitations": {"en": "The guidance is a draft and not binding, and no company-specific adverse finding is established.", "es": "La guía es un borrador no vinculante y no se establece ningún hallazgo adverso específico de la compañía.", "source_ids": ["REG-COMMON-01"]}}, {"category": "OFFICIAL FINDING", "agency": "US GAO / FDA", "jurisdiction": "US", "finding": {"en": "GAO found the FDA drug-inspector vacancy rate rose from 9% to 16% between November 2021 and June 2024, reducing inspections; FDA described hiring steps in March 2026.", "es": "La GAO halló que la tasa de vacantes de inspectores de medicamentos de la FDA subió del 9% al 16% entre noviembre de 2021 y junio de 2024, reduciendo inspecciones; la FDA describió medidas de contratación en marzo de 2026.", "source_ids": ["REG-COMMON-03"]}, "company_pathway": {"en": "If a Kailera-relevant manufacturing facility awaited pre-approval inspection, staffing limits could delay clearance before any launch.", "es": "Si una planta manufacturera relevante para Kailera esperara inspección previa a la aprobación, las limitaciones de personal podrían retrasar la autorización antes de cualquier lanzamiento.", "source_ids": ["REG-COMMON-03"]}, "limitations": {"en": "No company-specific inspection delay is established and facility exposure is unverified; this is shared institutional background.", "es": "No se establece retraso de inspección específico de la compañía y la exposición de plantas no está verificada; es antecedente institucional compartido.", "source_ids": ["REG-COMMON-03"]}}, {"category": "DOCUMENTED FACT", "agency": "EMA", "jurisdiction": "EU", "finding": {"en": "The EMA weight-management clinical guideline, effective 2017, sets patient-selection, efficacy and safety documentation expectations for EU obesity filings.", "es": "La guía clínica de la EMA sobre control de peso, vigente desde 2017, fija expectativas de selección de pacientes, documentación de eficacia y seguridad para presentaciones de obesidad en la UE.", "source_ids": ["REG-COMMON-02"]}, "company_pathway": {"en": "Any future European ribupatide or KAI-4729 authorization package must meet CHMP expectations under this guideline, shaping trial size and duration.", "es": "Cualquier futuro expediente europeo de ribupatida o KAI-4729 debe cumplir las expectativas del CHMP bajo esta guía, moldeando el tamaño y la duración de los ensayos.", "source_ids": ["REG-COMMON-02"]}, "limitations": {"en": "This is a standing standard, not a company-specific finding; materiality and timing for Kailera products are unknown.", "es": "Es un estándar vigente, no un hallazgo específico de la compañía; la materialidad y el calendario para los productos de Kailera son desconocidos.", "source_ids": ["REG-COMMON-02"]}}, {"category": "DOCUMENTED FACT", "agency": "EMA", "jurisdiction": "EU", "finding": {"en": "EMA's revised Policy 0044, effective 1 May 2025, excludes experts with current product interests and aligns a three-year cooling-off for specified past industry roles, following CJEU impartiality rulings.", "es": "La Política 0044 revisada de la EMA, vigente desde el 1-may-2025, excluye a expertos con intereses actuales en un producto y alinea un período de enfriamiento de tres años para ciertos roles industriales pasados, tras sentencias del TJUE sobre imparcialidad.", "source_ids": ["REG-COMMON-07"]}, "company_pathway": {"en": "Expert eligibility could affect the composition or timing of a future CHMP assessment of a Kailera product if a challenge or restriction arose.", "es": "La elegibilidad de expertos podría afectar la composición o el calendario de una futura evaluación del CHMP de un producto de Kailera si surgiera una impugnación o restricción.", "source_ids": ["REG-COMMON-07"]}, "limitations": {"en": "This is a procedural response to unrelated court cases, not a finding of corruption or any company-specific conflict; no covered-product conflict is established.", "es": "Es una respuesta procesal a casos judiciales ajenos, no un hallazgo de corrupción ni conflicto específico de la compañía; no se establece conflicto en productos cubiertos.", "source_ids": ["REG-COMMON-07"]}}], "scenarios": [{"type": "bear", "assumption": {"en": "Phase 3 results disappoint, fail to show superiority over semaglutide, or the oral formulation does not translate across regions, while protection remains unproven.", "es": "Los resultados de fase 3 decepcionan, no muestran superioridad frente a semaglutida, o la formulación oral no se traslada entre regiones, mientras la protección sigue sin probarse.", "source_ids": ["C-KLRA-2", "C-KLRA-4", "REG-KLRA-01"]}, "trigger": {"en": "KaiNETIC-1/KaiNETIC-3 readouts in 2028 or interim safety/CMC issues.", "es": "Lecturas de KaiNETIC-1/KaiNETIC-3 en 2028 o problemas interinos de seguridad/CMC.", "source_ids": ["C-KLRA-1", "C-KLRA-2"]}, "affected_drug_territory": {"en": "Ribupatide injectable and oral in US/EU and other ex-Greater-China territories.", "es": "Ribupatida inyectable y oral en EE. UU./UE y otros territorios fuera de la Gran China.", "source_ids": ["ID-KLRA-02"]}, "economic_consequence": {"en": "Pipeline value could compress toward the cash balance as burn continues; contingent Hengrui milestones would likely never trigger, but the license and runway would dominate remaining value.", "es": "El valor de la cartera podría comprimirse hacia el saldo de efectivo a medida que continúa el consumo; los hitos contingentes a Hengrui probablemente nunca se activarían, pero la licencia y la pista financiera dominarían el valor restante.", "source_ids": ["KLRA-F1", "KLRA-SUP-04"]}, "timing_and_indicators": {"en": "Watch mid-2027 Phase 2b high-dose data, oral Phase 3 start, and registry/patient milestones through 2028 primary completions.", "es": "Vigilar datos de fase 2b de alta dosis a mediados de 2027, inicio de la fase 3 oral y hitos de registro/pacientes hasta las finalizaciones principales de 2028.", "source_ids": ["C-KLRA-5", "C-KLRA-1", "C-KLRA-2"]}}, {"type": "base", "assumption": {"en": "Trials complete as enrolled and read out around 2028 with competitive but not class-leading efficacy; the oral program advances and IP issues are resolved without litigation.", "es": "Los ensayos se completan según lo inscrito y leen hacia 2028 con eficacia competitiva pero no líder de clase; el programa oral avanza y los temas de PI se resuelven sin litigio.", "source_ids": ["C-KLRA-3", "C-KLRA-1", "C-KLRA-2"]}, "trigger": {"en": "Successful 2028 primary completions followed by FDA/EMA filings under current standards.", "es": "Finalizaciones principales exitosas en 2028 seguidas de presentaciones a FDA/EMA bajo los estándares vigentes.", "source_ids": ["REG-COMMON-01", "REG-COMMON-02"]}, "affected_drug_territory": {"en": "Ribupatide injectable and oral across ex-Greater-China territories.", "es": "Ribupatida inyectable y oral en territorios fuera de la Gran China.", "source_ids": ["ID-KLRA-02"]}, "economic_consequence": {"en": "Value would depend on marketed pricing and reimbursement against entrenched incumbents, net of Hengrui milestones and mid-single to low-tens percent royalties; no numeric outcome is supportable from current evidence.", "es": "El valor dependería de precios y reembolsos frente a incumbentes consolidados, netos de hitos y regalías a Hengrui de un dígito medio a decenas bajos por ciento; ningún resultado numérico es sostenible con la evidencia actual.", "source_ids": ["KLRA-SUP-RIVAL", "KLRA-SUP-04"]}, "timing_and_indicators": {"en": "2027 Phase 2b and oral Phase 3 start; 2028 pivotal data; Hengrui royalty/milestone disclosures.", "es": "Fase 2b de 2027 e inicio de fase 3 oral; datos pivotales de 2028; divulgaciones de regalías/hitos de Hengrui.", "source_ids": ["C-KLRA-5", "KLRA-SUP-04"]}}, {"type": "bull", "assumption": {"en": "Pivotal data show clear weight-loss efficacy with tolerable safety and KaiNETIC-3 demonstrates superiority versus semaglutide; granted composition claims cover the product through roughly 2041.", "es": "Los datos pivotales muestran clara eficacia en pérdida de peso con seguridad tolerable y KaiNETIC-3 demuestra superioridad frente a semaglutida; reivindicaciones de composición concedidas cubren el producto hasta aproximadamente 2041.", "source_ids": ["C-KLRA-2", "C-KLRA-4", "REG-KLRA-01", "1276-NEW-15"]}, "trigger": {"en": "Strong 2028 pivotal readouts, successful oral Phase 3 from 2027, and KAI-4729 Phase 1 data in 2027.", "es": "Fuertes lecturas pivotales en 2028, fase 3 oral exitosa desde 2027 y datos de fase 1 de KAI-4729 en 2027.", "source_ids": ["C-KLRA-5"]}, "affected_drug_territory": {"en": "Ribupatide injectable/oral and KAI-4729 in ex-Greater-China territories.", "es": "Ribupatida inyectable/oral y KAI-4729 en territorios fuera de la Gran China.", "source_ids": ["ID-KLRA-02"]}, "economic_consequence": {"en": "Multiple advancing assets in a large obesity market (WHO: 890m adults with obesity, 2022) could support substantially higher value, still net of Hengrui milestones up to USD 5.7bn and tiered royalties.", "es": "Múltiples activos en avance en un gran mercado de obesidad (OMS: 890 millones de adultos con obesidad en 2022) podrían sustentar un valor sustancialmente mayor, aún neto de hitos a Hengrui de hasta USD 5.700 millones y regalías escalonadas.", "source_ids": ["KLRA-SUP-EPI", "KLRA-SUP-04"]}, "timing_and_indicators": {"en": "2027-2028 data flow, patent allowances/grants in the candidate family, and absence of third-party IP challenges.", "es": "Flujo de datos 2027-2028, concesiones patentarias en la familia candidata y ausencia de impugnaciones de PI de terceros.", "source_ids": ["C-KLRA-5", "1276-NEW-14", "1276-NEW-15"]}}], "risk_scenarios": [{"kind": "regulatory_downside", "trigger": {"en": "FDA or EMA requests additional efficacy, safety or CMC evidence, restricts a label, or a manufacturing inspection finds deficiencies.", "es": "La FDA o la EMA solicitan evidencia adicional de eficacia, seguridad o CMC, restringen una etiqueta, o una inspección de manufactura halla deficiencias.", "source_ids": ["REG-COMMON-01"]}, "affected_drug_territory": {"en": "Ribupatide and KAI-4729 in the US and EU where filed; all programs are investigational with no approval yet.", "es": "Ribupatida y KAI-4729 en EE. UU. y la UE donde se presenten; todos los programas son investigacionales sin aprobación aún.", "source_ids": ["REG-COMMON-01", "REG-COMMON-02"]}, "economic_consequence": {"en": "Review delay or label limits could postpone launch, shrink the eligible population or raise costs; for licensed assets, royalties and milestones may shift rather than direct product sales.", "es": "Un retraso regulatorio o límites de etiqueta podrían posponer el lanzamiento, reducir la población elegible o elevar costos; para activos licenciados, regalías e hitos pueden desplazarse en lugar de ventas directas.", "source_ids": ["KLRA-SUP-04"]}, "timing_and_indicators": {"en": "Next filing or inspection windows; leading indicators are FDA/EMA meeting records, inspection findings and company/partner filing updates; drug-specific schedule unknown.", "es": "Próximas ventanas de presentación o inspección; indicadores adelantados son registros de reuniones FDA/EMA, hallazgos de inspección y actualizaciones de la compañía o socia; calendario específico desconocido.", "source_ids": ["REG-COMMON-03"]}, "mitigation_or_counterevidence": {"en": "Additional clinical data, CMC remediation and partner resources may mitigate; the shared GAO staffing finding does not establish any drug-specific delay, and KaiNETIC designs currently track the FDA draft endpoint standard.", "es": "Datos clínicos adicionales, remediación de CMC y recursos de la socia pueden mitigar; el hallazgo compartido de personal de la GAO no establece retraso alguno específico, y los diseños KaiNETIC siguen actualmente el estándar de criterios del borrador de la FDA.", "source_ids": ["REG-COMMON-03", "REG-COMMON-01", "C-KLRA-1"]}}, {"kind": "ip_loss", "trigger": {"en": "A relevant patent expires, is narrowed or invalidated, or the granted claims are shown not to cover ribupatide's exact structure, or a lawful competing molecule gains authorization.", "es": "Una patente relevante vence, se limita o se invalida, o se demuestra que las reivindicaciones concedidas no cubren la estructura exacta de ribupatida, o una molécula competidora legal obtiene autorización.", "source_ids": ["REG-KLRA-01", "1276-NEW-15"]}, "affected_drug_territory": {"en": "Ribupatide and KAI-4729 across ex-Greater-China territories where protection is sought.", "es": "Ribupatida y KAI-4729 en territorios fuera de la Gran China donde se busca protección.", "source_ids": ["ID-KLRA-02", "REG-KLRA-01"]}, "economic_consequence": {"en": "Loss or bypass of a legal barrier could increase price and volume competition and reduce licensed product sales or royalty value; no probability or numerical haircut can be assigned from current evidence.", "es": "La pérdida o eludimiento de una barrera legal podría aumentar la competencia de precio y volumen y reducir ventas de producto licenciado o valor de regalías; ninguna probabilidad o descuento numérico puede asignarse con la evidencia actual.", "source_ids": ["KLRA-SUP-04", "KLRA-SUP-RIVAL"]}, "timing_and_indicators": {"en": "Only the issuer's conditional 2041 expiry is dated, and it depends on issuance and fee payment; leading indicators are patent-office and court records and FDA/EMA generic or competing approvals.", "es": "Solo el vencimiento condicional de 2041 del emisor está fechado, y depende de la concesión y el pago de tasas; indicadores adelantados son registros de oficinas de patentes y tribunales y aprobaciones genéricas o competidoras de FDA/EMA.", "source_ids": ["REG-KLRA-01"]}, "mitigation_or_counterevidence": {"en": "Six reported patent families, an allowed US application, coverage in 15 foreign jurisdictions and a mirror-reported US grant (US12653865) in the candidate family may partly offset, but no valid granted claim blocking competitors is established and FTO is unassessed.", "es": "Seis familias patentarias reportadas, una solicitud estadounidense permitida, cobertura en 15 jurisdicciones extranjeras y una patente estadounidense reportada por espejos (US12653865) en la familia candidata pueden compensar parcialmente, pero no se establece reivindicación concedida válida que bloquee competidores y la FTO no está evaluada.", "source_ids": ["REG-KLRA-01", "1276-NEW-15"]}}], "ratings": [{"dimension": "clinical_evidence", "rating": "FAIR", "reason": {"en": "A positive Chinese Phase 2 (12.1% vs 2.3% placebo, oral, week 26) is promising, but no global KaiNETIC Phase 3 results or active-comparator results and no approval exist yet. Chinese injectable GEMINI-1 Phase 3 results are available separately.", "es": "Una fase 2 china positiva (12,1% vs 2,3% placebo, oral, semana 26) es prometedora, pero aún no existen resultados globales de fase 3 KaiNETIC ni resultados frente a un comparador activo ni aprobación. Los resultados chinos de GEMINI-1 de fase 3 con la forma inyectable están disponibles por separado.", "source_ids": ["C-KLRA-4", "C-KLRA-1", "1276-NEW-01", "1276-NEW-02"]}}, {"dimension": "ip_economic_defensibility", "rating": "FAIR", "reason": {"en": "One allowed US composition application, 15-jurisdiction coverage and a mirror-reported US grant are encouraging, but the exact commercial-molecule-to-granted-claim mapping is not established and product-to-claim mapping is unproven.", "es": "Una solicitud estadounidense de composición permitida, cobertura en 15 jurisdicciones y una patente estadounidense reportada por espejos son alentadores, pero no está establecida la correspondencia exacta entre la molécula comercial y las reivindicaciones concedidas y el mapeo producto-reivindicación no está probado.", "source_ids": ["REG-KLRA-01", "1276-NEW-15"]}}, {"dimension": "financial_strength", "rating": "GOOD", "reason": {"en": "USD 1,171.8m in cash and securities with no reported borrowing debt and management guidance of runway into mid-2028, against USD 145.8m half-year burn and contingent Hengrui obligations up to USD 5.7bn.", "es": "USD 1.171,8 millones en efectivo y valores sin deuda reportada y previsión gerencial de caja hasta mediados de 2028, frente a un consumo semestral de USD 145,8 millones y obligaciones contingentes a Hengrui de hasta USD 5.700 millones.", "source_ids": ["KLRA-F1"]}}, {"dimension": "regulatory_exposure", "rating": "FAIR", "reason": {"en": "Only institutional background applies (draft FDA guidance, EMA guideline, GAO staffing finding) with no company-specific adverse finding, but every program is still investigational and unapproved.", "es": "Solo aplica antecedente institucional compartido (borrador de guía de la FDA, guía de la EMA, hallazgo de personal de la GAO) sin hallazgo adverso específico, pero todo programa sigue investigacional y sin aprobación.", "source_ids": ["REG-COMMON-01", "REG-COMMON-02", "REG-COMMON-03"]}}, {"dimension": "competitive_position", "rating": "MIDDLING", "reason": {"en": "Kailera enters a market where tirzepatide beat semaglutide (−20.2% vs −13.7%) and CagriSema reported −22.7%, and ribupatide's own superiority claim remains an untested prospective comparison.", "es": "Kailera entra en un mercado donde tirzepatida venció a semaglutida (−20,2% vs −13,7%) y CagriSema reportó −22,7%, y la propia supuesta superioridad de ribupatida sigue siendo una comparación prospectiva no probada.", "source_ids": ["KLRA-SUP-RIVAL", "KLRA-SUP-RIVAL2", "C-KLRA-2"]}}, {"dimension": "valuation_attractiveness", "rating": "MIDDLING", "reason": {"en": "Supplied calculations put basic EV at about USD 333m versus USD 1,171.8m of cash, so the pipeline is priced modestly above net cash, but dated inputs and the absence of any approved product make attractiveness genuinely uncertain.", "es": "Los cálculos suministrados sitúan el VE básico en unos USD 333 millones frente a USD 1.171,8 millones en efectivo, de modo que la cartera se precia modestamente por encima del efectivo neto, pero los datos fechados y la ausencia de producto aprobado hacen la atractividad genuinamente incierta.", "source_ids": ["KLRA-SUP-01", "KLRA-SUP-02", "KLRA-F1"]}}, {"dimension": "catalyst_quality", "rating": "FAIR", "reason": {"en": "Dated, multiple catalysts (Phase 2b mid-2027, oral Phase 3 H1-2027, pivotal data 2028, KAI-4729 Phase 1 by end-2026) exist, but all are management timelines with outcomes unknown.", "es": "Existen catalizadores múltiples y fechados (fase 2b a mediados de 2027, fase 3 oral en el 1S-2027, datos pivotales en 2028, fase 1 de KAI-4729 a fines de 2026), pero todos son cronogramas gerenciales con resultados desconocidos.", "source_ids": ["C-KLRA-5", "C-KLRA-1", "C-KLRA-2"]}}], "unknowns": [{"en": "Phase 3 efficacy, safety and the semaglutide superiority comparison for ribupatide are unknown until KaiNETIC readouts.", "es": "La eficacia y seguridad en fase 3 y la comparación de superioridad frente a semaglutida de ribupatida son desconocidas hasta las lecturas KaiNETIC.", "source_ids": ["C-KLRA-1", "C-KLRA-2"]}, {"en": "The exact ribupatide structure-to-granted-claim mapping and confirmation of a licensed core patent family remain unproven despite candidate identifiers.", "es": "El mapeo exacto estructura de ribupatida a reivindicación concedida y la confirmación de una familia patentaria núcleo licenciada siguen sin probarse pese a los identificadores candidatos.", "source_ids": ["1276-NEW-14", "1276-NEW-15", "REG-KLRA-01"]}, {"en": "The company's 30 September 2026 enrollment-completion statement was not reconciled with the still-recruiting registry views, and no global KaiNETIC Phase 3 results are posted.", "es": "La declaración de la compañía del 30-sep-2026 sobre reclutamiento completo no fue conciliada con las vistas del registro aún en reclutamiento, y no hay resultados globales de fase 3 KaiNETIC publicados.", "source_ids": ["C-KLRA-3", "C-KLRA-1", "C-KLRA-2"]}, {"en": "Same-day October cash, share count and fully diluted economic ownership cannot be reconstructed from public reporting; the market-cap and EV figures mix dated inputs.", "es": "El efectivo, número de acciones y propiedad diluida total de octubre sincrónicos no pueden reconstruirse de reportes públicos; las cifras de capitalización y VE mezclan insumos fechados.", "source_ids": ["KLRA-SUP-01", "KLRA-SUP-02"]}, {"en": "No FDA or EMA marketing approval or awarded regulatory exclusivity exists for any Kailera drug.", "es": "No existe aprobación de comercialización de FDA o EMA ni exclusividad regulatoria otorgada para ningún fármaco de Kailera.", "source_ids": ["REG-COMMON-01", "REG-COMMON-02"]}, {"en": "Individual broker acceptance and orderability of KLRA for a Costa Rica resident are unverified; only country-level eligibility is documented.", "es": "La aceptación individual del bróker y la posibilidad de operar KLRA para un residente de Costa Rica no están verificadas; solo está documentada la elegibilidad a nivel de país.", "source_ids": ["KLRA-SUP-03"]}], "coverage_boundary": {"en": "This packet covers the peptide programs ribupatide and KAI-4729 and company-level identity, financials, IP and regulation; the oral small molecule KAI-7535 is business context only and outside the peptide IP map, patent enforceability and freedom to operate are unassessed, and no synchronized same-day valuation basis was captured.", "es": "Este paquete cubre los programas peptídicos ribupatida y KAI-4729 y la identidad, finanzas, PI y regulación a nivel de compañía; la small molecule oral KAI-7535 es solo contexto de negocio y queda fuera del mapa de PI peptídica, la exigibilidad de patentes y la libertad de operación no están evaluadas, y no se capturó una base de valoración sincrónica del mismo día.", "source_ids": ["ID-KLRA-03", "REG-KLRA-01", "KLRA-SUP-01"]}}, {"ticker": "RYTM", "company": "Rhythm Pharmaceuticals, Inc.", "class": "emerging_commercial", "cutoff": "2026-10-11", "regulatory_chips": [], "card": {"what_you_buy": {"en": "IMCIVREE (setmelanotide), an approved eight-amino-acid cyclic peptide MC4R agonist: in TRANSCEND (120 acquired hypothalamic obesity patients) week-52 BMI fell −16.5% vs +3.3% placebo (p<.001); US label added acquired hypothalamic obesity age 4+ in March 2026 and the EU lists it by May 2026; Q2 2026 net product revenue was USD 71.3m.", "es": "IMCIVREE (setmelanotida), un péptido cíclico de ocho aminoácidos agonista del MC4R aprobado: en TRANSCEND (120 pacientes con obesidad hipotalámica adquirida) el IMC a la semana 52 cayó −16,5% frente a +3,3% con placebo (p<0,001); la etiqueta de EE. UU. añadió la obesidad hipotalámica adquirida desde los 4 años en marzo de 2026 y la UE la lista en mayo de 2026; los ingresos netos del producto en el Q2 de 2026 fueron de USD 71,3m.", "source_ids": ["C-RYTM-1", "C-RYTM-2", "C-RYTM-3", "C-RYTM-4", "C-RYTM-5", "C-RYTM-6", "ID-RYTM-01", "ID-RYTM-02", "RYTM-F2"]}, "why_it_could_work": {"en": "Rhythm sells IMCIVREE directly as net product revenue in rare, genetically defined populations with little documented competition (ECHO exenatide missed in HO), and lists patents to 2032–2034 plus exclusivities; value capture depends on rare-disease adoption and on royalties owed to Ipsen and, from 2029, LGC.", "es": "Rhythm vende IMCIVREE directamente como ingresos netos del producto en poblaciones raras con definición genética y poca competencia documentada (exenatida en ECHO fracasó en OH), y lista patentes hasta 2032–2034 más exclusividades; la captura de valor depende de la adopción en enfermedades raras y de regalos a Ipsen y, desde 2029, a LGC.", "source_ids": ["REG-RYTM-01", "RYTM-SUP-04", "RYTM-SUP-EPI", "RYTM-SUP-RIVAL"]}, "what_can_kill_it": {"en": "Established fact: all four EMANATE prespecified primary BMI endpoints missed (p=.15/.94/.12/.43), undermining the broader heterozygous-obesity expansion story; label warnings and the narrowed acquired-HO population constrain use. Conditional scenarios: generic-peptide pathway clarifications, IP loss or unproven enforceability, and pipeline failures (RM-718 data are tiny and uncontrolled).", "es": "Hecho establecido: los cuatro criterios primarios de IMC preespecificados de EMANATE fracasaron (p=0,15/0,94/0,12/0,43), debilitando la expansión a obesidades heterocigotas; las advertencias de etiqueta y la población acotada de OH limitan el uso. Escenarios condicionales: la vía de genéricos peptídicos, pérdida de PI o ejecutabilidad no probada, y fracasos del pipeline (los datos de RM-718 son pequeños y no controlados).", "source_ids": ["C-RYTM-5", "C-RYTM-6", "REG-COMMON-05", "REG-RYTM-01", "RYTM-SUP-PIPE"]}, "financial_strength": {"en": "Unrestricted cash and short-term investments of USD 330.897m at 2026-06-30 against USD 53.3m of net operating cash used in H1 2026, a USD 106.102m debt-like royalty obligation and 2026 non-GAAP opex guidance of USD 363–397m; management asserts at least 24 months of runway, which is a plan, not a measured result.", "es": "Efectivo sin restricciones e inversiones a corto plazo de USD 330,897m al 30-06-2026 frente a USD 53,3m de caja operativa neta usada en el S1 de 2026, una obligación de regalías similar a deuda de USD 106,102m y guía de opex no GAAP 2026 de USD 363–397m; la dirección afirma al menos 24 meses de liquidez, lo cual es un plan, no un resultado medido.", "source_ids": ["RYTM-F1", "RYTM-F2"]}, "valuation": {"en": "At the dated 2026-10-09 close of USD 90.78, approximate market cap is USD 6,250,392,003.96 and stated EV bases are USD 6,142,054,003.96 (preferred claim) or USD 6,243,090,996.04 (if-converted); these are transparent dated calculations, not fair values, and with no forward earnings basis valuation attractiveness is unknown.", "es": "Al cierre del 09-10-2026 de USD 90,78, el capitalización aproximada es USD 6,250,392,003,96 y las bases de EV declaradas son USD 6,142,054,003,96 (reclamo preferente) o USD 6,243,090,996,04 (si convertido); son cálculos fechados y transparentes, no valores justos, y sin base de beneficios futuros el atractivo de la valoración es desconocido.", "source_ids": ["RYTM-SUP-01", "RYTM-SUP-02", "RYTM-SUP-05"]}, "next_catalyst": {"en": "The annual report anticipates initiation of a bivamelagon registrational study by year-end 2026 — a company plan, not completed enrollment — while IMCIVREE acquired-HO adoption and reported sales are the nearer commercial catalysts.", "es": "El informe anual anticipa el inicio de un estudio registracional de bivamelagon a finales de 2026 —un plan de la compañía, no un reclutamiento completado—, mientras que la adopción de IMCIVREE en OH adquirida y las ventas reportadas son los catalizadores comerciales más cercanos.", "source_ids": ["RYTM-SUP-04", "RYTM-SUP-PIPE"]}}, "valuation_inputs": [{"label": {"en": "Last completed-session closing price (historical provider notes split adjustment; Close not guaranteed raw as-traded)", "es": "Precio de cierre de la última sesión completada (el proveedor histórico indica ajuste por split; el cierre no está garantizado como crudo)"}, "value": 90.78, "unit": "USD per common share", "as_of": "2026-10-09", "source_ids": ["RYTM-SUP-01"], "unknown_reason": null}, {"label": {"en": "Common shares outstanding (cover-date count, not a same-day October 9 count)", "es": "Acciones comunes en circulación (cuenta de fecha de portada, no del 9 de octubre)"}, "value": 68852082, "unit": "common shares", "as_of": "2026-08-01", "source_ids": ["RYTM-SUP-02"], "unknown_reason": null}, {"label": {"en": "Common equity market value = 90.78 × 68,852,082 (excludes options and contingencies)", "es": "Valor de mercado del capital común = 90,78 × 68,852,082 (excluye opciones y contingencias)"}, "value": 6250392003.96, "unit": "USD", "as_of": "price 2026-10-09; shares 2026-08-01", "source_ids": ["RYTM-SUP-01", "RYTM-SUP-02"], "unknown_reason": null}, {"label": {"en": "Unrestricted cash and short-term investments (restricted cash excluded; dated stock, not current October cash)", "es": "Efectivo sin restricciones e inversiones a corto plazo (excluye efectivo restringido; saldo fechado, no el efectivo actual de octubre)"}, "value": 330.897, "unit": "USD million", "as_of": "2026-06-30", "source_ids": ["RYTM-F1", "RYTM-SUP-02"], "unknown_reason": null}, {"label": {"en": "Deferred royalty obligation treated as debt-like (current 12.703 + noncurrent 93.399)", "es": "Obligación de regalías diferida tratada como deuda (corriente 12,703 + no corriente 93,399)"}, "value": 106.102, "u
