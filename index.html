.alt-header{flex-wrap:wrap;gap:12px 18px;align-items:flex-end}
.ticker-nav{display:flex;flex-wrap:wrap;gap:2px;max-width:860px}

.scenario-col{padding:10px 12px;background:#fff;border:1px solid #e4dccb}

.scenario-result{margin:0;font-size:14px;font-weight:650;line-height:1.45}

er patent claim identified in filings. Scenarios: Phase 3 failure or safety findings; entrenched approved rivals (tirzepatide, semaglutide) and Roche's Phase 3 dual agonist; dilution; and disputed rights events such as Ligand's TRbeta action, which does not cover VK2735.", "es": "Hecho: sin aprobación, sin datos de eficacia en fase 3 y sin reivindicación de composición específica de VK2735 identificada en los expedientes. Escenarios: fracaso o hallazgos de seguridad en fase 3; rivales aprobados consolidados (tirzepatida, semaglutida) y el agonista dual de Roche en fase 3; dilución; y disputas de derechos como la de Ligand sobre TRbeta, que no cubre a VK2735.", "source_ids": ["REG-VKTX-01", "VKTX-SUP-012", "VKTX-SUP-013", "VKTX-SUP-010", "VKTX-SUP-014", "VKTX-SUP-017"]}, "financial_strength": {"en": "Cash and short-term investments were USD 502 million on 2026-06-30, August–September ATM sales added USD 48.7 million net and the September offering added USD 547.8 million net, a no-burn pro forma ceiling of about USD 1,098.5 million against USD 239.1 million of first-half operating cash use; actual October cash is not disclosed.", "es": "Efectivo e inversiones a corto plazo fueron 502 millones de USD al 30-06-2026, las ventas ATM de agosto–septiembre añadieron 48,7 millones netos y la oferta de septiembre añadió 547,8 millones netos, un techo pro forma sin gasto de unos 1.098,5 millones de USD frente a 239,1 millones de consumo operativo del primer semestre; el efectivo real de octubre no está divulgado.", "source_ids": ["VKTX-F2", "VKTX-SUP-001", "VKTX-SUP-003", "VKTX-F1", "VKTX-SUP-002"]}, "valuation": {"en": "Valuation attractiveness is unknown: only a mixed-date illustrative basic equity value of about USD 3.63 billion (2026-10-09 close on June-plus-financing shares) is supported, and no synchronized market capitalization or EV comparison is established.", "es": "El atractivo valorativo es desconocido: solo se sustenta un valor patrimonial ilustrativo de fechas mixtas de unos 3.630 millones de USD (cierre del 09-10-2026 sobre acciones de junio más financiación), sin capitalización bursátil ni EV comparables sincronizados.", "source_ids": ["VKTX-F3", "VKTX-SUP-002", "VKTX-SUP-001", "VKTX-SUP-004"]}, "next_catalyst": {"en": "Management plans oral Phase 3 initiation in Q4 2026, with VANQUISH completion and maintenance/pivotal milestones expected in 2027; these are management timelines, and no approval is assured.", "es": "La dirección planea iniciar la fase 3 oral en el 4T2026, con finalización de VANQUISH e hitos de mantenimiento/pivotes esperados en 2027; son plazos de la dirección y ninguna aprobación está asegurada.", "source_ids": ["VKTX-SUP-006", "C-VKTX-1"]}}, "valuation_inputs": [{"label": {"en": "Nasdaq closing price, common share", "es": "Precio de cierre Nasdaq, acción común"}, "value": 28.51, "unit": "USD per share", "as_of": "2026-10-09; regular-session close; after-hours 28.60 excluded", "source_ids": ["VKTX-F3", "VKTX-SUP-004"], "unknown_reason": null}, {"label": {"en": "Common shares issued and outstanding (June balance sheet)", "es": "Acciones comunes emitidas y en circulación (balance de junio)"}, "value": 116652937, "unit": "common shares", "as_of": "2026-06-30; basic, not weighted or diluted", "source_ids": ["VKTX-F1", "VKTX-SUP-002"], "unknown_reason": null}, {"label": {"en": "Pro forma common shares after August ATM and September offering", "es": "Acciones comunes pro forma tras ATM de agosto y oferta de septiembre"}, "value": 127165251, "unit": "common shares", "as_of": "Prepared calculation from June count plus 1,476,600 ATM and 9,035,714 offering shares; not a confirmed 2026-10-09 outstanding count; options and RSUs excluded", "source_ids": ["VKTX-SUP-002", "VKTX-SUP-001"], "unknown_reason": null}, {"label": {"en": "Cash, cash equivalents and short-term investments", "es": "Efectivo, equivalentes e inversiones a corto plazo"}, "value": 502, "unit": "USD million", "as_of": "2026-06-30; excludes restricted "VKTX-SUP-003", "VKTX-SUP-004"], "unknown_reason": null}, {"label": {"en": "Current synchronized market capitalization / EV", "es": "Capitalización bursátil / EV actual sincronizados"}, "value": null, "unit": null, "as_of": "2026-10-11 cutoff", "source_ids": ["VKTX-F3"], "unknown_reason": {"en": "October 9 close and June/pro forma share counts have different dates; later burn, exercises and debt are not reconciled, so current market cap, EV and multiples cannot be calculated reliably.", "es": "El cierre del 9 de octubre y los recuentos de acciones de junio/pro forma tienen fechas distintas; el gasto posterior, ejercicios y deuda no están conciliados, por lo que no se puede calcular de forma fiable la capitalización, el EV ni los múltiplos actuales."}}], "defensibility": [{"drug": "VK2735", "molecule": {"en": "Investigational novel/synthetic dual GLP-1/GIP receptor agonist developed as subcutaneous injection and oral tablet; lead compound of Viking's peptide dual-agonist program.", "es": "Agonista dual novedoso/sintético investigacional de receptores GLP-1/GIP en desarrollo como inyección subcutánea y comprimido oral; compuesto líder del programa peptídico dual de Viking.", "source_ids": ["REG-VKTX-01", "ID-VKTX-02"]}, "composition_of_matter": {"en": "Viking reported three owned US patents plus foreign patents and applications for its GLP-1 program, but the 10-K identifies no VK2735-specific composition claim or expiry. Candidate families US12421282B2 and oral-formulation PCTs name no VK2735 and are not claim-mapped; US11744873B2 was rejected as an unrelated small-molecule patent.", "es": "Viking reportó tres patentes estadounidenses propias más patentes y solicitudes extranjeras para su programa GLP-1, pero el 10-K no identifica una reivindicación de composición específica de VK2735 ni vencimiento. Las familias candidatas US12421282B2 y los PCT de formulación oral no mencionan VK2735 y no están mapeadas; US11744873B2 fue rechazada como patente de molécula pequeña no relacionada.", "source_ids": ["REG-VKTX-01", "VKTX-SUP-008", "VKTX-SUP-015", "VKTX-SUP-016", "VKTX-SUP-007"]}, "additional_protection": {"en": "Oral-formulation PCT families (WO2024192219A1, priority 2023; WO2026064316A1, priority 2024) are candidate oral protection only; national family status, grants and molecule mapping are unverified.", "es": "Las familias PCT de formulación oral (WO2024192219A1, prioridad 2023; WO2026064316A1, prioridad 2024) son solo protección oral candidata; el estado nacional, las concesiones y el mapeo molecular no están verificados.", "source_ids": ["VKTX-SUP-015", "VKTX-SUP-016"]}, "regulatory_exclusivity": {"en": "No approved VK2735 product or awarded regulatory exclusivity exists as of cutoff; future eligibility remains hypothetical.", "es": "No existe producto VK2735 aprobado ni exclusividad regulatoria otorgada al corte; la elegibilidad futura sigue siendo hipotética.", "source_ids": ["REG-VKTX-01"]}, "competitive_workarounds": {"en": "Approved rivals tirzepatide and semaglutide, plus Roche's Phase 3 dual agonist enicepatide, are near substitutes by mechanism and population; patents listed in filings do not prove a barrier that blocks competing molecules or formulations.", "es": "Los rivales aprobados tirzepatida y semaglutida, más el agonista dual de Roche en fase 3 (enicepatida), son sustitutos cercanos por mecanismo y población; las patentes listadas en los expedientes no prueban una barrera que bloquee moléculas o formulaciones competidoras.", "source_ids": ["VKTX-SUP-012", "VKTX-SUP-013", "VKTX-SUP-010", "REG-VKTX-01"]}, "licensing_and_territory": {"en": "The Viking-Ligand license enumerates TRbeta, SARM, FBPase, DGAT-1 and EPOR programs; VK2735 is not among the licensed technologies, so Ligand royalties and the TRbeta termination dispute must not be assigned to VK2735.", "es": "La licencia Viking-Ligand enumera los programas TRbeta, SARM, FBPase, DGAT-1 y EPOR; VK2735 no está entre las tecnologías licenciadas, por lo que las regalías de Ligand y la disputa de terminación TRbeta no deben atribuirse a VK2735.", "source_ids": ["REG-VKTX-01", "VKTX-SUP-014", "VKTX-SUP-017"]}, "enforceability_and_FTO": {"en": "Unknown: no VK2735-specific freedom-to-operate conclusion, claim map, or enforceability adjudication exists; Viking itself discloses potential third-party patents, challenge and invalidity risks, and patent listings do not establish valid enforceable claims.", "es": "Desconocido: no existe conclusión de libertad de operación específica de VK2735, mapa de reivindicaciones ni adjudicación de exigibilidad; Viking misma divulga patentes potenciales de terceros y riesgos de impugnación e invalidez, y listar patentes no establece reivindicaciones válidas y exigibles.", "source_ids": ["REG-VKTX-01"]}}], "institutional_risk": [{"category": "DOCUMENTED FACT", "agency": "FDA", "jurisdiction": "US", "finding": {"en": "Draft (non-binding) FDA obesity guidance specifies adult mean percentage body-weight change versus control as the primary efficacy endpoint.", "es": "El borrador (no vinculante) de guía de FDA sobre obesidad especifica el cambio porcentual medio de peso corporal frente a control como criterio principal de eficacia.", "source_ids": ["REG-COMMON-01"]}, "company_pathway": {"en": "VANQUISH design and any future filing must satisfy this evidentiary standard; a guidance revision could alter trial design, duration or required analyses.", "es": "El diseño de VANQUISH y cualquier futuro expediente deben cumplir este estándar probatorio; una revisión de la guía podría alterar diseño, duración o análisis requeridos.", "source_ids": ["C-VKTX-1", "REG-COMMON-01"]}, "limitations": {"en": "Draft guidance is a baseline, not an adverse finding; product-specific materiality and timing are unknown.", "es": "La guía borrador es una línea base, no un hallazgo adverso; la materialidad y el calendario específicos del producto son desconocidos.", "source_ids": ["REG-COMMON-01"]}}, {"category": "OFFICIAL FINDING", "agency": "FDA / GAO", "jurisdiction": "US", "finding": {"en": "GAO found the FDA drug-inspector vacancy rate rose from 9% to 16% (Nov 2021-Jun 2024), reducing inspections; FDA described hiring steps in March 2026.", "es": "El GAO halló que la tasa de vacantes de inspectores de medicamentos de FDA subió de 9% a 16% (nov 2021-jun 2024), reduciendo inspecciones; FDA describió medidas de contratación en marzo de 2026.", "source_ids": ["REG-COMMON-03"]}, "company_pathway": {"en": "If a VK2735-related facility awaits pre-approval inspection, staffing limits could delay clearance; no company-specific delay is established.", "es": "Si una instalación relacionada con VK2735 espera inspección previa a la aprobación, las limitaciones de personal podrían retrasar la autorización; no se establece ningún retraso específico de la compañía.", "source_ids": ["REG-COMMON-03"]}, "limitations": {"en": "Site exposure of Viking facilities is unverified; the finding is sector-wide.", "es": "La exposición de las instalaciones de Viking no está verificada; el hallazgo es sectorial.", "source_ids": ["REG-COMMON-03"]}}, {"category": "DOCUMENTED FACT", "agency": "FDA", "jurisdiction": "US", "finding": {"en": "PDUFA VII authorizes sponsor application and program fees through FY2027; the FY2026 application fee requiring clinical data is USD 4,682,003.", "es": "PDUFA VII autoriza tasas de solicitud y de programa para patrocinadores hasta el ejercicio 2027; la tasa de solicitud FY2026 con datos clínicos es de 4.682.003 USD.", "source_ids": ["REG-COMMON-04"]}, "company_pathway": {"en": "A future VK2735 NDA would carry these filing costs; fees affect cost and review capacity, not approval probability.", "es": "Un futuro NDA de VK2735 llevaría estos costes de presentación; las tasas afectan costes y capacidad de revisión, no la probabilidad de aprobación.", "source_ids": ["REG-COMMON-04"]}, "limitations": {"en": "Statutory background; no company-specific finding.", "es": "Contexto estatutario; sin hallazgo específico de la compañía.", "source_ids": ["REG-COMMON-04"]}}, {"category": "DOCUMENTED FACT", "agency": "EMA", "jurisdiction": "EU", "finding": {"en": "EMA's 2017 weight-management guideline governs EU evidence expectations, and a revised expert-independence policy (effective 1 May 2025, with a three-year cooling-off period) followed CJEU impartiality rulings.", "es": "La guía EMA de control de peso de 2017 rige las expectativas probatorias en la UE, y una política revisada de independencia de expertos (vigente desde el 1 de mayo de 2025, con período de espera de tres años) siguió a fallos de imparcialidad del TJUE.", "source_ids": ["REG-COMMON-02", "REG-COMMON-07"]}, "company_pathway": {"en": "Any future EU filing for VK2735 must meet CHMP expectations; expert-eligibility rules could affect review composition or timing.", "es": "Cualquier futuro expediente europeo de VK2735 debe cumplir las expectativas del CHMP; las reglas de elegibilidad de expertos podrían afectar la composición o el calendario de la revisión.", "source_ids": ["REG-COMMON-02", "REG-COMMON-07"]}, "limitations": {"en": "Procedural background; no covered-product conflict or company-specific finding is established.", "es": "Antecedente procedimental; no se establece conflicto de producto cubierto ni hallazgo específico de la compañía.", "source_ids": ["REG-COMMON-07"]}}], "scenarios": [{"type": "bear", "assumption": {"en": "Phase 3 VANQUISH or oral trials miss efficacy, durability or safety expectations, or a rival's superior profile displaces VK2735 before launch.", "es": "Los ensayos VANQUISH de fase 3 u orales no cumplen expectativas de eficacia, durabilidad o seguridad, o un rival con perfil superior desplaza a VK2735 antes del lanzamiento.", "source_ids": ["C-VKTX-1", "VKTX-SUP-010", "VKTX-SUP-012"]}, "trigger": {"en": "Negative or ambiguous Phase 3 readouts expected in 2027, or adverse competitor data/approvals.", "es": "Lecturas negativas o ambiguas de fase 3 esperadas en 2027, o datos/aprobaciones adversas de competidores.", "source_ids": ["C-VKTX-1", "VKTX-SUP-010"]}, "affected_drug_territory": {"en": "VK2735 injection and oral, principally US and EU markets.", "es": "VK2735 inyectable y oral, principalmente mercados de EE. UU. y la UE.", "source_ids": ["C-VKTX-1"]}, "economic_consequence": {"en": "Development value could fall sharply toward cash backing; continued Phase 3 spending would consume the raised capital without product revenue.", "es": "El valor de desarrollo podría caer fuertemente hacia el respaldo de caja; el gasto continuo en fase 3 consumiría el capital captado sin ingresos por productos.", "source_ids": ["VKTX-F2", "VKTX-SUP-001"]}, "timing_and_indicators": {"en": "VANQUISH completion expected 2027; indicators: data releases, safety signals, competitor readouts.", "es": "Finalización de VANQUISH esperada en 2027; indicadores: publicaciones de datos, señales de seguridad, lecturas de competidores.", "source_ids": ["C-VKTX-1", "VKTX-SUP-006"]}}, {"type": "base", "assumption": {"en": "Trials proceed roughly on management's schedule with mixed-to-supportive results; approval remains a future, uncertain outcome.", "es": "Los ensayos avanzan aproximadamente según el calendario de la dirección con resultados mixtos o favorables; la aprobación sigue siendo un resultado futuro e incierto.", "source_ids": ["VKTX-SUP-006", "C-VKTX-1"]}, "trigger": {"en": "Oral Phase 3 initiation in Q4 2026 and 2027 readouts arrive without decisive positive or negative surprise.", "es": "Inicio de fase 3 oral en el 4T2026 y lecturas de 2027 llegan sin sorpresa positiva o negativa decisiva.", "source_ids": ["VKTX-SUP-006"]}, "affected_drug_territory": {"en": "VK2735 injection and oral programs globally, pending any filing.", "es": "Programas de VK2735 inyectable y oral a nivel global, pendiente de cualquier presentación.", "source_ids": ["C-VKTX-1"]}, "economic_consequence": {"en": "Value tracks cash, program progress and dilution; large approved rivals cap pricing and share expectations until differentiated data emerge.", "es": "El valor sigue a la caja, el progreso de los programas y la dilución; los grandes rivales aprobados limitan expectativas de precio y cuota hasta que aparezcan datos diferenciados.", "source_ids": ["VKTX-SUP-012", "VKTX-SUP-013"]}, "timing_and_indicators": {"en": "2026-2027 milestones; indicators: enrollment, trial starts, financing activity, patent-family publications.", "es": "Hitos 2026-2027; indicadores: reclutamiento, inicio de ensayos, actividad de financiación, publicaciones de familias de patentes.", "source_ids": ["VKTX-SUP-006", "VKTX-SUP-016"]}}, {"type": "bull", "assumption": {"en": "Phase 3 confirms the strong Phase 1/2 signals with competitive tolerability, oral and maintenance options differentiate, and patent families mature into enforceable protection.", "es": "La fase 3 confirma las fuertes señales de fase 1/2 con tolerabilidad competitiva, las opciones oral y de mantenimiento diferencian, y las familias de patentes maduran hacia protección exigible.", "source_ids": ["C-VKTX-2", "VKTX-SUP-005", "VKTX-SUP-008", "VKTX-SUP-015"]}, "trigger": {"en": "Positive VANQUISH and maintenance readouts in 2027 plus successful regulatory filings.", "es": "Lecturas positivas de VANQUISH y mantenimiento en 2027 más presentaciones regulatorias exitosas.", "source_ids": ["C-VKTX-1", "VKTX-SUP-006"]}, "affected_drug_territory": {"en": "VK2735 injection and oral in US/EU weight management.", "es": "VK2735 inyectable y oral en control de peso en EE. UU./UE.", "source_ids": ["C-VKTX-1", "REG-COMMON-01"]}, "economic_consequence": {"en": "A very large overweight/obesity population could support substantial revenue; no revenue, share or probability estimate is sourced, and capitalization or partnerships would shape the economics.", "es": "Una población muy grande con sobrepeso/obesidad podría sustentar ingresos sustanciales; no hay estimación sourced de ingresos, cuota ni probabilidad, y la capitalización o alianzas moldearían la economía.", "source_ids": ["VKTX-SUP-009", "VKTX-SUP-001"]}, "timing_and_indicators": {"en": "2027 pivotal data; indicators: trial results, filing acceptances, patent grants mapped to VK2735.", "es": "Datos pivotes de 2027; indicadores: resultados de ensayos, aceptaciones de expedientes, concesiones de patentes mapeadas a VK2735.", "source_ids": ["C-VKTX-1", "VKTX-SUP-006"]}}], "risk_scenarios": [{"kind": "regulatory_downside", "trigger": {"en": "FDA/EMA request additional efficacy, safety or CMC evidence, restrict a label, or a facility inspection finds deficiencies under current obesity standards.", "es": "FDA/EMA solicitan evidencia adicional de eficacia, seguridad o CMC, restringen una etiqueta, o una inspección de instalación halla deficiencias bajo los estándares vigentes de obesidad.", "source_ids": ["REG-COMMON-01", "REG-COMMON-03"]}, "affected_drug_territory": {"en": "VK2735, US and EU wherever filed; no approval exists yet, so this concerns future filings.", "es": "VK2735, EE. UU. y la UE donde se presente; aún no existe aprobación, por lo que esto concierne a presentaciones futuras.", "source_ids": ["REG-VKTX-01"]}, "economic_consequence": {"en": "Review delay or label limits could postpone launch, constrain eligible patients and raise spending; no probability or numerical effect is assigned.", "es": "Un retraso de revisión o límites de etiqueta podrían posponer el lanzamiento, restringir pacientes elegibles y elevar el gasto; no se asigna probabilidad ni efecto numérico.", "source_ids": ["REG-COMMON-01"]}, "timing_and_indicators": {"en": "Next filing/inspection cycle; indicators: FDA/EMA meeting records, decision letters, inspection findings, trial-start timing versus guidance.", "es": "Próximo ciclo de presentación/inspección; indicadores: registros de reuniones FDA/EMA, cartas de decisión, hallazgos de inspección, calendario de inicios versus la guía.", "source_ids": ["REG-COMMON-01", "REG-COMMON-03"]}, "mitigation_or_counterevidence": {"en": "Additional clinical data, CMC remediation and alternative markets; sector-wide inspection staffing is documented, but no company-specific delay or adverse finding exists.", "es": "Datos clínicos adicionales, remediación de CMC y mercados alternativos; la escasez sectorial de inspectores está documentada, pero no existe retraso ni hallazgo adverso específico de la compañía.", "source_ids": ["REG-COMMON-03", "C-VKTX-1"]}}, {"kind": "ip_loss", "trigger": {"en": "A relevant patent/exclusivity right expires, is narrowed or invalidated, or a lawful competing molecule/formulation gains authorization; separation of rights matters because the Ligand dispute concerns VK2809, not VK2735.", "es": "Un derecho relevante de patente/exclusividad vence, se reduce o invalida, o una molécula/formulación competidora lawful obtiene autorización; la separación importa porque la disputa de Ligand concierne a VK2809, no a VK2735.", "source_ids": ["REG-VKTX-01", "VKTX-SUP-014", "VKTX-SUP-017"]}, "affected_drug_territory": {"en": "VK2735 (peptide scope) plus, distinctly, VK2809 under the disputed Ligand TRbeta license.", "es": "VK2735 (alcance peptídico) y, de forma distinta, VK2809 bajo la licencia TRbeta de Ligand en disputa.", "source_ids": ["REG-VKTX-01", "VKTX-SUP-014", "VKTX-SUP-017"]}, "economic_consequence": {"en": "Loss or bypass of a legal barrier could increase price and volume competition and erode retained economics; no numerical sensitivity is sourced. The Ligand outcome, whatever it is, does not name VK2735 economics.", "es": "La pérdida o eludición de una barrera legal podría intensificar la competencia de precio y volumen y erosionar la economía retenida; no hay sensibilidad numérica fuente. El resultado de Ligand, sea cual sea, no menciona la economía de VK2735.", "source_ids": ["REG-VKTX-01", "VKTX-SUP-017"]}, "timing_and_indicators": {"en": "No dated expiry is evidenced for VK2735; indicators: patent-office and court records, FDA/EMA generic or alternative approvals, sponsor rights disclosures, Ligand litigation docket.", "es": "No hay vencimiento fechado evidenciado para VK2735; indicadores: registros de oficinas de patentes y tribunales, aprobaciones genéricas o alternativas de FDA/EMA, divulgaciones de derechos del patrocinador, expediente del litigio Ligand.", "source_ids": ["REG-VKTX-01", "VKTX-SUP-017"]}, "mitigation_or_counterevidence": {"en": "Additional owned GLP-1 patents/applications and candidate oral-formulation families, differentiated clinical profile and manufacturing may partly offset; VK2735 is not among the licensed Ligand technologies.", "es": "Patentes/solicitudes GLP-1 propias adicionales y familias candidatas de formulación oral, perfil clínico diferenciado y fabricación pueden compensar parcialmente; VK2735 no está entre las tecnologías licenciadas a Ligand.", "source_ids": ["REG-VKTX-01", "VKTX-SUP-008", "VKTX-SUP-015", "VKTX-SUP-016"]}}], "ratings": [{"dimension": "clinical_evidence", "rating": "FAIR", "reason": {"en": "Promising Phase 2 oral results (up to 12.2% at 13 weeks) and sponsor-reported induction/maintenance signals exist, but pivotal Phase 3 efficacy, durability and rare-safety evidence are absent and no approval exists.", "es": "Existen prometedores resultados orales de fase 2 (hasta 12,2% a 13 semanas) y señales de inducción/mantenimiento del patrocinador, pero faltan evidencias pivotes de eficacia, durabilidad y seguridad rara en fase 3, y no hay aprobación.", "source_ids": ["C-VKTX-2", "C-VKTX-3", "VKTX-SUP-005", "C-VKTX-1"]}}, {"dimension": "ip_economic_defensibility", "rating": "MIDDLING", "reason": {"en": "Viking asserts owned GLP-1 patents and candidate oral-formulation families, but no VK2735-specific composition claim, expiry, enforceability or freedom-to-operate is established.", "es": "Viking alega patentes GLP-1 propias y familias candidatas de formulación oral, pero no se establece reivindicación de composición específica de VK2735, vencimiento, exigibilidad ni libertad de operación.", "source_ids": ["REG-VKTX-01", "VKTX-SUP-008", "VKTX-SUP-015"]}}, {"dimension": "financial_strength", "rating": "GOOD", "reason": {"en": "USD 502 million June cash plus USD 48.7 million net ATM proceeds and USD 547.8 million net September offering proceeds give roughly a USD 1,098.5 million no-burn ceiling against USD 239.1 million half-year operating burn, though October cash is undisclosed and dilution has occurred.", "es": "502 millones de USD de caja en junio más 48,7 millones netos del ATM y 547,8 millones netos de la oferta de septiembre dan un techo sin gasto de unos 1.098,5 millones de USD frente a 239,1 millones de consumo operativo semestral, aunque la caja de octubre no está divulgada y hubo dilución.", "source_ids": ["VKTX-F2", "VKTX-SUP-001", "VKTX-SUP-002", "VKTX-F1"]}}, {"dimension": "regulatory_exposure", "rating": "FAIR", "reason": {"en": "No adverse company-specific regulatory finding was identified in the searched record; exposure is the ordinary unapproved-asset pathway under draft FDA obesity guidance, sector inspection staffing and EU standards.", "es": "No se identificó un hallazgo regulatorio adverso específico de la compañía en los registros consultados; la exposición es la vía ordinaria de un activo no aprobado bajo la guía borrador de FDA sobre obesidad, la dotación sectorial de inspectores y los estándares europeos.", "source_ids": ["REG-COMMON-01", "REG-COMMON-03", "REG-COMMON-02", "REG-VKTX-01"]}}, {"dimension": "competitive_position", "rating": "MIDDLING", "reason": {"en": "VK2735 is unapproved while tirzepatide and semaglutide hold approved labels and Roche's enicepatide is in Phase 3; differentiation depends on 2027 data and oral/maintenance options.", "es": "VK2735 no está aprobado mientras tirzepatida y semaglutida tienen etiquetas aprobadas y el enicepatida de Roche está en fase 3; la diferenciación depende de los datos de 2027 y de las opciones oral y de mantenimiento.", "source_ids": ["VKTX-SUP-012", "VKTX-SUP-013", "VKTX-SUP-010", "VKTX-SUP-005"]}}, {"dimension": "valuation_attractiveness", "rating": "UNKNOWN", "reason": {"en": "Only a mixed-date illustrative equity value (USD 28.51 close on 127,165,251 pro forma shares, about USD 3.63 billion) is supported; no synchronized market cap, EV or peer comparison is established.", "es": "Solo se sustenta un valor patrimonial ilustrativo de fechas mixtas (cierre de 28,51 USD sobre 127.165.251 acciones pro forma, unos 3.630 millones de USD); no hay capitalización, EV ni comparación entre pares sincronizados.", "source_ids": ["VKTX-F3", "VKTX-SUP-002", "VKTX-SUP-004"]}}, {"dimension": "catalyst_quality", "rating": "GOOD", "reason": {"en": "Dated, evidence-backed milestones cluster ahead: oral Phase 3 initiation planned Q4 2026, fully enrolled VANQUISH completing 2027, and maintenance/pivotal readouts expected 2027, though timing is management guidance and outcomes are uncertain.", "es": "Hay hitos fechados y respaldados por evidencia: inicio de fase 3 oral previsto para el 4T2026, VANQUISH totalmente reclutado que finaliza en 2027 y lecturas de mantenimiento/pivotes esperadas en 2027, aunque los plazos son guía de la dirección y los resultados son inciertos.", "source_ids": ["VKTX-SUP-006", "C-VKTX-1", "C-VKTX-4"]}}], "unknowns": [{"en": "Exact VK2735 patent family, claim mapping and current legal status remain unestablished; candidate patents name no VK2735 and no primary office-specific claim map exists.", "es": "La familia de patentes exacta de VK2735, su mapeo de reivindicaciones y estado legal actual no están establecidos; las patentes candidatas no mencionan VK2735 y no existe mapa oficial específico.", "source_ids": ["REG-VKTX-01", "VKTX-SUP-008", "VKTX-SUP-015", "VKTX-SUP-016"]}, {"en": "October 2026 cash and exact outstanding share count are not disclosed; only June balances plus disclosed financings support pro forma figures, and subsequent burn is unknown.", "es": "La caja de octubre de 2026 y el recuento exacto de acciones en circulación no están divulgados; solo los balances de junio más financiaciones divulgadas sustentan cifras pro forma, y el gasto posterior es desconocido.", "source_ids": ["VKTX-F2", "VKTX-SUP-002", "VKTX-SUP-001"]}, {"en": "Phase 3 treatment effect, long-term durability and rare adverse-event rates for VK2735 are unknown; short oral and maintenance studies cannot establish them.", "es": "El efecto en fase 3, la durabilidad a largo plazo y las tasas de eventos adversos raros de VK2735 son desconocidos; los estudios orales y de mantenimiento breves no pueden establecerlos.", "source_ids": ["C-VKTX-1", "C-VKTX-2", "VKTX-SUP-005"]}, {"en": "Local broker access (e.g., IBKR account permissions from a given residence) is not established by the public country list.", "es": "El acceso local vía bróker (p. ej., permisos de cuenta IBKR desde una residencia dada) no queda establecido por la lista pública de países.", "source_ids": ["VKTX-SUP-011"]}], "coverage_boundary": {"en": "Bounded peptide review as of 2026-10-11: identity, clinical, financial, IP/regulatory and supplemental evidence for VK2735; VK2809 is a small molecule excluded from peptide clinical claims (the Ligand TRbeta dispute concerns VK2809/VK0214, not VK2735), VK3019 is Phase 1 context only, no synchronized peer pricing or full diluted capitalization was captured, and absence of company-specific findings is not evidence of absence.", "es": "Revisión peptídica acotada al 11-10-2026: identidad, clínica, finanzas, PI/regulación y evidencia suplementaria para VK2735; VK2809 es una molécula pequeña excluida de las afirmaciones clínicas peptídicas (la disputa Ligand TRbeta concierne a VK2809/VK0214, no a VK2735), VK3019 es solo contexto de fase 1, no se captaron precios sincronizados de pares ni capitalización diluida completa, y la ausencia de hallazgos específicos no es prueba de ausencia.", "source_ids": ["ID-VKTX-01", "VKTX-SUP-014", "VKTX-SUP-017", "VKTX-F3"]}}, {"ticker": "ALT", "company": "Altimmune, Inc.", "class": "clinical_stage_biotech", "cutoff": "2026-10-11", "regulatory_chips": [], "card": {"what_you_buy": {"en": "Pemvidutide, an investigational GLP-1/glucagon dual-agonist peptide in Phase 3 (PERFORMA) for MASH F2–F3 fibrosis, with Phase 2 programs in AUD and ALD; no approved indication exists. Phase 2b MASH fibrosis improvement (33%/36% vs 28% placebo) was not statistically significant (p=0.59/0.27); the AUD topline (−1.45 heavy-drinking days/week vs placebo, p=0.0014) is an unverified company statement.", "es": "Pemvidutida, un péptido doble agonista GLP-1/glucagón en fase 3 (PERFORMA) para fibrosis MASH F2–F3, con programas de fase 2 en TAH y HAA; no existe indicación aprobada. La mejoría de fibrosis en fase 2b de MASH (33%/36% vs 28% placebo) no fue estadísticamente significativa (p=0,59/0,27); el resultado de TAH (−1,45 días de consumo intensivo/semana vs placebo, p=0,0014) es una afirmación empresarial no verificada.", "source_ids": ["C-ALT-1", "C-ALT-2", "C-ALT-3", "C-ALT-4"]}, "why_it_could_work": {"en": "If PERFORMA succeeds, granted composition/liver-use patents and a worldwide exclusive Mederis license could let Altimmune capture value in a large F2–F3 MASH population; the main dependency is showing significant fibrosis benefit where rivals Rezdiffra and Wegovy are already approved.", "es": "Si PERFORMA tiene éxito, las patentes concedidas de composición/uso hepático y una licencia exclusiva mundial de Mederis podrían permitir a Altimmune capturar valor en una gran población MASH F2–F3; la dependencia principal es demostrar beneficio significativo en fibrosis cuando Rezdiffra y Wegovy ya están aprobados.", "source_ids": ["ALT-IP-001", "ALT-IP-002", "ALT-IP-003", "ALT-COMP-001", "ALT-COMP-003"]}, "what_can_kill_it": {"en": "Established fact: the lead indication's only peer-reviewed biopsy endpoint missed significance. Conditional risks: PERFORMA failure or delays, an increasingly crowded field (two approved drugs plus three Phase 3 rivals), further dilution while burning cash, and unverified patent enforceability.", "es": "Hecho establecido: el único criterio de valoración por biopsia revisado por pares de la indicación principal no alcanzó significación. Riesgos condicionales: fracaso o retrasos de PERFORMA, un campo cada vez más saturado (dos fármacos aprobados y tres rivales en fase 3), mayor dilución mientras se quema caja, y aplicabilidad de patentes sin verificar.", "source_ids": ["C-ALT-1", "ALT-COMP-003", "ALT-COMP-005", "ALT-F1", "ALT-IP-002"]}, "financial_strength": {"en": "Cash plus investments of $518.5M against $45.2M of operating cash used in H1 2026, with management asserting at least twelve months of funding; a Phase 3 running toward 2029 implies further raises, and 10.75M pre-funded warrants, 75M $3 warrants, options and RSUs add dilution overhang.", "es": "Efectivo más inversiones de 518,5 M USD frente a 45,2 M USD de flujo operativo usado en el 1S 2026, con la dirección afirmando financiación para al menos doce meses; una fase 3 que avanza hacia 2029 implica nuevas emisiones, y 10,75 M de warrants prefinanciados, 75 M de warrants a 3 USD, opciones y RSU añaden presión dilutiva.", "source_ids": ["ALT-F1", "ALT-F2", "ALT-PRICE-003"]}, "valuation": {"en": "No current valuation is supported: the dated close was $2.61 (2026-10-09), and illustrative mixed-date figures (basic market cap ≈$507.7M; basic EV ≈$24.2M) use June cash and August shares, so cheapness versus near-cash cannot be concluded.", "es": "No se sustenta una valoración actual: el cierre fechado fue de 2,61 USD (2026-10-09) y las cifras ilustrativas con fechas mezcladas (capitalización básica ≈507,7 M USD; EV básico ≈24,2 M USD) usan caja de junio y acciones de agosto, por lo que no puede concluirse ganga frente a casi-efectivo.", "source_ids": ["ALT-PRICE-001", "ALT-PRICE-002", "ALT-PRICE-003"]}, "next_catalyst": {"en": "RESTORE ALD topline is expected in the second half of 2027 (~121 enrolled, liver-stiffness endpoints); PERFORMA's 52-week histology readout is anticipated in 2029, and the AUD end-of-phase-2 FDA meeting remains undated.", "es": "Los resultados principales de RESTORE en HAA se esperan en la segunda mitad de 2027 (~121 participantes, criterios de rigidez hepática); la lectura de histología a 52 semanas de PERFORMA se prevé para 2029, y la reunión de fin de fase 2 con la FDA para TAH sigue sin fecha.", "source_ids": ["ALT-PATH-003", "ALT-PATH-010", "ALT-PATH-002", "ALT-PATH-009"]}}, "valuation_inputs": [{"label": {"en": "Nasdaq close (issuer LSEG adjusted, corroborated by S&P table; official NOCP unavailable)", "es": "Cierre Nasdaq (LSEG del emisor ajustado, corroborado por tabla S&P; NOCP oficial no disponible)"}, "value": 2.61, "unit": "USD/share", "as_of": "2026-10-09", "source_ids": ["ALT-PRICE-001", "ALT-PRICE-002"], "unknown_reason": null}, {"label": {"en": "Common shares outstanding (10-Q cover)", "es": "Acciones comunes en circulación (portada del 10-Q)"}, "value": 194517701, "unit": "shares", "as_of": "2026-08-07", "source_ids": ["ALT-PRICE-003"], "unknown_reason": null}, {"label": {"en": "Common shares issued and outstanding (balance sheet)", "es": "Acciones comunes emitidas y en circulación (balance)"}, "value": 194474154, "unit": "shares", "as_of": "2026-06-30", "source_ids": ["ALT-F1", "ALT-PRICE-003"], "unknown_reason": null}, {"label": {"en": "Cash plus short- and long-term investments; restricted cash excluded", "es": "Efectivo más inversiones a corto y largo plazo; efectivo restringido excluido"}, "value": 518.528, "unit": "USD million", "as_of": "2026-06-30", "source_ids": ["ALT-F1"], "unknown_reason": null}, {"label": {"en": "Term loan carrying value (principal $35.0M)", "es": "Valor en libros del préstamo a plazo (principal 35,0 M USD)"}, "value": 34.742, "unit": "USD million", "as_of": "2026-06-30", "source_ids": ["ALT-F1"], "unknown_reason": null}, {"label": {"en": "Net operating cash used (six months)", "es": "Flujo de caja operativo neto usado (seis meses)"}, "value": 45.163, "unit": "USD million", "as_of": "2026-H1", "source_ids": ["ALT-F1"], "unknown_reason": null}, {"label": {"en": "Pre-funded warrants (exercise price $0.001)", "es": "Warrants prefinanciados (precio de ejercicio 0,001 USD)"}, "value": 10750000, "unit": "warrants", "as_of": "2026-06-30", "source_ids": ["ALT-F1", "ALT-PRICE-003"], "unknown_reason": null}, {"label": {"en": "Common warrants at $3 exercise (out of the money at $2.61)", "es": "Warrants comunes a 3 USD de ejercicio (fuera del dinero a 2,61 USD)"}, "value": 75000000, "unit": "warrants", "as_of": "2026-06-30", "source_ids": ["ALT-PRICE-003"], "unknown_reason": null}, {"label": {"en": "Stock options outstanding", "es": "Opciones sobre acciones en circulación"}, "value": 12068733, "unit": "options", "as_of": "2026-06-30", "source_ids": ["ALT-PRICE-003"], "unknown_reason": null}, {"label": {"en": "RSU shares outstanding", "es": "Acciones RSU pendientes"}, "value": 1978950, "unit": "RSUs", "as_of": "2026-06-30", "source_ids": ["ALT-PRICE-003"], "unknown_reason": null}, {"label": {"en": "Illustrative basic market cap = $2.61 × 194,517,701 (mixed dates: Oct price × Aug shares; not a synchronized capitalization)", "es": "Capitalización básica ilustrativa = 2,61 USD × 194.517.701 (fechas mezcladas: precio de octubre × acciones de agosto; no sincronizada)"}, "value": 507.69, "unit": "USD million", "as_of": "2026-10-09 price / 2026-08-07 shares", "source_ids": ["ALT-PRICE-001", "ALT-PRICE-002", "ALT-PRICE-003"], "unknown_reason": null}, {"label": {"en": "Illustrative pre-funded-equivalent equity value = (194,517,701 + 10,750,000) × $2.61 (assumes June warrants unexercised in August)", "es": "Valor patrimonial ilustrativo equivalente prefinanciado = (194.517.701 + 10.750.000) × 2,61 USD (asume warrants de junio sin ejercer en agosto)"}, "value": 535.75, "unit": "USD million", "as_of": "2026-10-09 price / 2026-06-30 warrants", "source_ids": ["ALT-PRICE-001", "ALT-PRICE-003"], "unknown_reason": null}, {"label": {"en": "Illustrative basic EV = $507.69M + $35.0M principal − $518.53M cash (mixed dates; not current EV)", "es": "EV básico ilustrativo = 507,69 M + 35,0 M de principal − 518,53 M de caja (fechas mezcladas; no es el EV actual)"}, "value": 24.16, "unit": "USD million", "as_of": "2026-10-09 price / 2026-06-30 balance sheet", "source_ids": ["ALT-PRICE-001", "ALT-PRICE-003"], "unknown_reason": null}, {"label": {"en": "Illustrative pre-funded-equivalent EV = $535.75M + $35.0M − ($518.53M + $0.01M residual warrant proceeds)", "es": "EV ilustrativo equivalente prefinanciado = 535,75 M + 35,0 M − (518,53 M + 0,01 M de producto residual de warrants)"}, "value": 52.21, "unit": "USD million", "as_of": "2026-10-09 price / 2026-06-30 balance sheet", "source_ids": ["ALT-PRICE-001", "ALT-PRICE-003"], "unknown_reason": null}, {"label": {"en": "Current synchronized market capitalization", "es": "Capitalización de mercado actual sincronizada"}, "value": null, "unit": "USD million", "as_of": "2026-10-11", "source_ids": ["ALT-PRICE-003"], "unknown_reason": {"en": "Post-August 7 share count, pre-funded exercises, ATM issuance and post-June cash/burn are not reconciled to a 2026-10-09 basis.", "es": "Las acciones posteriores al 7 de agosto, ejercicios de prefinanciados, emisiones ATM y la caja/gasto posterior a junio no están conciliados a una base del 2026-10-09."}}, {"label": {"en": "Current enterprise value", "es": "Valor empresarial (EV) actual"}, "value": null, "unit": "USD million", "as_of": "2026-10-11", "source_ids": ["ALT-PRICE-003"], "unknown_reason": {"en": "Current cash, debt and share count after June 30 are unknown; only mixed-date illustrations above are supported.", "es": "La caja, deuda y acciones actuales tras el 30 de junio son desconocidas; solo se sustentan las ilustraciones de fechas mezcladas anteriores."}}], "defensibility": [{"drug": "pemvidutide", "molecule": {"en": "Modified 29-residue peptide (Aib at position 2, Glu16–Lys20 lactam bridge, Lys17 conjugated to a C18 glucuronic-acid EuPort domain), originating from Mederis and licensed to Altimmune; documented from the WO publication and granted patent claims.", "es": "Péptido modificado de 29 residuos (Aib en posición 2, puente lactámico Glu16–Lys20, Lys17 conjugado a un dominio EuPort de ácido glucurónico C18), originado en Mederis y licenciado a Altimmune; documentado en la publicación WO y reivindicaciones de patentes concedidas.", "source_ids": ["ALT-IP-003", "ALT-IP-006", "ALT-IP-001"]}, "composition_of_matter": {"en": "EP3155017B1 (EPO grant published 2024-01-10, proprietor Mederis) claims SEQ ID 1119 — matching pemvidutide — and its pharmaceutical composition; the US family member US11541028B2 (liver use) was granted 2023-01-03.", "es": "EP3155017B1 (concesión EPO publicada el 2024-01-10, titular Mederis) reivindica la SEQ ID 1119 —que corresponde a la pemvidutida— y su composición farmacéutica; el miembro estadounidense de la familia US11541028B2 (uso hepático) se concedió el 2023-01-03.", "source_ids": ["ALT-IP-003", "ALT-IP-005", "ALT-IP-006"]}, "additional_protection": {"en": "EP3735295B1 grants liver-disease use claims (SEQ ID 1119, fatty liver/NAFLD/NASH). Indicative unextended base terms calculate to 2035-05-28 (composition family) and 2039-01-03 (liver-use family); US11541028B2's officially stated 199 days of PTA yields a conditional adjusted date of 2039-07-21. Issuer claims of formulation/dosing terms to 2041 are pending applications, not grants.", "es": "EP3735295B1 concede reivindicaciones de uso en enfermedades hepáticas (SEQ ID 1119, hígado graso/NAFLD/NASH). Los plazos base indicativos sin extensión calculan 2035-05-28 (familia de composición) y 2039-01-03 (familia de uso hepático); los 199 días de PTA declarados oficialmente en US11541028B2 dan una fecha ajustada condicional de 2039-07-21. Las afirmaciones del emisor de plazos de formulación/dosificación hasta 2041 son solicitudes pendientes, no concesiones.", "source_ids": ["ALT-IP-002", "ALT-IP-003", "ALT-IP-004", "ALT-IP-005", "ALT-IP-008"]}, "regulatory_exclusivity": {"en": "No awarded regulatory exclusivity (e.g., orphan or exclusivity codes with end dates) is established for pemvidutide; the license allocates the right to seek future extensions/data exclusivity but does not award them.", "es": "No se ha establecido ninguna exclusividad regulatoria concedida (p. ej., códigos de huérfano o exclusividad con fechas de vencimiento) para la pemvidutida; la licencia atribuye el derecho a buscar futuras extensiones/exclusividad de datos, pero no las concede.", "source_ids": ["ALT-IP-001", "ALT-IP-002"]}, "competitive_workarounds": {"en": "Survodutide, a rival dual GLP-1/glucagon agonist, uses C18 fatty-acid acylation rather than a EuPort domain, making a technical design-around plausible; no claim chart or freedom-to-operate conclusion was established for any rival.", "es": "Survodutida, un rival doble agonista GLP-1/glucagón, utiliza acilación con ácido graso C18 en lugar de un dominio EuPort, lo que hace plausible una elusión técnica; no se estableció ningún cuadro de reivindicaciones ni conclusión de libertad de operación para ningún rival.", "source_ids": ["ALT-IP-009", "ALT-IP-003"]}, "licensing_and_territory": {"en": "The 2019 Mederis–Spitfire agreement documents a worldwide, royalty-free, fully paid-up exclusive license covering GLP1–glucagon/oxyntomodulin therapeutics including SP-1373 (pemvidutide); Mederis retains certain rights outside the exclusive field, and the patent schedules and expanded-field wording are redacted. A 2025 Hercules security interest appears only in a secondary mirror.", "es": "El acuerdo Mederis–Spitfire de 2019 documenta una licencia exclusiva mundial, libre de regalías y plenamente pagada, que cubre terapéuticos GLP1–glucagón/oxintomodulina incluida SP-1373 (pemvidutida); Mederis conserva ciertos derechos fuera del campo exclusivo, y los anexos de patentes y la redacción del campo ampliado están censurados. Una garantía de 2025 a favor de Hercules aparece solo en un espejo secundario.", "source_ids": ["ALT-IP-001", "ALT-IP-002", "ALT-IP-008"]}, "enforceability_and_FTO": {"en": "Unknown: national validations, renewals, oppositions, the official US assignment chain, validity, infringement and freedom to operate were never established; a granted publication proves issuance only, not an enforceable barrier.", "es": "Desconocido: nunca se establecieron las validaciones nacionales, renovaciones, oposiciones, la cadena oficial de cesiones en EE. UU., la validez, la infracción ni la libertad de operación; una publicación concedida prueba solo la concesión, no una barrera exigible.", "source_ids": ["ALT-IP-005", "ALT-IP-008", "ALT-IP-002"]}}], "institutional_risk": [{"category": "OFFICIAL FINDING", "agency": "FDA / GAO", "jurisdiction": "US", "finding": {"en": "GAO found the FDA drug-inspector vacancy rate rose from 9% to 16% between November 2021 and June 2024, reducing inspections; FDA described hiring steps in March 2026.", "es": "La GAO constató que la tasa de vacantes de inspectores de medicamentos de la FDA subió del 9% al 16% entre noviembre de 2021 y junio de 2024, reduciendo las inspecciones; la FDA describió medidas de contratación en marzo de 2026.", "source_ids": ["REG-COMMON-03"]}, "company_pathway": {"en": "If a future pemvidutide facility awaits pre-approval inspection, staffing limits could delay clearance; no company-specific delay is established.", "es": "Si una futura planta de pemvidutida espera una inspección previa a la aprobación, la falta de personal podría retrasar la autorización; no se establece ningún retraso específico de la compañía.", "source_ids": ["REG-COMMON-03"]}, "limitations": {"en": "Shared institutional background only; product/site-specific materiality and timing unknown.", "es": "Solo antecedentes institucionales compartidos; materialidad y calendario específicos de producto/planta desconocidos.", "source_ids": ["REG-COMMON-03"]}}, {"category": "DOCUMENTED FACT", "agency": "FDA", "jurisdiction": "US", "finding": {"en": "FDA's January 2025 draft obesity guidance specifies mean percentage body-weight change versus control as the primary endpoint; it is a draft and not binding.", "es": "El borrador de guía de obesidad de la FDA de enero de 2025 especifica el cambio porcentual medio de peso corporal frente a control como criterio principal; es un borrador y no es vinculante.", "source_ids": ["REG-COMMON-01"]}, "company_pathway": {"en": "Future finalization could alter trial-design expectations for pemvidutide's weight-related claims, though PERFORMA's MASH histology endpoints are already agreed directionally via the December 2025 end-of-phase-2 meeting.", "es": "Una futura versión final podría alterar las expectativas de diseño para las afirmaciones de peso de la pemvidutida, aunque los criterios histológicos de MASH de PERFORMA ya tienen dirección acordada mediante la reunión de fin de fase 2 de diciembre de 2025.", "source_ids": ["REG-COMMON-01", "ALT-PATH-007"]}, "limitations": {"en": "Draft guidance is a baseline standard, not a company-specific adverse finding.", "es": "La guía borrador es un estándar de referencia, no un hallazgo adverso específico de la compañía.", "source_ids": ["REG-COMMON-01"]}}, {"category": "DOCUMENTED FACT", "agency": "FDA", "jurisdiction": "US", "finding": {"en": "PDUFA VII sets FY2026 application fees of $4,682,003 for applications requiring clinical data, with sponsor program fees through FY2027.", "es": "PDUFA VII fija tasas de solicitud de 4.682.003 USD para el año fiscal 2026 en solicitudes con datos clínicos, con tasas de programa para patrocinadores hasta el año fiscal 2027.", "source_ids": ["REG-COMMON-04"]}, "company_pathway": {"en": "A future pemvidutide NDA would carry this cost and depend on review capacity funded partly by these fees; fees alone are no evidence of biased decisions.", "es": "Una futura NDA de pemvidutida llevaría este coste y dependería de una capacidad de revisión financiada en parte por estas tasas; las tasas por sí solas no evidencian decisiones sesgadas.", "source_ids": ["REG-COMMON-04"]}, "limitations": {"en": "Program-level fact with no company-specific transmission event.", "es": "Hecho a nivel de programa sin evento de transmisión específico de la compañía.", "source_ids": ["REG-COMMON-04"]}}, {"category": "DOCUMENTED FACT", "agency": "EMA", "jurisdiction": "EU", "finding": {"en": "EMA's 2017 weight-management guideline governs EU evidence expectations, and its revised independence policy effective May 2025 excluded conflicted experts and aligned a three-year cooling-off period following CJEU rulings.", "es": "La guía de control de peso de la EMA de 2017 rige las expectativas de evidencia en la UE, y su política revisada de independencia vigente desde mayo de 2025 excluyó a expertos con conflictos y alineó un periodo de enfriamiento de tres años tras sentencias del TJUE.", "source_ids": ["REG-COMMON-02", "REG-COMMON-07"]}, "company_pathway": {"en": "Any future EU submission for pemvidutide must meet these evidence and procedural standards; expert-eligibility rules could affect review composition or timing.", "es": "Cualquier futura solicitud europea de pemvidutida deberá cumplir estos estándares de evidencia y procedimiento; las reglas de elegibilidad de expertos podrían afectar la composición o el calendario de la revisión.", "source_ids": ["REG-COMMON-02", "REG-COMMON-07"]}, "limitations": {"en": "Procedural background only; no covered-product conflict, review failure or company-specific finding established.", "es": "Solo antecedentes de procedimiento; no se estableció conflicto de producto cubierto, fallo de revisión ni hallazgo específico de la compañía.", "source_ids": ["REG-COMMON-07"]}}], "scenarios": [{"type": "bear", "assumption": {"en": "PERFORMA reproduces IMPACT's nonsignificant fibrosis signal (33%/36% vs 28%) and the unverified AUD result fails independent scrutiny.", "es": "PERFORMA reproduce la señal de fibrosis no significativa de IMPACT (33%/36% vs 28%) y el resultado de TAH no verificado no supera el escrutinio independiente.", "source_ids": ["C-ALT-1", "C-ALT-3"]}, "trigger": {"en": "The anticipated 2029 PERFORMA 52-week histology readout misses statistical significance, or RESTORE's 2027 ALD topline disappoints.", "es": "La lectura de histología a 52 semanas de PERFORMA prevista para 2029 no alcanza significación estadística, o los resultados de ALD de RESTORE en 2027 decepcionan.", "source_ids": ["C-ALT-2", "ALT-PATH-003"]}, "affected_drug_territory": {"en": "Pemvidutide in MASH F2–F3, AUD and ALD across planned territories.", "es": "Pemvidutida en MASH F2–F3, TAH y HAA en todos los territorios previstos.", "source_ids": ["C-ALT-2", "C-ALT-3"]}, "economic_consequence": {"en": "Program value could collapse toward cash; with ~$45M half-year burn against $518.5M, continued spending would pressure equity through dilution, alongside 75M $3 warrants and other overhangs.", "es": "El valor del programa podría colapsar hacia la caja; con ~45 M por semestre de gasto frente a 518,5 M, el gasto continuado presionaría el capital mediante dilución, junto a 75 M de warrants a 3 USD y otras cargas.", "source_ids": ["ALT-F1", "ALT-PRICE-003"]}, "timing_and_indicators": {"en": "RESTORE topline 2H2027; PERFORMA interim ~2029; watch enrollment, protocol amendments and any FDA meeting outcomes.", "es": "Resultados de RESTORE 2S2027; interim de PERFORMA ~2029; vigilar reclutamiento, enmiendas de protocolo y resultados de reuniones con la FDA.", "source_ids": ["ALT-PATH-003", "ALT-PATH-002", "ALT-PATH-009"]}}, {"type": "base", "assumption": {"en": "Development continues per plan with no pivotal readout before 2027–2029, against two approved US competitors and three Phase 3 rivals.", "es": "El desarrollo continúa según lo planeado sin lectura pivotal antes de 2027–2029, frente a dos competidores aprobados en EE. UU. y tres rivales en fase 3.", "source_ids": ["ALT-COMP-001", "ALT-COMP-003", "ALT-COMP-006", "ALT-COMP-009"]}, "trigger": {"en": "Routine milestones: RESTORE ALD topline in 2H2027, PERFORMA enrollment and the undated AUD end-of-phase-2 meeting.", "es": "Hitos ordinarios: resultados de ALD de RESTORE en 2S2027, reclutamiento de PERFORMA y la reunión de fin de fase 2 de TAH sin fecha.", "source_ids": ["ALT-PATH-003", "ALT-PATH-010", "ALT-PATH-009"]}, "affected_drug_territory": {"en": "Pemvidutide in MASH, AUD and ALD; US-first regulatory focus.", "es": "Pemvidutida en MASH, TAH y HAA; enfoque regulatorio con EE. UU. primero.", "source_ids": ["ALT-PATH-003"]}, "economic_consequence": {"en": "No revenue; value tracks probability-weighted pipeline perception and funding capacity, with dilution likely before any approval.", "es": "Sin ingresos; el valor sigue la percepción ponderada del pipeline y la capacidad de financiación, con dilución probable antes de cualquier aprobación.", "source_ids": ["ALT-F1", "ALT-F2"]}, "timing_and_indicators": {"en": "2027–2029; indicators include registry updates, SEC filings showing cash trajectory and any new financing.", "es": "2027–2029; los indicadores incluyen actualizaciones de registros, presentaciones ante la SEC que muestren la trayectoria de caja y cualquier nueva financiación.", "source_ids": ["ALT-PATH-009", "ALT-F1"]}}, {"type": "bull", "assumption": {"en": "PERFORMA cohort 1 shows statistically significant 52-week histology benefit in ~990 F2–F3 patients, supporting an accelerated-approval filing like Rezdiffra's and semaglutide's MASH precedents.", "es": "El cohorte 1 de PERFORMA muestra beneficio histológico a 52 semanas estadísticamente significativo en ~990 pacientes F2–F3, sustentando una presentación de aprobación acelerada como los precedentes de Rezdiffra y semaglutida en MASH.", "source_ids": ["ALT-PATH-002", "ALT-PATH-001", "ALT-COMP-001", "ALT-COMP-003"]}, "trigger": {"en": "Positive 52-week biopsy interim anticipated 2029, potentially preceded by positive RESTORE and RECLAIM follow-through in 2027.", "es": "Interim positivo de biopsia a 52 semanas previsto para 2029, potencialmente precedido por resultados positivos de RESTORE y seguimiento de RECLAIM en 2027.", "source_ids": ["ALT-PATH-002", "ALT-PATH-003", "C-ALT-3"]}, "affected_drug_territory": {"en": "Pemvidutide in US MASH F2–F3 first, with AUD/ALD as optional expansions.", "es": "Pemvidutida primero en MASH F2–F3 en EE. UU., con TAH/HAA como expansiones opcionales.", "source_ids": ["ALT-PATH-002", "ALT-PATH-006"]}, "economic_consequence": {"en": "Approval in a population FDA sizes at 6–8 million US adults could support substantial value, though competition from Wegovy and Rezdiffra and further funding needs would still cap economics; no revenue estimate is supported by the evidence.", "es": "La aprobación en una población que la FDA cifra en 6–8 millones de adultos estadounidenses podría sustentar un valor considerable, aunque la competencia de Wegovy y Rezdiffra y las necesidades adicionales de financiación seguirían limitando la economía; la evidencia no sustenta ninguna estimación de ingresos.", "source_ids": ["ALT-COMP-001", "ALT-COMP-003", "ALT-F1"]}, "timing_and_indicators": {"en": "2027–2029+; indicators are RESTORE topline, PERFORMA interim quality, FDA meeting minutes and patent-family maintenance.", "es": "2027–2029+; los indicadores son los resultados de RESTORE, la calidad del interim de PERFORMA, las actas de reuniones con la FDA y el mantenimiento de la familia de patentes.", "source_ids": ["ALT-PATH-003", "ALT-PATH-002", "ALT-IP-003"]}}], "risk_scenarios": [{"kind": "regulatory_downside", "trigger": {"en": "FDA/EMA requests additional efficacy, safety or CMC evidence, restricts a label, or a manufacturing inspection finds deficiencies; FDA draft obesity guidance could also tighten future standards.", "es": "La FDA/EMA solicita evidencia adicional de eficacia, seguridad o CMC, restringe una etiqueta, o una inspección de fabricación halla deficiencias; el borrador de guía de obesidad de la FDA también podría endurecer estándares futuros.", "source_ids": ["REG-COMMON-01", "REG-COMMON-03"]}, "affected_drug_territory": {"en": "Pemvidutide in the US and EU wherever filed.", "es": "Pemvidutida en EE. UU. y la UE donde se presente.", "source_ids": ["REG-COMMON-01"]}, "economic_consequence": {"en": "Review delay or label limits could postpone launch, shrink the eligible population or raise trial and manufacturing spending; no probability or numerical effect is assigned.", "es": "Un retraso de revisión o límites de etiqueta podrían posponer el lanzamiento, reducir la población elegible o aumentar el gasto en ensayos y fabricación; no se asigna probabilidad ni efecto numérico.", "source_ids": ["REG-COMMON-01"]}, "timing_and_indicators": {"en": "Next filing/inspection cycles from 2027; indicators are FDA/EMA meeting records, inspection findings and company filing updates.", "es": "Próximos ciclos de presentación/inspección desde 2027; los indicadores son registros de reuniones FDA/EMA, hallazgos de inspección y actualizaciones de la compañía.", "source_ids": ["REG-COMMON-03"]}, "mitigation_or_counterevidence": {"en": "The December 2025 MASH end-of-phase-2 meeting with January 2026 minutes shows an agreed development path; no company-specific finding, misconduct or regulatory failure is established.", "es": "La reunión de fin de fase 2 de MASH de diciembre de 2025 con actas de enero de 2026 muestra una vía de desarrollo acordada; no se establece ningún hallazgo específico, mala conducta ni fallo regulatorio de la compañía.", "source_ids": ["ALT-PATH-007", "REG-COMMON-03"]}}, {"kind": "ip_loss", "trigger": {"en": "A relevant patent expires, is narrowed or invalidated, national rights lapse for non-payment or non-validation, or a lawful competing molecule (e.g., survodutide's C18-acylated design) gains authorization without infringing.", "es": "Una patente relevante expira, se restringe o invalida, los derechos nacionales caducan por falta de pago o validación, o una molécula competidora legal (p. ej., el diseño acilado C18 de survodutida) obtiene autorización sin infringir.", "source_ids": ["ALT-IP-009", "ALT-IP-003", "ALT-IP-004"]}, "affected_drug_territory": {"en": "Pemvidutide in the US and validated European jurisdictions; base terms calculate to 2035-05-28 (composition) and 2039-01-03 (liver use) before extensions.", "es": "Pemvidutida en EE. UU. y jurisdicciones europeas validadas; los plazos base calculan 2035-05-28 (composición) y 2039-01-03 (uso hepático) antes de extensiones.", "source_ids": ["ALT-IP-003", "ALT-IP-004", "ALT-IP-008"]}, "economic_consequence": {"en": "Loss or bypass of the legal barrier could increase price and volume competition and erode product economics; the magnitude cannot be quantified without sourced substitution assumptions.", "es": "La pérdida o elusión de la barrera legal podría intensificar la competencia en precio y volumen y erosionar la economía del producto; la magnitud no puede cuantificarse sin supuestos sustentados de sustitución.", "source_ids": ["ALT-IP-001", "ALT-IP-009"]}, "timing_and_indicators": {"en": "Unknown precisely; leading indicators are patent-office and court records, EPO oppositions, national validation/fee records and FDA/EMA approvals of competing products.", "es": "Desconocido con precisión; los indicadores adelantados son registros de oficinas de patentes y tribunales, oposiciones EPO, registros nacionales de validación/tasas y aprobaciones FDA/EMA de productos competidores.", "source_ids": ["ALT-IP-008", "ALT-IP-003"]}, "mitigation_or_counterevidence": {"en": "Verified granted claims (EP3155017B1, EP3735295B1, US11541028B2 with 199 days PTA), a documented worldwide exclusive license and possible additional formulation/dosing patents could partly offset; none is presumed decisive and enforceability remains unverified.", "es": "Reivindicaciones concedidas verificadas (EP3155017B1, EP3735295B1, US11541028B2 con 199 días de PTA), una licencia exclusiva mundial documentada y posibles patentes adicionales de formulación/dosificación podrían compensar en parte; ninguna se presume decisiva y la exigibilidad sigue sin verificar.", "source_ids": ["ALT-IP-003", "ALT-IP-004", "ALT-IP-005", "ALT-IP-001", "ALT-IP-002"]}}], "ratings": [{"dimension": "clinical_evidence", "rating": "POOR", "reason": {"en": "The only peer-reviewed biopsy evidence in the lead MASH indication missed statistical significance (33%/36% vs 28%, p=0.59/0.27); the AUD topline is an unverified company statement and no pivotal result exists.", "es": "La única evidencia por biopsia revisada por pares en la indicación principal de MASH no alcanzó significación estadística (33%/36% vs 28%, p=0,59/0,27); el resultado de TAH es una afirmación empresarial no verificada y no existe resultado pivotal.", "source_ids": ["C-ALT-1", "C-ALT-3"]}}, {"dimension": "ip_economic_defensibility", "rating": "FAIR", "reason": {"en": "Granted composition and liver-use patents (base 2035/2039, US adjusted 2039-07-21) and a worldwide exclusive license are documented, but national status, enforceability and freedom to operate remain unverified.", "es": "Patentes concedidas de composición y uso hepático (base 2035/2039, EE. UU. ajustada a 2039-07-21) y una licencia exclusiva mundial están documentadas, pero el estado nacional, la exigibilidad y la libertad de operación siguen sin verificar.", "source_ids": ["ALT-IP-003", "ALT-IP-004", "ALT-IP-005", "ALT-IP-001"]}}, {"dimension": "financial_strength", "rating": "FAIR", "reason": {"en": "$518.5M cash versus $45.2M H1 operating cash use gives multi-year runway on paper, but a Phase 3 to ~2029 plus management's own twelve-month framing implies future dilution across a large warrant/option overhang.", "es": "518,5 M de caja frente a 45,2 M de uso operativo en el 1S dan patrimonio para varios años sobre el papel, pero una fase 3 hasta ~2029 más el propio marco de doce meses de la dirección implica dilución futura sobre una gran carga de warrants/opciones.", "source_ids": ["ALT-F1", "ALT-F2", "ALT-PRICE-003"]}}, {"dimension": "regulatory_exposure", "rating": "FAIR", "reason": {"en": "No company-specific regulatory finding or misconduct was identified in the searched record; an accelerated-approval precedent and a completed end-of-phase-2 MASH meeting support the path, while draft guidance and inspection-capacity findings are shared institutional background.", "es": "No se identificó hallazgo regulatorio ni mala conducta específicos de la compañía en los registros consultados; un precedente de aprobación acelerada y una reunión de fin de fase 2 de MASH completada apoyan la vía, mientras que la guía borrador y los hallazgos de capacidad de inspección son antecedentes institucionales compartidos.", "source_ids": ["ALT-PATH-001", "ALT-PATH-007", "REG-COMMON-01", "REG-COMMON-03"]}}, {"dimension": "competitive_position", "rating": "POOR", "reason": {"en": "Resmetirom (2024) and semaglutide (2025 label) are already approved in the same US F2–F3 population, and three well-resourced Phase 3 rivals (survodutide, efruxifermin, pegozafermin) target it, with no head-to-head data for pemvidutide.", "es": "Resmetirom (2024) y semaglutida (etiqueta 2025) ya están aprobados en la misma población estadounidense F2–F3, y tres rivales bien financiados en fase 3 (survodutida, efruxifermina, pegozafermina) la atacan, sin datos comparativos directos para la pemvidutida.", "source_ids": ["ALT-COMP-001", "ALT-COMP-003", "ALT-COMP-005", "ALT-COMP-008", "ALT-COMP-011"]}}, {"dimension": "valuation_attractiveness", "rating": "UNKNOWN", "reason": {"en": "A dated $2.61 close and transparent illustrative figures exist ($507.7M basic cap, $24.2M basic EV), but post-June cash and post-August capital structure are unreconciled, so current cheapness or expensiveness cannot be judged.", "es": "Existe un cierre fechado de 2,61 USD y cifras ilustrativas transparentes (507,7 M de capitalización básica, 24,2 M de EV básico), pero la caja posterior a junio y la estructura de capital posterior a agosto no están conciliadas, por lo que no puede juzgarse la baratura o carestía actual.", "source_ids": ["ALT-PRICE-001", "ALT-PRICE-002", "ALT-PRICE-003", "ALT-F1"]}}, {"dimension": "catalyst_quality", "rating": "FAIR", "reason": {"en": "A nearer, dated evidence event exists (RESTORE ALD topline expected 2H2027) ahead of the pivotal PERFORMA interim anticipated 2029, but both are sponsor expectations and the AUD regulatory meeting is undated.", "es": "Existe un evento de evidencia más cercano y fechado (resultados de ALD de RESTORE esperados en el 2S2027) antes del interim pivotal de PERFORMA previsto para 2029, pero ambos son expectativas del patrocinador y la reunión regulatoria de TAH no tiene fecha.", "source_ids": ["ALT-PATH-003", "ALT-PATH-010", "ALT-PATH-002"]}}], "unknowns": [{"en": "Post-June 30 cash, debt and post-August 7 share/warrant changes are unreconciled, so no current market cap or enterprise value can be calculated.", "es": "La caja y deuda posteriores al 30 de junio y los cambios de acciones/warrants posteriores al 7 de agosto no están conciliados, por lo que no puede calcularse capitalización ni EV actuales.", "source_ids": ["ALT-PRICE-003", "ALT-F1"]}, {"en": "RECLAIM AUD results rest only on company topline; registry results, peer-reviewed publication and detailed adverse events remain unverified.", "es": "Los resultados de RECLAIM en TAH se basan solo en el anuncio de la compañía; los resultados del registro, la publicación revisada por pares y los eventos adversos detallados siguen sin verificar.", "source_ids": ["C-ALT-3", "ALT-PATH-011"]}, {"en": "Current national patent validation, renewal, opposition and official assignment-chain status for the verified grants is unknown, as is any formal freedom-to-operate conclusion.", "es": "Se desconocen la validación nacional actual, renovaciones, oposiciones y la cadena oficial de cesiones de las ifying future ANDA pathways; tirzepatide is already an approved competitor, and Roche's enicepatide is in Phase 3 — scenario, not established entry dates.", "es": "La FDA publicó 17 guías revisadas en borrador sobre péptidos genéricos, incluida semaglutida, aclarando futuras vías de ANDA; tirzepatida ya es competidor aprobado y enicepatide de Roche está en fase 3: escenario, sin fechas de entrada establecidas.", "source_ids": ["REG-COMMON-05", "NVO-SUP-012", "NVO-SUP-010"]}, "licensing_and_territory": {"en": "Country coverage varies; product names, approval types and indications are territory-specific (e.g., Wegovy vs Kayshild in the EU).", "es": "La cobertura por país varía; nombres, tipos de aprobación e indicaciones son específicos por territorio (p. ej., Wegovy vs Kayshild en la UE).", "source_ids": ["REG-NVO-01", "C-NVO-1", "C-NVO-7"]}, "enforceability_and_FTO": {"en": "Unknown: no bounded legal opinion or adjudication establishes FTO, infringement, validity or enforceability; a Mylan IPR challenges a method-of-treatment patent but does not adjudicate core composition rights.", "es": "Desconocido: ninguna opinión legal ni adjudicación acotada establece FTO, infracción, validez o exigibilidad; una IPR de Mylan cuestiona una patente de método de tratamiento sin adjudicar los derechos de composición básicos.", "source_ids": ["REG-NVO-02"]}}, {"drug": "liraglutide (Saxenda, Victoza)", "molecule": {"en": "Peptide GLP-1 analogue, Novo's earlier generation obesity/diabetes injection.", "es": "Análogo péptido de GLP-1, inyección de generación anterior de Novo para obesidad/diabetes.", "source_ids": ["ID-NVO-01", "REG-NVO-01"]}, "composition_of_matter": {"en": "Management reports active-ingredient patents expired in the US, China, Japan and Germany.", "es": "La dirección informa que las patentes del ingrediente activo expiraron en EE. UU., China, Japón y Alemania.", "source_ids": ["REG-NVO-01"]}, "additional_protection": {"en": "Formulation and regulatory status remain e/liraglutide from the 503B bulk list, and shortage rules condition compounding copies on shortage status; no final 503B exclusion is established.", "es": "La FDA propuso excluir semaglutida/tirzepatida/liraglutida de la lista de graneles 503B, y las reglas de escasez condicionan las copias compuestas al estatus de escasez; no hay exclusión 503B final establecida.", "source_ids": ["REG-COMMON-06"]}, "company_pathway": {"en": "Lawful compounded supply can change with shortage status or bulk-list policy, affecting branded GLP-1 sales; magnitude not quantified.", "es": "La oferta compuesta lawful puede cambiar con el estatus de escasez o la política de graneles, afectando ventas de GLP-1 de marca; magnitud no cuantificada.", "source_ids": ["REG-COMMON-06"]}, "limitations": {"en": "Final policy disposition, enforcement and demand substitution remain uncertain.", "es": "La disposición final de política, la aplicación y la sustitución de demanda siguen siendo inciertas.", "source_ids": ["REG-COMMON-06"]}}, {"category": "OFFICIAL FINDING", "agency": "US Court of Appeals, Fifth Circuit / FDA", "jurisdiction": "US", "finding": {"en": "The Fifth Circuit affirmed judgment for FDA/Novo on the Ozempic/Wegovy semaglutide shortage delisting, holding any APA notice-and-comment error harmless and the FDA action not arbitrary or capricious (unpublished, Sep 1 2026).", "es": "El Quinto Circuito confirmó el fallo a favor de la FDA/Novo sobre la salida de semaglutida (Ozempic/Wegovy) de la lista de escasez, considerando inofensivo cualquier error de notificación APA y la acción de la FDA no arbitraria ni caprichosa (inédito, 1 sep 2026).", "source_ids": ["REG-NVO-03"]}, "company_pathway": {"en": "Affirmance preserves the delisting baseline, limiting shortage-dependent compounded copies while conditions hold; favorable to Novo.", "es": "La confirmación preserva la línea base de deslistado, limitando copias compuestas dependientes de escasez mientras persistan las condiciones; favorable a Novo.", "source_ids": ["REG-NVO-03"]}, "limitations": {"en": "Future shortage status, possible further review and demand substitution are unknown; no sales effect quantified.", "es": "El futuro estatus de escasez, posible revisión adicional y sustitución de demanda son desconocidos; sin efecto en ventas cuantificado.", "source_ids": ["REG-NVO-03", "REG-COMMON-06"]}}, {"category": "DOCUMENTED FACT", "agency": "FDA", "jurisdiction": "US", "finding": {"en": "FDA approved Wegovy HD 7.2 mg semaglutide 54 days after filing under the Commissioner's National Priority Voucher pilot (Mar 19 2026); official timing, not a finding of preferential treatment.", "es": "La FDA aprobó Wegovy HD 7.2 mg de semaglutida 54 días después de la presentación bajo el piloto de Cupones de Prioridad Nacional del Comisionado (19 mar 2026); cronología oficial, no un hallazgo de trato preferencial.", "source_ids": ["REG-NVO-04"]}, "company_pathway": {"en": "Faster supplemental approval may aid lifecycle and competitive positioning; no rights extension or impropriety established.", "es": "La aprobación suplementaria más rápida puede ayudar al ciclo de vida y posicionamiento competitivo; sin extensión de derechos ni improperio establecido.", "source_ids": ["REG-NVO-04"]}, "limitations": {"en": "Sales impact and comparative use of the higher dose are unknown.", "es": "El impacto en ventas y el uso comparativo de la dosis mayor son desconocidos.", "source_ids": ["REG-NVO-04"]}}, {"category": "OFFICIAL FINDING", "agency": "FDA", "jurisdiction": "US/EU", "finding": {"en": "US MASH approval for Wegovy is accelerated and conditional on a 240-week ESSENCE confirmatory trial; the EU's Kayshild conditional authorization likewise requires ongoing long-term clinical outcome data.", "es": "La aprobación en MASH de Wegovy en EE. UU. es acelerada y condicionada al estudio confirmatorio ESSENCE de 240 semanas; la autorización condicional de Kayshild en la UE igualmente exige datos clínicos de resultados a largo p icators": {"en": "Dated only where evidence shows an expiry (China 2026 per issuer estimate); leading indicators are patent-office/court records, FDA/EMA generic or alternative approvals and sponsor disclosures.", "es": "Con fecha solo donde la evidencia muestra vencimiento (China 2026 según el emisor); indicadores: registros de oficinas de patentes/tribunales, aprobaciones genéricas o alternativas de FDA/EMA y divulgaciones del patrocinador.", "source_ids": ["REG-NVO-01", "REG-COMMON-05", "NVO-SUP-005"]}, "mitigation_or_counterevidence": {"en": "Mitigation: FDA-listed later formulation/use patents into 2033-2041, exclusivities to 2027/2028, differentiated clinical profile and manufacturing scale; none presumed decisive, and enforceability remains unestablished.", "es": "Mitigación: patentes posteriores de formulación/uso listadas por la FDA hasta 2033-2041, exclusividades hasta 2027/2028, perfil clínico diferenciado y escala de fabricación; nada se presume decisivo y la exigibilidad sigue sin establecerse.", "source_ids": ["NVO-SUP-005", "REG-NVO-01"]}}], "ratings": [{"dimension": "clinical_evidence", "rating": "GOOD", "reason": {"en": "Semaglutide has multiple FDA/EU approvals with outcome-relevant indications, though the US MASH basis is a surrogate under accelerated approval and CagriSema's highest-dose head-to-head missed its endpoint.", "es": "Semaglutida tiene múltiples aprobaciones FDA/UE con indicaciones de resultados, aunque la base de MASH en EE. UU. es un sustituto bajo aprobación acelerada y CagriSema falló su endpoint en la comparación de dosis máxima.", "source_ids": ["C-NVO-1", "C-NVO-2", "C-NVO-7", "C-NVO-4"]}}, {"dimension": "ip_economic_defensibility", "rating": "FAIR", "reason": {"en": "FDA-listed Wegovy patents run to Dec 2031 plus formulation/use rights into 2033-2041, but an expiry-date discrepancy persists, China expiry is estimated at 2026, and enforceability/FTO are unestablished.", "es": "Las patentes de Wegovy listadas por la FDA llegan a conciliar.", "source_ids": ["NVO-F1", "NVO-SUP-002"]}, {"en": "No legal opinion establishes patent enforceability, validity or freedom-to-operate for semaglutide or liraglutide; the Mylan IPR outcome is not established in this packet.", "es": "Ninguna opinión legal establece exigibilidad, validez o libertad de operación de las patentes de semaglutida o liraglutida; el resultado de la IPR de Mylan no está establecido en este paquete.", "source_ids": ["REG-NVO-02"]}, {"en": "CagriSema is investigational in the retrieved September 2026 sponsor evidence, with a US decision expected in Q4 2026. The decision outcome and longer-term comparative benefit remain uncertain; the high-dose REDEFINE 4 result is already known.", "es": "CagriSema sigue en investigación según el patrocinador en septiembre de 2026, con decisión estadounidense prevista para el 4T de 2026. El resultado de la decisión y el beneficio comparativo a largo plazo siguen siendo inciertos; el resultado de REDEFINE 4 a dosis altas ya se conoce.", "source_ids": ["NVO-SUP-007"]}, {"en": "Broker account-level access for a Costa Rica investor is unverified: IBKR's public country list does not establish account approval or NVO contract availability.", "es": "El acceso a nivel de cuenta para un inversionista en Costa Rica no está verificado: la lista pública de países de IBKR no establece aprobación de cuenta ni disponibilidad del contrato NVO.", "source_ids": ["NVO-SUP-011"]}], "coverage_boundary": {"en": "Coverage is bounded: semaglutide franchise, CagriSema and zenagamtide/amycretin clinically; semaglutide and liraglutide for IP mapping (insulin and other peptide portfolios excluded); no synchronized market-price basis; sponsor toplines are not independent publications; absence of documented misconduct is not evidence of absence.", "es": "La cobertura es acotada: clínicamente franquicia de semaglutida, CagriSema y zenagamtida/amycretin; mapeo de PI solo para semaglutida y liraglutida (insulinas y otros péptidos excluidos); sin base de precios de mercado sincronizados; los resultados del patrocinador no son publicaciones independientes; la ausencia de misconduct documentado no es prueba de ausencia.", "source_ids": ["C-NVO-6", "REG-NVO-01", "NVO-SUP-003"]}}, {"ticker": "PTGX", "company": "Protagonist Therapeutics, Inc.", "class": "emerging_commercial", "cutoff": "2026-10-11", "regulatory_chips": [], "card": {"what_you_buy": {"en": "You buy a stake in two FDA-approved peptides via partners: icotrokinra (ICOTYDE, oral IL-23 receptor antagonist) clears psoriasis skin in Phase 3, and rusfertide (MIMRYLO, hepcidin mimetic) kept 76.9% of polycythemia vera patients phlebotomy-free versus 32.9% on placebo (n=293, 32 weeks).", "es": "Se compra participación en dos péptidos aprobados por la FDA vía socios: icotrokinra (ICOTYDE, antagonista oral del receptor IL-23) aclara la piel en psoriasis en fase 3, y rusfertide (MIMRYLO, mimético de hepcidina) mantuvo sin flebotomías al 76,9% de pacientes con policitemia vera frente al 32,9% con placebo (n=293, 32 semanas).", "source_ids": ["C-PTGX-1", "C-PTGX-2", "C-PTGX-3", "C-PTGX-5", "REG-PTGX-04"]}, "why_it_could_work": {"en": "PTGX holds contractual economics, not partner sales: tiered 6–10% royalties (7.25% weighted on first USD 4bn) on J&J's worldwide ICOTYDE net sales, and 14–29% plus up to USD 775m milestones on Takeda's worldwide MIMRYLO sales; the main dependency is entirely on partner launch execution.", "es": "PTGX conserva la economía contractual, no las ventas de los socios: regalías escalonadas del 6–10% (7,25% ponderado sobre los primeros 4.000 M USD) sobre ventas mundiales de ICOTYDE de J&J, y 14–29% más hasta 775 M USD en hitos sobre las ventas de MIMRYLO de Takeda; la dependencia principal es la ejecución comercial de los socios.", "source_ids": ["PTGX-F1", "REG-PTGX-02", "PTGX-SUP-02"]}, "what_can_kill_it": {"en": "Fact: retrieved official FDA datasets show no MIMRYLO patent or exclusivity rows, and long-term rusfertide safety
