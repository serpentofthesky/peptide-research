 study is required. Scenario: if patent/exclusivity protection is absent, narrowed or bypassed, or launches underperform against Jakafi in PV and Sotyktu/injectables in psoriasis, the royalty stream could be far smaller than the ~USD 9.3bn market cap implies.", "es": "Hecho: los conjuntos oficiales de la FDA consultados no muestran patentes ni exclusividad para MIMRYLO, y se exige un estudio de seguridad a largo plazo de rusfertide. Escenario: si la protección por patente/exclusividad falta, se reduce o se sortea, o los lanzamientos decepcionan frente a Jakafi en PV y Sotyktu/biológicos inyectables en psoriasis, la corriente de regalías podría ser mucho menor que lo que implican los ~9.300 M USD de capitalización.", "source_ids": ["C-PTGX-7", "PTGX-SUP-OB-MIMRYLO", "PTGX-SUP-FDA-ZIP", "PTGX-SUP-RIVAL1", "PTGX-SUP-RIVAL2", "PTGX-SUP-01", "PTGX-SUP-02"]}, "financial_strength": {"en": "Cash and marketable securities of USD 849.5m (June 30, 2026), USD 170.1m H1 operating cash inflow driven by partner payments, USD 275m more earned in August and expected in Q4 2026, plus a USD 300m buyback authorization (not yet executed) mean no funding need is evidenced, though these are dated or forecast figures.", "es": "Efectivo y valores negociables de 849,5 M USD (30-jun-2026), entrada operativa de 170,1 M USD en el 1S impulsada por pagos de socios, 275 M USD adicionales devengados en agosto y esperados en el 4T 2026, más una autorización de recompra de 300 M USD (sin ejecutar) indican que no se evidencia necesidad de financiación, aunque son cifras fechadas o previstas.", "source_ids": ["PTGX-F1", "PTGX-SUP-04"]}, "valuation": {"en": "A dated basis exists (USD 143.73 close Oct 9, 2026; ~USD 9.3bn market cap; ~USD 8.67bn warrant-adjusted EV on stale June cash), but without sourced sales or royalty forecasts, whether that price is attractive is a judgment the evidence cannot settle.", "es": "Existe una base fechada (cierre de 143,73 USD el 9-oct-2026; ~9.300 M USD de capitalización; ~8.670 M USD de EV ajustado por warrants con caja de junio), pero sin previsiones respaldadas de ventas o regalías, si ese precio es atractivo es un juicio que la evidencia no puede resolver.", "source_ids": ["PTGX-SUP-01", "PTGX-SUP-02", "PTGX-SUP-04"]}, "next_catalyst": {"en": "Partner launch execution through late 2026–2027 (first ICOTYDE and MIMRYLO adoption reports, plus the expected Q4 2026 receipt of USD 275m earned payments) will provide the first evidence on royalty potential; PsA/UC/Crohn Phase 3 programs additionally require successful future data.", "es": "La ejecución de los lanzamientos hasta finales de 2026–2027 (primeros datos de adopción de ICOTYDE y MIMRYLO, más el cobro esperado de 275 M USD devengados en el 4T 2026) dará la primera evidencia del potencial de regalías; los programas de fase 3 en AP/UC/Crohn requieren además futuros datos exitosos.", "source_ids": ["PTGX-SUP-04", "PTGX-SUP-02"]}}, "valuation_inputs": [{"label": {"en": "Latest completed-session closing price, Nasdaq common stock", "es": "Precio de cierre de la última sesión completada, acción común Nasdaq"}, "value": 143.73, "unit": "USD per share", "as_of": "2026-10-09; provider notes split adjustment, so Close not guaranteed raw as-traded across earlier corporate actions", "source_ids": ["PTGX-SUP-01"], "unknown_reason": null}, {"label": {"en": "Common shares outstanding (cover-date count)", "es": "Acciones comunes en circulación (cifra de portada)"}, "value": 64708285, "unit": "shares", "as_of": "2026-07-31; supersedes June 30 balance-sheet count, not a same-day October count", "source_ids": ["PTGX-SUP-02"], "unknown_reason": null}, {"label": {"en": "Pre-funded warrants outstanding (kept separate from common shares)", "es": "Warrants prefinanciados en circulación (separados de las acciones comunes)"}, "value": 1500000, "unit": "pre-funded warrant shares", "as_of": "2026-06-30; USD 0.001 residual exercise price each; not counted twice with basic shares", "source_ids": ["PTGX-F1", "PTGX-SUP-02"], "unknown_reason": null}, {"label": {"en": "Cash, cash equivalents and marketable securities", "es": "Efectivo, equivalentes y valores negociables"}, "value": 849.5, "unit": "USD million", "as_of": "2026-06-30; dated stock, not current October cash", "source_ids": ["PTGX-F1"], "unknown_reason": null}, {"label": {"en": "Interest-bearing borrowing debt reported at June 30 (leases separately disclosed)", "es": "Deuda financiera con interés declarada al 30 de junio (arrendamientos por separado)"}, "value": 0, "unit": "USD million", "as_of": "2026-06-30 balance sheet reviewed", "source_ids": ["PTGX-SUP-02"], "unknown_reason": null}, {"label": {"en": "Operating cash generated (H1 2026)", "es": "Caja operativa generada (1S 2026)"}, "value": 170.109, "unit": "USD million", "as_of": "2026-H1; materially affected by partner payments, not a normalized recurring cash flow", "source_ids": ["PTGX-F1"], "unknown_reason": null}, {"label": {"en": "License/collaboration revenue (H1 2026)", "es": "Ingresos por licencias/colaboración (1S 2026)"}, "value": 269.843, "unit": "USD million", "as_of": "2026-H1; includes one-time opt-out and milestone recognition", "source_ids": ["PTGX-F1"], "unknown_reason": null}, {"label": {"en": "Earned post-balance-sheet payments (Takeda opt-out USD 200m + J&J milestone USD 75m)", "es": "Pagos devengados posteriores al balance (opt-out Takeda 200 M USD + hito J&J 75 M USD)"}, "value": 275, "unit": "USD million", "as_of": "Earned August 2026, expected received Q4 2026; not included in June 30 cash; disclosed receipt, not confirmed cash", "source_ids": ["PTGX-F1", "PTGX-SUP-04"], "unknown_reason": null}, {"label": {"en": "Approximate basic market capitalization (close × dated shares)", "es": "Capitalización bursátil básica aproximada (cierre × acciones fechadas)"}, "value": 9300.521803, "unit": "USD million", "as_of": "2026-10-09 price × 2026-07-31 shares; excludes future option grants and contingencies", "source_ids": ["PTGX-SUP-01", "PTGX-SUP-02"], "unknown_reason": null}, {"label": {"en": "Approximate warrant-adjusted enterprise value before leases (stale-cash scenario)", "es": "Valor empresarial aproximado ajustado por warrants antes de arrendamientos (escenario con caja de junio)"}, "value": 8666.664303, "unit": "USD million", "as_of": "2026-10-09 price with June 30 cash; excludes later USD 275m receipts/receivables, repurchase execution, operating movements and ordinary options; optional lease adjustment +USD 9.216m", "source_ids": ["PTGX-SUP-01", "PTGX-SUP-02", "PTGX-SUP-04"], "unknown_reason": null}], "defensibility": [{"drug": "icotrokinra (ICOTYDE)", "molecule": {"en": "Targeted synthetic oral peptide antagonist of the IL-23 receptor; first-in-class oral route in its approved psoriasis use (management assertion of molecule description; approvals are documented).", "es": "Péptido sintético oral dirigido, antagonista del receptor de IL-23; vía oral pionera en su uso aprobado en psoriasis (descripción de la molécula como afirmación de la dirección; las aprobaciones están documentadas).", "source_ids": ["REG-PTGX-01", "C-PTGX-3"]}, "composition_of_matter": {"en": "Orange Book lists US11845808 (expiry 2041-01-14, substance/use), US11939361 (2041-11-19, product/use) and US12552836 (2039-07-12, substance/product); US11845808B2 grant verified at USPTO (granted 2023-12-19, Janssen Biotech and Protagonist as applicants, zero days PTA).", "es": "El Orange Book lista US11845808 (vence 14-ene-2041, sustancia/uso), US11939361 (19-nov-2041, producto/uso) y US12552836 (12-jul-2039, sustancia/producto); la concesión US11845808B2 está verificada en USPTO (concedida 19-dic-2023, Janssen Biotech y Protagonista como solicitantes, cero días de ajuste).", "source_ids": ["PTGX-SUP-OB-ICOTYDE", "PTGX-SUP-USPTO-11845808"]}, "additional_protection": {"en": "Holder-submitted Orange Book patent listings provide the main additional barrier; these are FDA listings, not an FDA opinion on validity or infringement.", "es": "Las listas de patentes del Orange Book presentadas por el titular son la barrera adicional principal; son listados de la FDA, no una opinión sobre validez o infracción.", "source_ids": ["PTGX-SUP-OB-ICOTYDE"]}, "regulatory_exclusivity": {"en": "FDA new-chemical-entity exclusivity through 2031-03-17, on top of US approval (2026-03-17) and EU marketing authorization (2026-09-18).", "es": "Exclusividad de nueva entidad química de la FDA hasta el 17-mar-2031, además de la aprobación en EE. UU. (17-mar-2026) y la autorización de la EMA (18-sep-2026).", "source_ids": ["PTGX-SUP-OB-ICOTYDE", "C-PTGX-3", "C-PTGX-4"]}, "competitive_workarounds": {"en": "Oral TYK2 rival Sotyktu (PASI-75 58% vs 13% placebo at week 16) and injectable IL-23 biologics are alternatives; ICONIC-ADVANCE provides a direct icotrokinra/deucravacitinib comparison, but no proven superiority to injectables from separate studies.", "es": "El rival oral TYK2 Sotyktu (PASI-75 58% vs 13% placebo en la semana 16) y los biológicos inyectables anti-IL-23 son alternativas; ICONIC-ADVANCE ofrece comparación directa icotrokinra/deucravacitinib, pero sin superioridad demostrada frente a inyectables entre estudios separados.", "source_ids": ["PTGX-SUP-RIVAL2", "C-PTGX-6"]}, "licensing_and_territory": {"en": "J&J holds worldwide commercialization rights; PTGX earns tiered 6–10% royalties (7.25% weighted on first USD 4bn annually) plus milestones, not J&J product sales.", "es": "J&J posee los derechos mundiales de comercialización; PTGX percibe regalías escalonadas del 6–10% (7,25% ponderado sobre los primeros 4.000 M USD anuales) más hitos, no las ventas de J&J.", "source_ids": ["ID-PTGX-02", "REG-PTGX-02", "PTGX-SUP-02"]}, "enforceability_and_FTO": {"en": "Unknown: patent listings and granted patents do not establish enforceability, claim scope, validity or freedom-to-operate; no legal opinion or adjudication was retrieved.", "es": "Desconocido: los listados y patentes concedidas no establecen exigibilidad, alcance de reivindicaciones, validez ni libertad de operación; no se recuperó opinión legal ni resolución judicial.", "source_ids": ["PTGX-SUP-OB-ICOTYDE", "PTGX-SUP-USPTO-11845808"]}}, {"drug": "rusfertide (MIMRYLO)", "molecule": {"en": "Injectable synthetic mimetic of naturally occurring hepcidin, first-of-its-kind approved for polycythemia vera; molecule origin documented in the FDA approval record.", "es": "Mimético sintético inyectable de la hepcidina natural, primero de su tipo aprobado para policitemia vera; el origen de la molécula está documentado en el registro de aprobación de la FDA.", "source_ids": ["REG-PTGX-03"]}, "composition_of_matter": {"en": "Hepcidin-analogue patent family lead: US10030061B2 (Protagonist assignee, granted 2018-07-24, priority 2013-03-15, terminal disclaimer on front page); WO2025207760A1 names rusfertide/PTG-300 and its sequence for formulation embodiments. Issuer asserted a US rusfertide patent expiring 2034 (2023 statement); the ~2034 expiry and current status are not independently verified.", "es": "Familia de patentes de análogos de hepcidina: US10030061B2 (titular Protagonist, concedida 24-jul-2018, prioridad 15-mar-2013, aviso de terminación en portada); WO2025207760A1 nombra rusfertide/PTG-300 y su secuencia para formulaciones. El emisor afirmó en 2023 una patente estadounidense de rusfertide que vence en 2034; esa caducidad y el estado actual no están verificados de forma independiente.", "source_ids": ["PTGX-SUP-IP1", "PTGX-SUP-IP2", "PTGX-SUP-USPTO-10030061", "REG-PTGX-06", "REG-PTGX-01"]}, "additional_protection": {"en": "FDA orphan designation is recorded, but the exact awarded orphan-exclusivity end date was not independently established; retrieved official Orange Book data show no patent or exclusivity rows for NDA220605, though absence there is not proof of no rights.", "es": "Consta la designación de huérfana de la FDA, pero la fecha exacta de exclusividad otorgada no está establecida; los datos oficiales del Orange Book consultados no muestran patentes ni exclusividad para la NDA220605, aunque esa ausencia no prueba que no existan derechos.", "source_ids": ["REG-PTGX-05", "PTGX-SUP-OB-MIMRYLO", "PTGX-SUP-FDA-ZIP"]}, "regulatory_exclusivity": {"en": "FDA orphan record confirms the August 28, 2026 US approval for erythrocytosis in adult polycythemia vera and lists the exclusivity end date as TBD. Takeda reports work with regulators outside the US; no EU authorization or decision date was established.", "es": "El registro de huérfanos de la FDA confirma la aprobación estadounidense del 28 de agosto de 2026 para eritrocitosis en adultos con policitemia vera y muestra el fin de exclusividad como pendiente. Takeda informa de trabajo con reguladores fuera de EE. UU.; no se estableció autorización ni fecha de decisión de la UE.", "source_ids": ["PTGX-QA-OOPD", "PTGX-QA-TAKEDA"]}, "competitive_workarounds": {"en": "PV competition includes phlebotomy/cytoreduction and Incyte's Jakafi (hematocrit control plus spleen reduction 23% vs <1% in a different endpoint/population; no cross-trial superiority inference); a lawful competing hepcidin-pathway molecule would erode the franchise if protection is weak.", "es": "La competencia en PV incluye flebotomía/citorreducción y Jakafi de Incyte (control de hematocrito más reducción esplénica 23% vs <1%, con criterio y población distintos; sin inferencia de superioridad entre estudios); una molécula competidora lawful de la vía de la hepcidina erosionaría la franquicia si la protección es débil.", "source_ids": ["PTGX-SUP-RIVAL1", "PTGX-SUP-EPI"]}, "licensing_and_territory": {"en": "After Takeda's April 2026 opt-out (USD 200m received Q2), Takeda holds exclusive worldwide development and commercialization rights; PTGX earns tiered 14–29% worldwide royalties plus up to USD 775m sales milestones; no remaining assumed US 50/50 profit share.", "es": "Tras el opt-out de Takeda de abril de 2026 (200 M USD recibidos en el 2T), Takeda posee derechos exclusivos mundiales de desarrollo y comercialización; PTGX percibe regalías mundiales escalonadas del 14–29% más hasta 775 M USD en hitos; sin reparto 50/50 de beneficios en EE. UU. restante.", "source_ids": ["ID-PTGX-03", "REG-PTGX-02", "PTGX-F1", "PTGX-SUP-02"]}, "enforceability_and_FTO": {"en": "Unknown: exact granted claim-to-rusfertide sequence mapping, current national status, enforceability and FTO were not established; issuer patent counts and a 2023 expiry statement are management assertions, not verified legal rights.", "es": "Desconocido: no se estableció la correspondencia exacta entre reivindicaciones concedidas y la secuencia de rusfertide, el estado nacional actual, la exigibilidad ni la FTO; los recuentos de patentes del emisor y la caducidad de 2023 son afirmaciones de la dirección, no derechos legales verificados.", "source_ids": ["REG-PTGX-01", "REG-PTGX-06", "PTGX-SUP-IP1", "PTGX-SUP-IP2", "PTGX-SUP-FDA-ZIP"]}}], "institutional_risk": [{"category": "OFFICIAL FINDING", "agency": "US GAO / FDA", "jurisdiction": "US", "finding": {"en": "GAO found the FDA drug-inspector vacancy rate rose from 9% to 16% (Nov 2021–Jun 2024), reducing inspections; FDA described hiring steps in March 2026.", "es": "El GAO halló que la tasa de vacantes de inspectores de medicamentos de la FDA subió del 9% al 16% (nov 2021–jun 2024), reduciendo inspecciones; la FDA describió contrataciones en marzo de 2026.", "source_ids": ["REG-COMMON-03"]}, "company_pathway": {"en": "If a facility supplying ICOTYDE or MIMRYLO awaited inspection, staffing limits could delay clearance or enforcement.", "es": "Si una instalación que suministra ICOTYDE o MIMRYLO esperara inspección, las limitaciones de personal podrían retrasar autorizaciones o medidas.", "source_ids": ["REG-COMMON-03"]}, "limitations": {"en": "No company-specific finding, facility exposure or delay is established; shared institutional background only.", "es": "No se establece hallazgo específico de la compañía, exposición de instalaciones ni retraso; solo contexto institucional compartido.", "source_ids": ["REG-COMMON-03"]}}, {"category": "DOCUMENTED FACT", "agency": "FDA", "jurisdiction": "US", "finding": {"en": "PDUFA VII authorizes sponsor fees through FY2027; the FY2026 application fee with clinical data is USD 4,682,003.", "es": "PDUFA VII autoriza tasas de patrocinadores hasta el ejercicio 2027; la tasa de solicitud FY2026 con datos clínicos es de 4.682.003 USD.", "source_ids": ["REG-COMMON-04"]}, "company_pathway": {"en": "Application costs and review capacity depend partly on statutory fees for PTGX or its partners' US filings.", "es": "Los costes de solicitud y la capacidad de revisión dependen en parte de las tasas legales para las presentaciones en EE. UU. de PTGX o sus socios.", "source_ids": ["REG-COMMON-04"]}, "limitations": {"en": "Funding alone is no evidence of biased decisions; no company-specific effect established.", "es": "La financiación por sí sola no prueba decisiones sesgadas; sin efecto específico establecido.", "source_ids": ["REG-COMMON-04"]}}, {"category": "DOCUMENTED FACT", "agency": "EMA", "jurisdiction": "EU", "finding": {"en": "EMA's revised independence policy (effective 2025-05-01) excluded experts with current product interests and set a three-year cooling-off period, following CJEU impartiality rulings.", "es": "La política revisada de independencia de la EMA (vigente desde el 1-may-2025) excluyó a expertos con intereses actuales en productos y fijó tres años de espera, tras sentencias del TJUE sobre imparcialidad.", "source_ids": ["REG-COMMON-07"]}, "company_pathway": {"en": "Expert eligibility can affect the composition and timing of a specific CHMP assessment, relevant to any future EU MIMRYLO filing or ICOTYDE lifecycle reviews.", "es": "La elegibilidad de expertos puede afectar la composición y el calendario de una evaluación del CHMP, relevante para una futura solicitud de MIMRYLO en la UE o revisiones de ICOTYDE.", "source_ids": ["REG-COMMON-07"]}, "limitations": {"en": "Procedural response to unrelated court cases; no finding of corruption and no covered-product conflict established.", "es": "Respuesta procesal a casos judiciales ajenos; sin hallazgo de corrupción ni conflicto en productos cubiertos.", "source_ids": ["REG-COMMON-07"]}}], "scenarios": [{"type": "bear", "assumption": {"en": "If MIMRYLO has no effective patent/exclusivity barrier and both launches underperform (Jakafi in PV, Sotyktu and injectables in psoriasis), royalty capture stays small.", "es": "Si MIMRYLO carece de barrera efectiva de patente/exclusividad y ambos lanzamientos decepcionan (Jakafi en PV, Sotyktu e inyectables en psoriasis), la captura de regalías sería reducida.", "source_ids": ["PTGX-SUP-OB-MIMRYLO", "PTGX-SUP-FDA-ZIP", "PTGX-SUP-RIVAL1", "PTGX-SUP-RIVAL2"]}, "trigger": {"en": "Patent invalidation or lawful competing authorization, weak launch adoption, or adverse postmarketing safety findings.", "es": "Invalidación de patente o autorización lawful de un competidor, adopción débil del lanzamiento o hallazgos adversos de seguridad postcomercialización.", "source_ids": ["REG-PTGX-02", "C-PTGX-7"]}, "affected_drug_territory": {"en": "MIMRYLO worldwide (Takeda economics); ICOTYDE US/EU (J&J economics).", "es": "MIMRYLO mundial (economía Takeda); ICOTYDE EE. UU./UE (economía J&J).", "source_ids": ["REG-PTGX-02", "C-PTGX-4"]}, "economic_consequence": {"en": "Royalty and milestone streams (14–29% and 6–10% tiers) would fall far short of what the ~USD 9.3bn market cap appears to price; no numerical haircut is assigned.", "es": "Las corrientes de regalías e hitos (escalones del 14–29% y 6–10%) quedarían muy por debajo de lo que parece descontar la capitalización de ~9.300 M USD; no se asigna recorte numérico.", "source_ids": ["PTGX-SUP-02", "PTGX-SUP-01", "PTGX-SUP-02"]}, "timing_and_indicators": {"en": "Late 2026–2027 launch adoption reports, patent-office and court records, and FDA/EMA competitor approvals are the leading indicators.", "es": "Los indicadores adelantados son informes de adopción de lanzamientos de finales de 2026–2027, registros de oficinas de patentes y tribunales, y aprobaciones de competidores por FDA/EMA.", "source_ids": ["REG-PTGX-01", "REG-PTGX-02"]}}, {"type": "base", "assumption": {"en": "Both drugs launch with partner execution consistent with approvals to date: ICOTYDE oral differentiation in psoriasis and MIMRYLO first-in-class PV adoption, with royalties beginning to accrue.", "es": "Ambos fármacos se lanzan con ejecución de socios coherente con las aprobaciones hasta la fecha: diferenciación oral de ICOTYDE en psoriasis y adopción pionera de MIMRYLO en PV, con regalías comenzando a acumularse.", "source_ids": ["C-PTGX-1", "C-PTGX-3", "PTGX-SUP-02"]}, "trigger": {"en": "Ordinary launch ramp: Takeda/J&J commercial reports, first royalty-bearing sales, and completion of the required rusfertide long-term safety study without label restrictions.", "es": "Curva de lanzamiento ordinaria: informes comerciales de Takeda/J&J, primeras ventas con regalías y finalización del estudio de seguridad a largo plazo de rusfertide sin restricciones de etiqueta.", "source_ids": ["C-PTGX-7", "PTGX-SUP-02"]}, "affected_drug_territory": {"en": "ICOTYDE US/EU; MIMRYLO US (EU unestablished).", "es": "ICOTYDE EE. UU./UE; MIMRYLO EE. UU. (UE sin establecer).", "source_ids": ["C-PTGX-4", "C-PTGX-1"]}, "economic_consequence": {"en": "Royalty economics per contract (7.25% weighted first USD 4bn ICOTYDE; 14–29% MIMRYLO plus up to USD 775m milestones) become the earnings base; size depends on partner sales, which are not forecast here.", "es": "La economía por contrato (7,25% ponderado sobre los primeros 4.000 M USD de ICOTYDE; 14–29% de MIMRYLO más hasta 775 M USD en hitos) se convierte en la base de ganancias; el tamaño depende de ventas de socios, que no se pronostican aquí.", "source_ids": ["PTGX-SUP-02", "PTGX-F1"]}, "timing_and_indicators": {"en": "Quarterly partner sales disclosures and PTGX royalty line items from late 2026 onward.", "es": "Divulgaciones trimestrales de ventas de socios y partidas de regalías de PTGX desde finales de 2026.", "source_ids": ["PTGX-F1", "PTGX-SUP-02"]}}, {"type": "bull", "assumption": {"en": "If ICOTYDE takes meaningful share of the oral systemic psoriasis market against Sotyktu, MIMRYLO becomes standard of care in phlebotomy-dependent PV, and label expansion (PsA/UC/Crohn) succeeds, royalty tiers reach their upper ranges.", "es": "Si ICOTYDE gana cuota significativa del mercado oral sistémico de psoriasis frente a Sotyktu, MIMRYLO se convierte en estándar en PV dependiente de flebotomías y la expansión de etiqueta (AP/UC/Crohn) tiene éxito, los escalones de regalías alcanzarían sus rangos superiores.", "source_ids": ["PTGX-SUP-RIVAL2", "C-PTGX-1", "C-PTGX-2"]}, "trigger": {"en": "Strong launch uptake, successful Phase 3 readouts in new indications, and verification of durable rusfertide patent protection.", "es": "Fuerte adopción, lecturas exitosas de fase 3 en nuevas indicaciones y verificación de protección duradera por patente de rusfertide.", "source_ids": ["REG-PTGX-01", "PTGX-SUP-IP2"]}, "affected_drug_territory": {"en": "ICOTYDE US/EU plus new indications; MIMRYLO US first, EU if authorized.", "es": "ICOTYDE EE. UU./UE más nuevas indicaciones; MIMRYLO primero EE. UU., UE si se autoriza.", "source_ids": ["C-PTGX-4", "C-PTGX-1"]}, "economic_consequence": {"en": "Higher royalty tiers (up to 10% ICOTYDE; 29% MIMRYLO) plus milestone payments would compound; no revenue or price forecast is assigned.", "es": "Los escalones superiores de regalías (hasta 10% ICOTYDE; 29% MIMRYLO) más hitos se acumularían; no se asigna previsión de ingresos ni de precio.", "source_ids": ["PTGX-SUP-02"]}, "timing_and_indicators": {"en": "2027+ partner sales reports, trial readout announcements, and any EU MIMRYLO filing.", "es": "Informes de ventas de socios desde 2027, anuncios de resultados de ensayos y cualquier solicitud de MIMRYLO en la UE.", "source_ids": ["C-PTGX-1", "PTGX-SUP-02"]}}], "risk_scenarios": [{"kind": "regulatory_downside", "trigger": {"en": "FDA/EMA requests additional efficacy, safety or CMC evidence, restricts a label, or a manufacturing inspection finds deficiencies; the Mimrylo approval letter already requires a pooled long-term safety analysis.", "es": "FDA/EMA solicita evidencia adicional de eficacia, seguridad o CMC, restringe la etiqueta, o una inspección de fabricación halla deficiencias; la carta de aprobación de Mimrylo ya exige un análisis agrupado de seguridad a largo plazo.", "source_ids": ["C-PTGX-7", "REG-COMMON-03"]}, "affected_drug_territory": {"en": "Icotrokinra and rusfertide, US/EU where filed or marketed.", "es": "Icotrokinra y rusfertide, EE. UU./UE donde estén presentados o comercializados.", "source_ids": ["C-PTGX-1", "C-PTGX-3"]}, "economic_consequence": {"en": "Review delay or label limits could postpone launch, constrain eligible patients or raise spending; for partnered assets, PTGX royalties and milestones would shift rather than direct product sales.", "es": "Un retraso regulatorio o límites de etiqueta podrían posponer lanzamientos, restringir pacientes elegibles o aumentar gastos; en activos asociados, las regalías e hitos de PTGX se verían afectados en lugar de ventas directas.", "source_ids": ["REG-PTGX-02"]}, "timing_and_indicators": {"en": "Next filing, inspection or postmarketing review; drug-specific schedule unknown. Indicators: FDA/EMA decision letters, inspection findings, company/partner updates.", "es": "Próxima presentación, inspección o revisión postcomercialización; calendario específico desconocido. Indicadores: cartas de decisión FDA/EMA, hallazgos de inspección, actualizaciones de compañía/socios.", "source_ids": ["REG-COMMON-03"]}, "mitigation_or_counterevidence": {"en": "Both drugs are currently approved; partner resources, additional data and CMC remediation can address findings; the GAO staffing issue is background only, with no company-specific delay established.", "es": "Ambos fármacos están aprobados actualmente; los recursos de los socios, datos adicionales y remediación de CMC pueden atender hallazgos; el problema de personal del GAO es solo contexto, sin retraso específico establecido.", "source_ids": ["C-PTGX-1", "C-PTGX-3", "REG-COMMON-03"]}}, {"kind": "ip_loss", "trigger": {"en": "A relevant patent expires, is narrowed or invalidated, or a lawful competing molecule/formulation gains authorization; for MIMRYLO, retrieved official FDA data show no Orange Book patent/exclusivity rows, and the family lead (US10030061B2, 2013 priority, terminal disclaimer, unverified ~2034 expiry) is not a confirmed barrier.", "es": "Una patente relevante expira, se reduce o se invalida, o una molécula/formulación competidora lawful obtiene autorización; para MIMRYLO, los datos oficiales de la FDA consultados no muestran patentes/exclusividad en el Orange Book, y la familia de referencia (US10030061B2, prioridad 2013, aviso de terminación, caducidad ~2034 sin verificar) no es una barrera confirmada.", "source_ids": ["PTGX-SUP-OB-MIMRYLO", "PTGX-SUP-FDA-ZIP", "PTGX-SUP-IP1", "PTGX-SUP-IP2", "PTGX-SUP-USPTO-10030061", "REG-PTGX-06"]}, "affected_drug_territory": {"en": "Icotrokinra and rusfertide, in territories where royalties accrue (US/EU for ICOTYDE; US established for MIMRYLO).", "es": "Icotrokinra y rusfertide, en territorios donde se devengan regalías (EE. UU./UE para ICOTYDE; EE. UU. establecido para MIMRYLO).", "source_ids": ["C-PTGX-4", "C-PTGX-1", "PTGX-SUP-02"]}, "economic_consequence": {"en": "Loss or bypass of a legal barrier could increase price and volume competition and compress the 14–29% and 6–10% royalty streams; no numerical sensitivity is assigned.", "es": "La pérdida o eludición de una barrera legal podría intensificar la competencia en precio y volumen y comprimir las corrientes de regalías del 14–29% y 6–10%; no se asigna sensibilidad numérica.", "source_ids": ["PTGX-SUP-02", "REG-PTGX-02"]}, "timing_and_indicators": {"en": "Only datable where dated rights exist (ICOTYDE NCE to 2031, listed patents to 2039–2041); MIMRYLO timing unknown. Indicators: patent-office/court records, FDA/EMA generic or alternative approvals.", "es": "Solo fechable donde existen derechos con fecha (NCE de ICOTYDE hasta 2031, patentes listadas 2039–2041); calendario de MIMRYLO desconocido. Indicadores: registros de patentes/tribunales, aprobaciones de genéricos o alternativas por FDA/EMA.", "source_ids": ["PTGX-SUP-OB-ICOTYDE", "PTGX-SUP-OB-MIMRYLO"]}, "mitigation_or_counterevidence": {"en": "For ICOTYDE, three listed patents plus NCE exclusivity to 2031 provide layered protection; for MIMRYLO, orphan designation, first-in-class status, formulation filings and partner manufacturing/distribution may partly offset; none is presumed decisive and enforceability remains unverified.", "es": "Para ICOTYDE, tres patentes listadas más exclusividad NCE hasta 2031 dan protección por capas; para MIMRYLO, la designación de huérfana, condición pionera, solicitudes de formulación y fabricación/distribución del socio pueden compensar en parte; nada se presume decisivo y la exigibilidad sigue sin verificar.", "source_ids": ["PTGX-SUP-OB-ICOTYDE", "REG-PTGX-05", "PTGX-SUP-IP2"]}}], "ratings": [{"dimension": "clinical_evidence", "rating": "GOOD", "reason": {"en": "Two FDA approvals and one EU authorization rest on randomized Phase 3 evidence (VERIFY 76.9% vs 32.9% phlebotomy-free; ICONIC program including an active oral comparator), with honest limits: crossover limits long-term comparative certainty and a long-term rusfertide safety study is required.", "es": "Dos aprobaciones de la FDA y una de la EMA se apoyan en evidencia aleatorizada de fase 3 (VERIFY 76,9% vs 32,9% sin flebotomía; programa ICONIC con comparador oral activo), con límites honestos: el crossover limita la certeza comparativa a largo plazo y se exige un estudio de seguridad a largo plazo de rusfertide.", "source_ids": ["C-PTGX-1", "C-PTGX-2", "C-PTGX-3", "C-PTGX-4", "C-PTGX-6", "C-PTGX-7"]}}, {"dimension": "ip_economic_defensibility", "rating": "FAIR", "reason": {"en": "ICOTYDE carries layered protection (three Orange Book patents to 2039–2041 plus NCE exclusivity to 2031), but MIMRYLO's patent barrier is a family lead with unverified term, no retrieved Orange Book rows and unestablished enforceability, so defensibility is asymmetric between the two assets.", "es": "ICOTYDE tiene protección por capas (tres patentes en el Orange Book hasta 2039–2041 más exclusividad NCE hasta 2031), pero la barrera de patente de MIMRYLO es una referencia familiar con plazo sin verificar, sin filas en el Orange Book consultado y exigibilidad sin establecer, por lo que la defensibilidad es asimétrica entre ambos activos.", "source_ids": ["PTGX-SUP-OB-ICOTYDE", "PTGX-SUP-OB-MIMRYLO", "PTGX-SUP-FDA-ZIP", "PTGX-SUP-IP1", "PTGX-SUP-USPTO-10030061"]}}, {"dimension": "financial_strength", "rating": "GOOD", "reason": {"en": "USD 849.5m cash (June 30), H1 operating cash inflow of USD 170.1m driven by partner payments, USD 275m earned and expected in Q4 2026, and a USD 300m buyback authorization indicate no evidenced funding need, though these are dated or forecast figures and a stale-cash caveat applies.", "es": "849,5 M USD en efectivo (30-jun), entrada operativa de 170,1 M USD en el 1S impulsada por pagos de socios, 275 M USD devengados y esperados en el 4T 2026, y una autorización de recompra de 300 M USD indican que no hay necesidad de financiación evidenciada, aunque son cifras fechadas o previstas y aplica la salvedad de caja desfasada.", "source_ids": ["PTGX-F1", "PTGX-SUP-04"]}}, {"dimension": "regulatory_exposure", "rating": "FAIR", "reason": {"en": "Approvals are recent and favorable in the US and EU for icotrokinra and the US for rusfertide, but the mandated long-term safety study, absent established MIMRYLO EU status, and shared institutional background (GAO inspector shortfalls, PDUFA fees, EMA conflict policy) keep residual regulatory uncertainty real without any company-specific finding.", "es": "Las aprobaciones son recientes y favorables en EE. UU. y la UE para icotrokinra y en EE. UU. para rusfertide, pero el estudio de seguridad a largo plazo exigido, la ausencia de estatus europeo establecido para MIMRYLO y el contexto institucional compartido (déficit de inspectores del GAO, tasas PDUFA, política de conflictos de la EMA) mantienen una incertidumbre regulatoria residual real sin ningún hallazgo específico contra la compañía.", "source_ids": ["C-PTGX-1", "C-PTGX-3", "C-PTGX-4", "C-PTGX-7", "REG-COMMON-03", "REG-COMMON-04", "REG-COMMON-07"]}}, {"dimension": "competitive_position", "rating": "MIDDLING", "reason": {"en": "Differentiation is genuine (only approved oral IL-23 receptor antagonist route; first-in-class hepcidin mimetic), but established rivals exist on both fronts — Jakafi in PV and Sotyktu plus injectable IL-23 biologics in psoriasis — and superiority versus injectables is not established.", "es": "La diferenciación es real (única vía oral aprobada contra el receptor IL-23; primer mimético de hepcidina de su clase), pero existen rivales consolidados en ambos frentes — Jakafi en PV y Sotyktu más biológicos inyectables anti-IL-23 en psoriasis — y no está establecida superioridad frente a los inyectables.", "source_ids": ["PTGX-SUP-RIVAL1", "PTGX-SUP-RIVAL2", "C-PTGX-6", "REG-PTGX-03"]}}, {"dimension": "valuation_attractiveness", "rating": "UNKNOWN", "reason": {"en": "A dated basis exists (USD 143.73 close on 2026-10-09; ~USD 9.30bn market cap; ~USD 8.67bn warrant-adjusted EV on stale June cash), but with no sourced sales, adoption or royalty forecasts, whether that price over- or under-states the contracted economics cannot be judged.", "es": "Existe una base fechada (cierre de 143,73 USD el 9-oct-2026; capitalización de ~9.300 M USD; EV ajustado por warrants de ~8.670 M USD con caja de junio), pero sin previsiones respaldadas de ventas, adopción o regalías, no puede juzgarse si ese precio sobre o infravaloriza la economía contratada.", "source_ids": ["PTGX-SUP-01", "PTGX-SUP-02", "PTGX-SUP-04"]}}, {"dimension": "catalyst_quality", "rating": "FAIR", "reason": {"en": "Near-term catalysts are real but partner-dependent: first launch-adoption and royalty disclosures, the expected Q4 2026 USD 275m receipt, and required safety data; longer-dated PsA/UC/Crohn readouts carry binary trial risk.", "es": "Los catalizadores cercanos son reales pero dependen de los socios: primeras divulgaciones de adopción y regalías, el cobro esperado de 275 M USD en el 4T 2026 y datos de seguridad exigidos; las lecturas futuras en AP/UC/Crohn conllevan riesgo binario de ensayo.", "source_ids": ["PTGX-SUP-04", "C-PTGX-7", "PTGX-SUP-02"]}}], "unknowns": [{"en": "The exact rusfertide granted claim-to-sequence mapping and current patent term remain unverified. FDA explicitly lists the orphan exclusivity end date as TBD; an EU authorization or decision date was not established. No Orange Book patent/exclusivity rows were retrieved for MIMRYLO, which does not establish absence of rights.", "es": "Siguen sin verificarse la correspondencia exacta entre las reivindicaciones concedidas y la secuencia de rusfertida y su plazo vigente. La FDA muestra el fin de exclusividad huérfana como pendiente; no se estableció autorización ni fecha de decisión de la UE. No se obtuvieron filas de patentes/exclusividad de MIMRYLO en el Orange Book, lo que no demuestra ausencia de derechos.", "source_ids": ["PTGX-SUP-OB-MIMRYLO", "PTGX-SUP-FDA-ZIP", "PTGX-SUP-IP1", "PTGX-SUP-IP2", "REG-PTGX-05", "PTGX-QA-OOPD", "PTGX-QA-TAKEDA"]}, {"en": "Same-day October 2026 cash, share count and fully diluted ownership are not publicly reconstructible; the June 30 balance and July 31 share count are dated, and the USD 275m earned payment is expected, not confirmed received.", "es": "La caja, el número de acciones y la titularidad totalmente diluida de octubre de 2026 no son reconstruibles públicamente; el balance del 30-jun y las acciones del 31-jul están fechadas, y el pago devengado de 275 M USD es esperado, no confirmado como recibido.", "source_ids": ["PTGX-F1", "PTGX-SUP-02", "PTGX-SUP-04"]}, {"en": "Icotrokinra's long-term relative efficacy versus injectable IL-23 biologics is not established, since trials used placebo crossover and an oral, not injectable, active comparator.", "es": "La eficacia relativa a largo plazo de icotrokinra frente a biológicos inyectables anti-IL-23 no está establecida, pues los ensayos usaron crossover con placebo y un comparador activo oral, no inyectable.", "source_ids": ["C-PTGX-5", "C-PTGX-6", "PTGX-SUP-RIVAL2"]}, {"en": "Individual broker accessibility beyond IB's public Costa Rica country listing (and personal orderability of this exact contract) is unverified.", "es": "La accesibilidad individual vía bróker más allá de la lista pública de países de IB que incluye Costa Rica (y la ordenabilidad personal de este contrato exacto) no está verificada.", "source_ids": ["PTGX-SUP-03"]}], "coverage_boundary": {"en": "Bounded primary-source pass as of 2026-10-11 covering partnered icotrokinra and rusfertide only: identity, clinical, financial, valuation inputs, defensibility and institutional records; PN-881 and earlier-stage peptide programs were not drug-specifically mapped, no company-specific regulatory misconduct was found (absence of evidence is not evidence of absence), and no revenue, price or probability forecasts were invented.", "es": "Revisión acotada de fuentes primarias al 11-oct-2026 que cubre solo icotrokinra y rusfertide asociados: identidad, clínico, financiero, insumos de valoración, defensibilidad y registros institucionales; PN-881 y programas péptidos más tempranos no se mapearon fármaco por fármaco, no se halló inconducta regulatoria específica de la compañía (la ausencia de evidencia no es evidencia de ausencia) y no se inventaron previsiones de ingresos, precios ni probabilidades.", "source_ids": ["ID-PTGX-01", "C-PTGX-1", "PTGX-F1", "PTGX-SUP-01", "PTGX-SUP-02"]}}, {"ticker": "LLY", "company": "Eli Lilly and Company", "class": "established_commercial_pharma", "cutoff": "2026-10-11", "regulatory_chips": [], "card": {"what_you_buy": {"en": "An approved medicine: Zepbound (tirzepatide) is FDA-approved for chronic weight management and, since December 2024, moderate-to-severe obstructive sleep apnea in adults with obesity; its pivotal 72-week trial randomized 2,539 adults without diabetes. A boxed thyroid C-cell tumor warning applies.", "es": "Un medicamento aprobado: Zepbound (tirzepatida) está aprobado por la FDA para el manejo crónico del peso y, desde diciembre de 2024, para la apnea obstructiva del sueño moderada a grave en adultos con obesidad; su estudio pivotal de 72 semanas aleatorizó a 2.539 adultos sin diabetes. Aplica una advertencia de recuadro sobre tumores de células C tiroideas.", "source_ids": ["C-LLY-1", "C-LLY-2"]}, "why_it_could_work": {"en": "Lilly could capture durable value because Mounjaro and Zepbound generated 56% of 2025 revenue, with Q2 2026 Mounjaro sales around USD 9.9bn and U.S. Zepbound around USD 4.9bn, and SURMOUNT-5 showed 20.2% versus 13.7% weight loss against semaglutide at the doses tested; this depends on patents and exclusivity holding.", "es": "Lilly podría capturar valor duradero porque Mounjaro y Zepbound generaron el 56% de los ingresos de 2025, con ventas de Mounjaro de ~9,9 mm USD en el Q2 2026 y Zepbound en EE. UU. de ~4,9 mm USD, y SURMOUNT-5 mostró una pérdida de peso del 20,2% frente al 13,7% contra semaglutida en las dosis probadas; esto depende de que patentes y exclusividades se mantengan.", "source_ids": ["ID-LLY-01", "LLY-F2", "LLY-SUP-007", "LLY-SUP-003"]}, "what_can_kill_it": {"en": "Established exposure: one franchise dominates revenue. Conditional scenarios: a patent is narrowed or invalidated, FDA's draft generic-peptide guidances ease copy pathways, lawful compounded supply expands if shortage status changes, or a rival such as Roche's enicepatide or a restricted label erodes share.", "es": "Exposición comprobada: una sola franquicia domina los ingresos. Escenarios condicionales: una patente se limita o invalida, las guías borrador de la FDA sobre genéricos peptídicos facilitan copias, la suministración compuesta legal se expande si cambia el estado de escasez, o un rival como enicepatide de Roche o una etiqueta restringida erosiona la cuota.", "source_ids": ["ID-LLY-01", "REG-COMMON-05", "REG-LLY-03", "LLY-SUP-010"]}, "financial_strength": {"en": "Strong: Q2 2026 revenue USD 22,974m with net income USD 7,095m and H1 operating cash flow USD 16,023m against USD 54,908m debt, though cash moved materially after June due to acquisitions and USD 4bn of H1 buybacks.", "es": "Fuerte: ingresos del Q2 2026 de 22.974 mm USD con utilidad neta de 7.095 mm USD y flujo operativo del S1 de 16.023 mm USD frente a una deuda de 54.908 mm USD, aunque el efectivo cambió materialmente después de junio por adquisiciones y 4.000 mm USD en recompras del S1.", "source_ids": ["LLY-F1", "LLY-SUP-001"]}, "valuation": {"en": "Only illustrative mixed-date figures exist (about USD 1,110bn basic market cap and USD 1,156bn EV combining the October 9 close, August 3 shares and June balances), so current valuation attractiveness is unknown, not judged cheap or expensive.", "es": "Solo existen cifras ilustrativas de fechas mixtas (~1.110 mm USD de capitalización básica y ~1.156 mm USD de EV, combinando el cierre del 9 de octubre, acciones del 3 de agosto y saldos de junio), por lo que el atractivo valuation actual es desconocido; no se califica de barato ni caro.", "source_ids": ["LLY-SUP-001", "LLY-SUP-002"]}, "next_catalyst": {"en": "Management plans a retatrutide BLA submission in Q1 2027, subject to CMC work; it remains investigational and TRIUMPH-5 head-to-head versus tirzepatide has no posted results, so both timing and outcome are uncertain.", "es": "La dirección planea presentar el BLA de retatrutida en el Q1 2027, sujeto al trabajo de CMC; sigue siendo investigacional y TRIUMPH-5 cara a cara contra tirzepatida no tiene resultados publicados, por lo que el plazo y el resultado son inciertos.", "source_ids": ["LLY-SUP-005", "C-LLY-5", "C-LLY-4"]}}, "valuation_inputs": [{"label": {"en": "Closing price, NYSE common share, regular session", "es": "Precio de cierre, acción común NYSE, sesión regular"}, "value": 1179.27, "unit": "USD", "as_of": "2026-10-09 16:00 EDT; after-hours 1,177.05 excluded; issuer table did not expose this row", "source_ids": ["LLY-SUP-002"], "unknown_reason": null}, {"label": {"en": "Common shares outstanding (cover page; not the diluted EPS denominator)", "es": "Acciones comunes en circulación (portada; no el denominador diluido del BPA)"}, "value": 941357065, "unit": "common shares", "as_of": "2026-08-03; October outstanding count not established", "source_ids": ["LLY-F1"], "unknown_reason": null}, {"label": {"en": "Cash and cash equivalents", "es": "Efectivo y equivalentes de efectivo"}, "value": 8950, "unit": "USD million", "as_of": "2026-06-30; July ~USD 2bn acquisition payment and pending ~USD 2.8bn AtaiBeckley deal changed cash after this date", "source_ids": ["LLY-F1"], "unknown_reason": null}, {"label": {"en": "Short-term investments (separate from cash; broader noncurrent investments not counted)", "es": "Inversiones a corto plazo (separadas del efectivo; inversiones no corrientes más amplias no contadas)"}, "value": 60, "unit": "USD million", "as_of": "2026-06-30", "source_ids": ["LLY-F1"], "unknown_reason": null}, {"label": {"en": "Cash plus short-term investments (packet-prepared sum)", "es": "Efectivo más inversiones a corto plazo (suma preparada en el paquete)"}, "value": 9010, "unit": "USD million", "as_of": "2026-06-30 basis supplied by supplement; not a current balance", "source_ids": ["LLY-SUP-001"], "unknown_reason": null}, {"label": {"en": "Total carrying debt (current 7,050 + long-term 47,858)", "es": "Deuda total en libros (corriente 7.050 + largo plazo 47.858)"}, "value": 54908, "unit": "USD million", "as_of": "2026-06-30", "source_ids": ["LLY-F1"], "unknown_reason": null}, {"label": {"en": "Net cash provided by operating activities", "es": "Efectivo neto generado por actividades de operación"}, "value": 16023, "unit": "USD million", "as_of": "H1 2026 (six months); historical flow, not a runway forecast", "source_ids": ["LLY-F1"], "unknown_reason": null}, {"label": {"en": "Capital expenditure (purchases of property and equipment)", "es": "Inversión de capital (compras de propiedad y equipo)"}, "value": 5259, "unit": "USD million", "as_of": "H1 2026", "source_ids": ["LLY-F1"], "unknown_reason": null}, {"label": {"en": "Operating cash flow less capital spending (historical flow, not a cash runway estimate)", "es": "Flujo operativo menos inversión de capital (flujo histórico, no una estimación de runway)"}, "value": 10764, "unit": "USD million", "as_of": "H1 2026; formula 16023 - 5259 as supplied", "source_ids": ["LLY-SUP-001"], "unknown_reason": null}, {"label": {"en": "Illustrative whole-company basic market capitalization (mixed dates; no debt added)", "es": "Capitalización básica ilustrativa de toda la compañía (fechas mixtas; sin deuda añadida)"}, "value": 1110114146042.55, "unit": "USD", "as_of": "October 9 price x August 3 shares per supplied formula; not a current exact figure", "source_ids": ["LLY-SUP-001", "LLY-SUP-002"], "unknown_reason": null}, {"label": {"en": "Illustrative enterprise value (mixed dates: cap + June debt - June cash and short-term investments)", "es": "Valor de empresa ilustrativo (fechas mixtas: capitalización + deuda de junio - efectivo e inversiones a corto plazo de junio)"}, "value": 1156012146042.55, "unit": "USD", "as_of": "Supplied mixed-date calculation; excludes post-June acquisitions, buybacks and noncurrent investments; not current EV", "source_ids": ["LLY-SUP-001", "LLY-SUP-002"], "unknown_reason": null}, {"label": {"en": "Mounjaro worldwide revenue, Q2 2026", "es": "Ingresos mundiales de Mounjaro, Q2 2026"}, "value": 9900, "unit": "USD million", "as_of": "2026-Q2; approximately per issuer release", "source_ids": ["LLY-F2"], "unknown_reason": null}, {"label": {"en": "Zepbound U.S. revenue, Q2 2026 (rounded issuer narrative)", "es": "Ingresos de Zepbound en EE. UU., Q2 2026 (cifra redondeada del emisor)"}, "value": 4900, "unit": "USD million", "as_of": "2026-Q2; U.S. only, do not add as worldwide", "source_ids": ["LLY-F2"], "unknown_reason": null}, {"label": {"en": "Management FY2026 revenue guidance — lower bound (forecast, not actual sales)", "es": "Guía de ingresos FY2026 de la dirección — límite inferior (previsión, no ventas realizadas)"}, "value": 85000, "unit": "USD million", "as_of": "Management assertion, 2026-08-05; forecast, not reported sales", "source_ids": ["LLY-F2"], "unknown_reason": null}, {"label": {"en": "Management FY2026 revenue guidance — upper bound (forecast, not actual sales)", "es": "Guía de ingresos FY2026 de la dirección — límite superior (previsión, no ventas realizadas)"}, "value": 87000, "unit": "USD million", "as_of": "Management assertion, 2026-08-05; forecast, not reported sales", "source_ids": ["LLY-F2"], "unknown_reason": null}, {"label": {"en": "Q2 2026 Zepbound product revenue, group table (US, Canada and Japan brand footprint)", "es": "Ingresos de Zepbound del 2T de 2026, tabla del grupo (marca en EE. UU., Canadá y Japón)"}, "value": 4928, "unit": "USD million", "as_of": "2026-Q2; issuer release August 5, 2026", "source_ids": ["LLY-QA-REVENUE"], "unknown_reason": null}], "defensibility": [{"drug": "tirzepatide (Mounjaro, Zepbound)", "molecule": {"en": "Synthetic modified peptide dual GIP/GLP-1 receptor agonist; Mounjaro (type 2 diabetes) and Zepbound (obesity/OSA) are the approved brands.", "es": "Péptido modificado sintético, agonista dual de receptores GIP/GLP-1; Mounjaro (diabetes tipo 2) y Zepbound (obesidad/AOS) son las marcas aprobadas.", "source_ids": ["REG-LLY-01", "C-LLY-1", "LLY-SUP-012"]}, "composition_of_matter": {"en": "US 9,474,780 B2, granted 25 October 2016, claims a modified GIP/GLP-1 peptide genus and a specific peptide; FDA Orange Book lists expiry 13 May 2036 for Mounjaro and Zepbound. Company estimates cite 2036 US, 2037 major Europe, 2040 Japan; these are management estimates, not adjudicated validity.", "es": "US 9,474,780 B2, otorgada el 25 de octubre de 2016, reivindica un género de péptidos GIP/GLP-1 modificados y un péptido específico; el Orange Book de la FDA lista vencimiento el 13 de mayo de 2036 para Mounjaro y Zepbound. La compañía estima 2036 EE. UU., 2037 Europa principal, 2040 Japón; son estimaciones gerenciales, no validez adjudicada.", "source_ids": ["REG-LLY-06", "REG-LLY-01", "LLY-SUP-003", "LLY-SUP-004"]}, "additional_protection": {"en": "Orange Book also lists US 11,357,820 drug-product patent to 14 June 2039 and later use patents (e.g., US 12,295,987 method-use to 30 December 2041 on Mounjaro; US 11,918,623 and US 12,343,382 on Zepbound); later listings do not automatically block all generics.", "es": "El Orange Book también lista US 11,357,820 de producto hasta el 14 de junio de 2039 y patentes de uso posteriores (p. ej., US 12,295,987 uso hasta el 30 de diciembre de 2041 en Mounjaro; US 11,918,623 y US 12,343,382 en Zepbound); los registros posteriores no bloquean automáticamente todos los genéricos.", "source_ids": ["LLY-SUP-003", "LLY-SUP-004"]}, "regulatory_exclusivity": {"en": "FDA records: Mounjaro NCE to 13 May 2027 and NPP to 19 December 2028; Zepbound NP to 8 November 2026, NCE 13 May 2027, M82 to 18 October 2027 and I958 to 20 December 2027; company-reported US data protection ends 2027.", "es": "Registros de la FDA: Mounjaro NCE hasta el 13 de mayo de 2027 y NPP hasta el 19 de diciembre de 2028; Zepbound NP hasta el 8 de noviembre de 2026, NCE 13 de mayo de 2027, M82 hasta el 18 de octubre de 2027 e I958 hasta el 20 de diciembre de 2027; protección de datos en EE. UU. reportada por la compañía vence en 2027.", "source_ids": ["LLY-SUP-003", "LLY-SUP-004", "REG-LLY-01"]}, "competitive_workarounds": {"en": "Approved semaglutide competes directly (SURMOUNT-5: 20.2% vs 13.7% at the doses tested); FDA's July 2026 revised draft generic-peptide guidances may clarify eventual ANDA pathways; the tirzepatide shortage was resolved 19 December 2024 and the Fifth Circuit affirmed the delisting, while a proposed 503B bulk exclusion is not final.", "es": "La semaglutida aprobada compite directamente (SURMOUNT-5: 20,2% vs 13,7% en las dosis probadas); las guías borrador revisadas de julio de 2026 sobre genéricos peptídicos pueden aclarar futuras vías de ANDA; la escasez de tirzepatida se resolvió el 19 de diciembre de 2024 y el Quinto Circuito confirmó la deslistación, mientras la exclusión 503B propuesta no es definitiva.", "source_ids": ["LLY-SUP-007", "REG-COMMON-05", "REG-LLY-02", "REG-LLY-08", "REG-LLY-03"]}, "licensing_and_territory": {"en": "No third-party license or territorial agreement was established in this packet; protection rests on US FDA-listed patents/exclusivities and company-reported European and Japanese expiry estimates.", "es": "Ninguna licencia a terceros o acuerdo territorial quedó establecido en este paquete; la protección se apoya en patentes/exclusividades listadas por la FDA en EE. UU. y estimaciones gerenciales de vencimiento en Europa y Japón.", "source_ids": ["REG-LLY-01", "LLY-SUP-003"]}, "enforceability_and_FTO": {"en": "Unknown: FDA warns listings do not determine the enforceable range of patent claims; no validity, infringement or freedom-to-operate opinion was established, and the unextended patent term versus the 2036 Orange Book date remains unreconciled.", "es": "Desconocido: la FDA advierte que los registros no determinan el rango exigible de las reivindicaciones; no se estableció opinión de validez, infracción o libertad de operación, y el plazo no extendido frente a la fecha de 2036 del Orange Book sigue sin conciliar.", "source_ids": ["LLY-SUP-003", "REG-LLY-06", "REG-LLY-04"]}}, {"drug": "retatrutide", "molecule": {"en": "Investigational peptide triple agonist (GIP/GLP-1/glucagon per sponsor), not approved anywhere as of cutoff.", "es": "Tríple agonista peptídico investigacional (GIP/GLP-1/glucagón según el patrocinador), no aprobado en ninguna jurisdicción a la fecha de corte.", "source_ids": ["REG-LLY-01", "C-LLY-3"]}, "composition_of_matter": {"en": "Lilly owns granted US 11,542,313 B2 covering modified incretin-analog genera (mirror labels adjusted expiry 20 January 2039 but disclaims legal accuracy); exact retatrutide sequence-to-claim mapping and legal term are not established, and the 10-K did not provide patent identifiers.", "es": "Lilly posee la US 11,542,313 B2 otorgada sobre géneros de análogos de incretinas modificados (el espejo indica vencimiento ajustado el 20 de enero de 2039 pero descarta exactitud legal); el mapeo exacto de la secuencia de retatrutida a las reivindicaciones y su plazo legal no están establecidos, y el 10-K no dio identificadores de patente.", "source_ids": ["LLY-SUP-006", "REG-LLY-01"]}, "additional_protection": {"en": "No additional patent, exclusivity or know-how protection was established for retatrutide in this packet.", "es": "No se estableció protección adicional por patente, exclusividad o know-how para retatrutida en este paquete.", "source_ids": ["REG-LLY-01"]}, "regulatory_exclusivity": {"en": "None awarded: no FDA/EMA authorization exists; management plans a BLA submission in Q1 2027 subject to CMC completion, which is a plan, not approval or assured review timing.", "es": "Ninguna otorgada: no existe autorización de FDA/EMA; la dirección planea presentar el BLA en el Q1 2027 sujeto a completar CMC, lo cual es un plan, no una aprobación ni un plazo de revisión asegurado.", "source_ids": ["LLY-SUP-005", "C-LLY-4"]}, "competitive_workarounds": {"en": "TRIUMPH-5, the active head-to-head versus tirzepatide, has no posted results, so relative benefit is unknown; Roche's enicepatide (dual GLP-1/GIP) is in Phase III ENITH weight-management trials, a potential future competitor.", "es": "TRIUMPH-5, el cara a cara activo contra tirzepatida, no tiene resultados publicados, por lo que el beneficio relativo es desconocido; enicepatide de Roche (dual GLP-1/GIP) está en ensayos ENITH de fase III para manejo del peso, un potencial competidor futuro.", "source_ids": ["C-LLY-5", "LLY-SUP-010"]}, "licensing_and_territory": {"en": "No territorial licensing or partner arrangements were established in the retrieved sources.", "es": "No se establecieron licencias territoriales ni acuerdos con socios en las fuentes recuperadas.", "source_ids": ["REG-LLY-01"]}, "enforceability_and_FTO": {"en": "Unknown: no freedom-to-operate, validity or enforceability assessment exists; Phase 3 topline figures (e.g., -28.3% vs -2.2% at 12 mg, efficacy estimand) are sponsor-reported management assertions.", "es": "Desconocido: no existe evaluación de libertad de operación, validez o exigibilidad; los datos de fase 3 (p. ej., -28,3% vs -2,2% a 12 mg, estimando de eficacia) son afirmaciones gerenciales del patrocinador.", "source_ids": ["C-LLY-3", "LLY-SUP-006"]}}, {"drug": "orforglipron", "molecule": {"en": "Non-peptide small molecule GLP-1 program, outside this packet's peptide IP map, included because it is a material Lilly obesity asset.", "es": "Programa de molécula pequeña no peptídica agonista GLP-1, fuera del mapa de PI peptídica de este paquete, incluido por ser un activo material de obesidad de Lilly.", "source_ids": ["ID-LLY-01", "REG-LLY-05"]}, "composition_of_matter": {"en": "Unknown: no patent identifiers, claim scope or expiry for orforglipron were established in the retrieved sources.", "es": "Desconocido: no se establecieron identificadores de patente, alcance de reivindicaciones ni vencimiento para orforglipron en las fuentes recuperadas.", "source_ids": ["REG-LLY-05"]}, "additional_protection": {"en": "None established; the FDA approved it as the first new molecular entity under the CNPV pilot 50 days after filing on 1 April 2026, an accelerated procedure, not a finding of favouritism.", "es": "Ninguna establecida; la FDA lo aprobó como primera nueva entidad molecular bajo el piloto CNPV 50 días tras la presentación el 1 de abril de 2026, un procedimiento acelerado, no un hallazgo de favoritismo.", "source_ids": ["REG-LLY-05"]}, "regulatory_exclusivity": {"en": "Approval is documented; specific exclusivity end dates were not established in this packet.", "es": "La aprobación está documentada; las fechas específicas de vencimiento de exclusividad no se establecieron en este paquete.", "source_ids": ["REG-LLY-05"]}, "competitive_workarounds": {"en": "Commercial substitution between orforglipron and tirzepatide within Lilly's own franchise is not quantified; external competition mirrors that of other incretin programs.", "es": "La sustitución comercial entre orforglipron y tirzepatida dentro de la propia franquicia de Lilly no está cuantificada; la competencia externa refleja la de otros programas de incretinas.", "source_ids": ["REG-LLY-05"]}, "licensing_and_territory": {"en": "No territorial licensing arrangements were established in the retrieved sources.", "es": "No se establecieron acuerdos de licencia territorial en las fuentes recuperadas.", "source_ids": ["REG-LLY-05"]}, "enforceability_and_FTO": {"en": "Unknown: no freedom-to-operate or enforceability assessment was performed for this non-peptide asset.", "es": "Desconocido: no se realizó evaluación de libertad de operación ni exigibilidad para este activo no peptídico.", "source_ids": ["REG-LLY-05"]}}], "institutional_risk": [{"category": "OFFICIAL FINDING", "agency": "US GAO / FDA", "jurisdiction": "US", "finding": {"en": "GAO found the drug-inspector vacancy rate rose from 9% to 16% between November 2021 and June 2024, reducing inspections; FDA described hiring steps in 2026.", "es": "El GAO halló que la tasa de vacantes de inspectores de medicamentos subió del 9% al 16% entre noviembre de 2021 y junio de 2024, reduciendo inspecciones; la FDA describió acciones de contratación en 2026.", "source_ids": ["REG-COMMON-03"]}, "company_pathway": {"en": "If a Lilly facility awaits inspection, staffing limits could delay clearance or enforcement; no company-specific delay is established.", "es": "Si una planta de Lilly espera inspección, la falta de personal podría retrasar autorizaciones o fiscalización; no se estableció retraso específico para la compañía.", "source_ids": ["REG-COMMON-03"]}, "limitations": {"en": "Product- and site-specific materiality and timing are unknown; this is shared institutional background, not a company finding.", "es": "La materialidad y el plazo por producto y planta son desconocidos; es contexto institucional compartido, no un hallazgo sobre la compañía.", "source_ids": ["REG-COMMON-03"]}}, {"category": "DOCUMENTED FACT", "agency": "FDA", "jurisdiction": "US", "finding": {"en": "FDA resolved the tirzepatide injection shortage on 19 December 2024 with 2025 transition windows, and on 30 April 2026 proposed excluding tirzepatide and related peptides from the 503B bulk list; the proposal is not final.", "es": "La FDA resolvió la escasez de tirzepatida inyectable el 19 de diciembre de 2024 con ventanas de transición en 2025, y el 30 de abril de 2026 propuso excluir tirzepatida y péptidos afines de la lista de sustancias a granel 503B; la propuesta no es definitiva.", "source_ids": ["REG-LLY-02", "REG-LLY-03"]}, "company_pathway": {"en": "Changes in shortage status or bulk-list policy alter when lawful compounded copies of tirzepatide may compete with branded sales; the financial magnitude is not quantified.", "es": "Cambios en el estado de escasez o en la política de la lista a granel alteran cuándo las copias compuestas legales de tirzepatida pueden competir con las ventas de marca; la magnitud financiera no está cuantificada.", "source_ids": ["REG-LLY-02", "REG-LLY-03"]}, "limitations": {"en": "Final 503B disposition, enforcement and demand substitution remain uncertain.", "es": "La disposición final del 503B, la fiscalización y la sustitución de demanda siguen siendo inciertas.", "source_ids": ["REG-LLY-03"]}}, {"category": "OFFICIAL FINDING", "agency": "US Court of Appeals, Fifth Circuit", "jurisdiction": "US", "finding": {"en": "On 27 August 2026 the Fifth Circuit affirmed judgment for FDA and Lilly on the tirzepatide shortage delisting, holding any notice-and-comment error harmless; the unpublished opinion did not adjudicate all future compounding or patent issues.", "es": "El 27 de agosto de 2026 el Quinto Circuito confirmó el fallo a favor de la FDA y Lilly sobre la deslistación por escasez de tirzepatida, considerando inocuo cualquier error de notificación; la opinión no publicada no resolvió todos los futuros temas de compuestos o patentes.", "source_ids": ["REG-LLY-08"]}, "company_pathway": {"en": "Affirmance preserves the delisting baseline that limits shortage-dependent compounded copies while conditions hold; a future shortage or separate clinical-need pathway remains possible.", "es": "La confirmación preserva la línea base que limita las copias compuestas dependientes de escasez mientras persistan las condiciones; una futura escasez o vía aparte de necesidad clínica sigue siendo posible.", "source_ids": ["REG-LLY-08"]}, "limitations": {"en": "No Supreme Court petition, rehearing mandate or later FDA shortage update was established after the appeal.", "es": "No se estableció petición ante la Corte Suprema, mandato de reaudiencia ni actualización posterior de escasez de la FDA tras la apelación.", "source_ids": ["REG-LLY-08"]}}, {"category": "DOCUMENTED FACT", "agency": "FDA", "jurisdiction": "US", "finding": {"en": "FDA's January 2025 draft obesity guidance specifies adult mean percentage body-weight change versus control as the primary endpoint; it is a draft, not binding, and no company-specific adverse finding exists.", "es": "La guía borrador de obesidad de la FDA de enero de 2025 especifica el cambio porcentual medio de peso corporal frente a control como criterio principal; es borrador, no vinculante, y no existe hallazgo adverso específico contra la compañía.", "source_ids": ["REG-COMMON-01"]}, "company_pathway": {"en": "A future revision could alter trial design or duration for Lilly's obesity filings, including retatrutide; current guidance is a baseline standard, not a specific finding.", "es": "Una futura revisión podría alterar el diseño o duración de los ensayos de obesidad de Lilly, incluida retatrutida; la guía actual es un estándar base, no un hallazgo específico.", "source_ids": ["REG-COMMON-01"]}, "limitations": {"en": "Draft status, product-specific timing and materiality are unknown.", "es": "El estado de borrador, el plazo por producto y la materialidad son desconocidos.", "source_ids": ["REG-COMMON-01"]}}], "scenarios": [{"type": "bear", "assumption": {"en": "A tirzepatide patent is narrowed or invalidated, generic-peptide pathways mature, or lawful compounded competition expands; semaglutide or enicepatide gains share.", "es": "Una patente de tirzepatida se limita o invalida, las vías de genéricos peptídicos maduran o la competencia compuesta legal se expande; semaglutida o enicepatida gana cuota.", "source_ids": ["REG-COMMON-05", "REG-LLY-03", "LLY-SUP-010", "LLY-SUP-013"]}, "trigger": {"en": "Court or patent-office loss on key claims, an FDA generic or competitor approval, or a renewed shortage finding.", "es": "Pérdida judicial o en oficina de patentes sobre reivindicaciones clave, aprobación genérica o de competidor por la FDA, o un nuevo hallazgo de escasez.", "source_ids": ["REG-COMMON-05", "REG-LLY-02"]}, "affected_drug_territory": {"en": "Tirzepatide (Mounjaro, Zepbound), primarily US; retatrutide indirectly via competition.", "es": "Tirzepatida (Mounjaro, Zepbound), principalmente EE. UU.; retatrutida indirectamente vía competencia.", "source_ids": ["ID-LLY-01"]}, "economic_consequence": {"en": "Pressure on the franchise supplying 56% of 2025 revenue; magnitude unknown because no sourced substitution assumptions exist and no haircut is invented.", "es": "Presión sobre la franquicia que aporta el 56% de los ingresos de 2025; magnitud desconocida porque no existen supuestos de sustitución con fuentes y no se inventa descuento.", "source_ids": ["ID-LLY-01"]}, "timing_and_indicators": {"en": "Timing unknown; watch patent litigation, FDA Orange Book changes, ANDA/generic guidances and shortage status updates.", "es": "Plazo desconocido; vigilar litigios de patentes, cambios en el Orange Book, guías de genéricos/ANDA y actualizaciones del estado de escasez.", "source_ids": ["REG-COMMON-05", "REG-LLY-04"]}}, {"type": "base", "assumption": {"en": "Approved tirzepatide indications hold, patents remain listed and unchallenged successfully, and management executes its plan, including the raised FY2026 revenue guidance of USD 85-87bn and the planned retatrutide BLA in Q1 2027.", "es": "Las indicaciones aprobadas de tirzepatida se mantienen, las patentes siguen listadas sin ser anuladas, y la dirección ejecuta su plan, incluida la guía de ingresos FY2026 elevada a 85-87 mm USD y el BLA de retatrutida planeado para el Q1 2027.", "source_ids": ["LLY-F2", "LLY-SUP-005", "LLY-SUP-003"]}, "trigger": {"en": "Ordinary-course regulatory reviews and filings proceed without material adverse action.", "es": "Las revisiones y presentaciones regulatorias cursan con normalidad sin acción adversa material.", "source_ids": ["REG-COMMON-01"]}, "affected_drug_territory": {"en": "Tirzepatide in approved US indications; retatrutide US if submitted.", "es": "Tirzepatida en las indicaciones aprobadas en EE. UU.; retatrutida en EE. UU. si se presenta.", "source_ids": ["C-LLY-1", "C-LLY-2"]}, "economic_consequence": {"en": "Continuation of the documented revenue trajectory (Q2 revenue USD 22,974m; Mounjaro ~USD 9.9bn); no forward price or growth figure is invented.", "es": "Continuidad de la trayectoria de ingresos documentada (ingresos Q2 de 22.974 mm USD; Mounjaro ~9,9 mm USD); no se inventa precio ni crecimiento futuro.", "source_ids": ["LLY-F1", "LLY-F2"]}, "timing_and_indicators": {"en": "Quarterly results and the Q1 2027 BLA submission window; CMC completion is the stated condition.", "es": "Resultados trimestrales y la ventana de presentación del BLA en el Q1 2027; completar CMC es la condición declarada.", "source_ids": ["LLY-SUP-005"]}}, {"type": "bull", "assumption": {"en": "Retatrutide reaches approval with its reported Phase 3 efficacy and the TRIUMPH-5 comparison versus tirzepatide supports its profile, adding a second peptide growth driver.", "es": "Retatrutida alcanza la aprobación con la eficacia de fase 3 reportada y la comparación TRIUMPH-5 frente a tirzepatida respalda su perfil, añadiendo un segundo motor de crecimiento peptídico.", "source_ids": ["C-LLY-3", "C-LLY-4"]}, "trigger": {"en": "BLA submission in Q1 2027 as planned, positive posted TRIUMPH-5 results and favorable FDA review.", "es": "Presentación del BLA en el Q1 2027 según lo planeado, resultados positivos publicados de TRIUMPH-5 y revisión favorable de la FDA.", "source_ids": ["LLY-SUP-005", "C-LLY-5"]}, "affected_drug_territory": {"en": "Retatrutide, US first, contingent on filing and approval.", "es": "Retatrutida, primero EE. UU., sujeto a presentación y aprobación.", "source_ids": ["LLY-SUP-005"]}, "economic_consequence": {"en": "Additional obesity/related revenue potential; no probability, timing of peak sales or incremental revenue figure is invented.", "es": "Potencial adicional de ingresos por obesidad y afines; no se inventa probabilidad, fecha de ventas pico ni cifra de ingresos incrementales.", "source_ids": ["LLY-SUP-009"]}, "timing_and_indicators": {"en": "TRIUMPH-5 results posting, BLA acceptance and review milestones; all remain uncertain.", "es": "Publicación de resultados de TRIUMPH-5, aceptación del BLA e hitos de revisión; todo sigue siendo incierto.", "source_ids": ["C-LLY-5", "LLY-SUP-005"]}}], "risk_scenarios": [{"kind": "regulatory_downside", "trigger": {"en": "FDA or EMA requests additional efficacy, safety or CMC evidence, restricts a label, or a facility inspection finds deficiencies; a renewed shortage finding could also reopen compounded competition.", "es": "La FDA o la EMA solicitan evidencia adicional de eficacia, seguridad o CMC, restringen una etiqueta, o una inspección de planta halla deficiencias; un nuevo hallazgo de escasez también podría reabrir la competencia compuesta.", "source_ids": ["REG-COMMON-01", "REG-LLY-02"]}, "affected_drug_territory": {"en": "Tirzepatide and retatrutide where filed or to be filed, US/EU.", "es": "Tirzepatida y retatrutida donde estén o vayan a presentarse, EE. UU./UE.", "source_ids": ["REG-COMMON-01", "REG-COMMON-02"]}, "economic_consequence": {"en": "Launch delay, narrower eligible population or higher development and manufacturing spend; no probability or numerical effect is assigned.", "es": "Retraso de lanzamiento, población elegible más estrecha o mayor gasto en desarrollo y fabricación; no se asigna probabilidad ni efecto numérico.", "source_ids": ["REG-COMMON-01"]}, "timing_and_indicators": {"en": "Next filing or inspection cycle; drug-specific timing unknown. Indicators: FDA/EMA decision letters, inspection findings, company filing updates.", "es": "Próximo ciclo de presentación o inspección; el plazo por medicamento es desconocido. Indicadores: cartas de decisión FDA/EMA, hallazgos de inspección, actualizaciones de la compañía.", "source_ids": ["REG-COMMON-03"]}, "mitigation_or_counterevidence": {"en": "Approved indications remain authorized; the boxed-warning and GI limitations are already in the label and reflected in the approved benefit-risk; no company-specific inspection deficiency is established.", "es": "Las indicaciones aprobadas siguen vigentes; la advertencia de recuadro y las limitaciones GI ya figuran en la etiqueta y están reflejadas en la relación beneficio-riesgo aprobada; no se establece deficiencia de inspección específica de la compañía.", "source_ids": ["C-LLY-1", "LLY-SUP-012"]}}, {"kind": "ip_loss", "trigger": {"en": "A key tirzepatide patent expires, is narrowed or invalidated, or a lawful competing molecule or formulation gains authorization; for retatrutide, claim coverage is never confirmed.", "es": "Una patente clave de tirzepatida vence, se limita o invalida, o una molécula o formulación competidora legal obtiene autorización; para retatrutida, la cobertura de reivindicaciones nunca se confirma.", "source_ids": ["REG-COMMON-05", "REG-LLY-06", "LLY-SUP-006"]}, "affected_drug_territory": {"en": "Tirzepatide (US first, then Europe/Japan per company estimates) and retatrutide across intended territories.", "es": "Tirzepatida (primero EE. UU., luego Europa/Japón según estimaciones de la compañía) y retatrutida en los territorios previstos.", "source_ids": ["REG-LLY-01"]}, "economic_consequence": {"en": "Price and volume competition against the franchise producing 56% of 2025 revenue; the numerical sensitivity is unavailable without sourced substitution assumptions.", "es": "Competencia de precio y volumen contra la franquicia que produce el 56% de los ingresos de 2025; la sensibilidad numérica no está disponible sin supuestos de sustitución con fuentes.", "source_ids": ["ID-LLY-01"]}, "timing_and_indicators": {"en": "FDA-listed dates run to 2036-2041 plus exclusivities from 2026-2028; indicators are patent-office and court records, FDA generic or alternative approvals and sponsor disclosures.", "es": "Las fechas listadas por la FDA llegan a 2036-2041 más exclusividades de 2026-2028; los indicadores son registros de patentes y tribunales, aprobaciones genéricas o alternativas de la FDA y divulgaciones del patrocinador.", "source_ids": ["LLY-SUP-003", "LLY-SUP-004", "REG-COMMON-05"]}, "mitigation_or_counterevidence": {"en": "Layered FDA-listed patents (US 9,474,780 to 2036; US 11,357,820 to 2039; later use patents), multiple exclusivity periods, differentiated clinical profile, and the affirmed delisting baseline limiting compounded copies.", "es": "Patentes escalonadas listadas por la FDA (US 9,474,780 hasta 2036; US 11,357,820 hasta 2039; patentes de uso posteriores), múltiples exclusividades, perfil clínico diferenciado y la línea base de deslistación confirmada que limita copias compuestas.", "source_ids": ["LLY-SUP-003", "LLY-SUP-004", "REG-LLY-08"]}}], "ratings": [{"dimension": "clinical_evidence", "rating": "GOOD", "reason": {"en": "Tirzepatide has FDA approval on a 2,539-patient pivotal trial plus a direct SURMOUNT-5 win (20.2% vs 13.7%); retatrutide shows strong Phase 3 toplines but remains investigational.", "es": "Tirzepatida tiene aprobación de la FDA sobre un estudio pivotal de 2.539 pacientes más una victoria directa en SURMOUNT-5 (20,2% vs 13,7%); retatrutida muestra fuertes resultados de fase 3 pero sigue siendo investigacional.", "source_ids": ["C-LLY-1", "LLY-SUP-007", "C-LLY-3", "C-LLY-4"]}}, {"dimension": "ip_economic_defensibility", "rating": "GOOD", "reason": {"en": "FDA-listed composition patents to 2036 and product/use patents to 2039-2041 plus exclusivities to 2028+ protect tirzepatide, though listings are not enforceability and retatrutide's claim mapping is unconfirmed.", "es": "Patentes de composición listadas por la FDA hasta 2036 y patentes de producto/uso hasta 2039-2041 más exclusividades hasta 2028+ protegen a tirzepatida, aunque los registros no son exigibilidad y el mapeo de reivindicaciones de retatrutida no está confirmado.", "source_ids": ["LLY-SUP-003", "LLY-SUP-004", "LLY-SUP-006"]}}, {"dimension": "financial_strength", "rating": "GOOD", "reason": {"en": "Q2 revenue of USD 22,974m, net income of USD 7,095m and H1 operating cash flow of USD 16,023m against USD 54,908m debt indicate strong self-funding, with post-June M&A cash movements material.", "es": "Ingresos del Q2 de 22.974 mm USD, utilidad neta de 7.095 mm USD y flujo operativo del S1 de 16.023 mm USD frente a una deuda de 54.908 mm USD indican fuerte autofinanciamiento, con movimientos de efectivo por M&A posteriores a junio materiales.", "source_ids": ["LLY-F1", "LLY-SUP-001"]}}, {"dimension": "regulatory_exposure", "rating": "FAIR", "reason": {"en": "Core approvals are solid, but boxed-warning limitations, non-final compounding policy shifts, draft generic-peptide guidances and the GAO inspector-staffing finding keep exposure more than minimal.", "es": "Las aprobaciones centrales son sólidas, pero las limitaciones con advertencia de recuadro, cambios de política de compuestos no definitivos, guías borrador de genéricos peptídicos y el hallazgo de personal inspector del GAO mantienen la exposición por encima de mínima.", "source_ids": ["C-LLY-1", "REG-LLY-03", "REG-COMMON-05", "REG-COMMON-03"]}}, {"dimension": "competitive_position", "rating": "FAIR", "reason": {"en": "SURMOUNT-5 favors tirzepatide over semaglutide at tested doses, but Wegovy carries cardiovascular and MASH indications tirzepatide lacks, the 7.2mg comparison is only indirect, and Roche's enicepatide is advancing in Phase 3.", "es": "SURMOUNT-5 favorece a tirzepatida sobre semaglutida en las dosis probadas, pero Wegovy tiene indicaciones cardiovasculares y de MASH que tirzepatida carece, la comparación con 7,2 mg es solo indirecta y enicepatide de Roche avanza en fase 3.", "source_ids": ["LLY-SUP-007", "LLY-SUP-013", "LLY-SUP-008", "LLY-SUP-010"]}}, {"dimension": "valuation_attractiveness", "rating": "UNKNOWN", "reason": {"en": "Only mixed-date illustrative figures exist (~USD 1,110bn cap, ~USD 1,156bn EV from October price, August shares, June balances), so no current, synchronized valuation judgment is supported.", "es": "Solo existen cifras ilustrativas de fechas mixtas (~1.110 mm USD de capitalización, ~1.156 mm USD de EV con precio de octubre, acciones de agosto, saldos de junio), por lo que no se respalda un juicio de valuation actual y sincronizado.", "source_ids": ["LLY-SUP-001", "LLY-SUP-002"]}}, {"dimension": "catalyst_quality", "rating": "GOOD", "reason": {"en": "A planned Q1 2027 retatrutide BLA and the pending TRIUMPH-5 head-to-head results are near-term, company-defining milestones, though both depend on CMC completion and unposted data.", "es": "Un BLA de retatrutida planeado para el Q1 2027 y los resultados pendientes de TRIUMPH-5 cara a cara son hitos cercanos que definen a la compañía, aunque ambos dependen de completar CMC y de datos no publicados.", "source_ids": ["LLY-SUP-005", "C-LLY-5"]}}], "unknowns": [{"en": "Retatrutide's exact patent-to-molecule claim mapping, grant family status and legal term require specialist primary-office confirmation; no verified exclusivity conclusion exists.", "es": "El mapeo exacto de patente a molécula de retatrutida, el estado de la familia otorgada y el plazo legal requieren confirmación especializada en la oficina primaria; no existe conclusión de exclusividad verificada.", "source_ids": ["LLY-SUP-006", "REG-LLY-01"]}, {"en": "Current exact shares, cash and debt are unknown after July/August acquisitions and USD 4bn of H1 buybacks, so today's true market cap and EV cannot be computed.", "es": "Las acciones, el efectivo y la deuda actuales exactos son desconocidos tras las adquisiciones de julio/agosto y 4.000 mm USD en recompras del S1, por lo que no se puede calcular la capitalización y el EV reales de hoy.", "source_ids": ["LLY-SUP-001"]}, {"en": "TRIUMPH-5 head-to-head retatrutide versus tirzepatide has no posted results, leaving relative benefit and safety unknown.", "es": "TRIUMPH-5 cara a cara de retatrutida frente a tirzepatida no tiene resultados publicados, dejando el beneficio y la seguridad relativos como desconocidos.", "source_ids": ["C-LLY-5"]}, {"en": "No adjudicated validity, infringement or freedom-to-operate opinion exists for any tirzepatide or retatrutide patent claim.", "es": "No existe opinión adjudicada de validez, infracción o libertad de operación para ninguna reivindicación de patente de tirzepatida o retatrutida.", "source_ids": ["REG-LLY-06", "LLY-SUP-003"]}, {"en": "FDA currently lists tirzepatide and semaglutide as absent from both its shortage list and 503B bulks list. A final decision on the April 2026 proposed bulks-list exclusion was not established; future litigation or shortage changes remain uncertain.", "es": "La FDA indica actualmente que tirzepatida y semaglutida no figuran en su lista de escasez ni en la lista de sustancias 503B. No se estableció una decisión final sobre la exclusión propuesta en abril de 2026; futuros litigios o cambios de escasez siguen siendo inciertos.", "source_ids": ["REG-LLY-03", "REG-LLY-08", "LLY-F2", "LLY-QA-FDA-COMPOUND"]}, {"en": "Broker accessibility was not established: Interactive Brokers publicly lists Costa Rica as supported, but individual account approval, permissions and exact contract availability are unconfirmed.", "es": "La accesibilidad por corredor no quedó establecida: Interactive Brokers lista públicamente a Costa Rica como soportado, pero la aprobación de cuenta individual, los permisos y la disponibilidad exacta del contrato no están confirmados.", "source_ids": ["LLY-SUP-011"]}], "coverage_boundary": {"en": "Evidence covers identity (2025 Form 10-K), deep peptide pass on tirzepatide and investigational retatrutide, FDA Orange Book records, Q2 2026 financials and institutional background; orforglipron is an approved non-peptide outside the peptide IP map. No synchronized current valuation basis exists, patent listings are not enforceability, shared regulatory findings are not company penalties, and no overall score is given; absence of evidence on conflicts or misconduct is not evidence of absence.", "es": "La evidencia cubre identidad (Form 10-K 2025), pase profundo de péptidos sobre tirzepatida y retatrutida investigacional, re
