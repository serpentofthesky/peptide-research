iones, no añadido como reclamo; no es valor justo)"}, "value": 6243090996.04, "unit": "USD", "as_of": "price 2026-10-09; balance-sheet items 2026-06-30", "source_ids": ["RYTM-SUP-01", "RYTM-SUP-02", "RYTM-SUP-05"], "unknown_reason": null}], "defensibility": [{"drug": "setmelanotide (IMCIVREE)", "molecule": {"en": "Documented fact: a modified/synthetic cyclic eight-amino-acid MC4R agonist peptide, marketed as IMCIVREE.", "es": "Hecho documentado: péptido cíclico modificado/sintético de ocho aminoácidos agonista del MC4R, comercializado como IMCIVREE.", "source_ids": ["ID-RYTM-01", "REG-RYTM-01"]}, "composition_of_matter": {"en": "Management asserts 20 issued US and >240 foreign patents across the selected peptide MC4R family; the FDA list names US8039435 (expiry 2032-08-21), US9458195 (2027-10-13) and US11129869 (product, 2034-07-04), corroborated by the official ZIP.", "es": "La dirección afirma 20 patentes emitidas en EE. UU. y más de 240 extranjeras en la familia MC4R peptídica; la lista de la FDA nombra US8039435 (vence 21-08-2032), US9458195 (13-10-2027) y US11129869 (producto, 04-07-2034), corroboradas por el ZIP oficial.", "source_ids": ["REG-RYTM-01", "RYTM-SUP-OB", "RYTM-SUP-FDA-ZIP"]}, "additional_protection": {"en": "Management reports a 5-year US patent-term extension on a key setmelanotide composition family through 2032, consistent with the FDA-listed US8039435 expiry; individual patent claims were not reconciled.", "es": "La dirección reporta una extensión de patente de 5 años en EE. UU. para la familia de composición clave de setmelanotida hasta 2032, coherente con el vencimiento listado por la FDA de US8039435; las reivindicaciones individuales no fueron conciliadas.", "source_ids": ["REG-RYTM-01", "RYTM-SUP-04", "RYTM-SUP-USPTO-8039435"]}, "regulatory_exclusivity": {"en": "Orange Book lists I-987 to 2029-03-19, NPP to 2027-12-20, ODE336 to 2027-11-25, ODE402 to 2029-06-16 and ODE508/509 to 2031-12-20; codes must be read individually and no remaining original five-year NCE is assumed; the issuer separately claims five-year NCE data exclusivity.", "es": "El Orange Book lista I-987 hasta 19-03-2029, NPP hasta 20-12-2027, ODE336 hasta 25-11-2027, ODE402 hasta 16-06-2029 y ODE508/509 hasta 20-12-2031; los códigos deben leerse individualmente y no se asume NCE original de cinco años restante; el emisor alega por separado exclusividad de datos NCE de cinco años.", "source_ids": ["REG-RYTM-01", "RYTM-SUP-OB", "RYTM-SUP-FDA-ZIP"]}, "competitive_workarounds": {"en": "Scenario: FDA's 17 revised draft generic-peptide product-specific guidances (July 2026) may clarify an eventual ANDA pathway where rights allow; no generic is approved and no launch date exists. ECHO shows exenatide missed BMI in HO (−1.7pp, p=.40), documenting an alternative mechanism studied, not a licensed HO competitor.", "es": "Escenario: las 17 guías revisadas de borrador para genéricos peptídicos de la FDA (julio 2026) pueden aclarar una eventual vía de ANDA donde los derechos lo permitan; no hay genérico aprobado ni fecha de lanzamiento. ECHO muestra que la exenatida no mejoró el IMC en OH (−1,7pp, p=0,40), documentando un mecanismo alternativo estudiado, no un competidor autorizado en OH.", "source_ids": ["REG-COMMON-05", "RYTM-SUP-RIVAL"]}, "licensing_and_territory": {"en": "Facts: Ipsen licensed setmelanotide-related rights exclusively worldwide in 2013, with mid-single-digit sales royalties until the later of patent expiry or 10 years from first sale, up to USD 40m milestones (USD 13m paid by end-2025); LGC imposes low-to-mid single-digit MC4R royalties from 2029 (up to USD 205m milestones); Camurus holds only FluidCrystal weekly-formulation rights. The RareStone China sublicense terminated 2025-03-14.", "es": "Hechos: Ipsen licenció derechos relacionados con setmelanotida en exclusiva mundial en 2013, con regalías de un dígito medio sobre ventas hasta la última fecha entre vencimiento de patente o 10 años desde la primera venta, hasta USD 40m en hitos (USD 13m pagados a cierre de 2025); LGC impone regalías MC4R de un dígito bajo-medio desde 2029 (hasta USD 205m en hitos); Camurus solo tiene derechos FluidCrystal de formulación semanal. La sublicencia de RareStone China terminó el 14-03-2025.", "source_ids": ["RYTM-SUP-04", "RYTM-SUP-05"]}, "enforceability_and_FTO": {"en": "Unknown: no bounded legal opinion establishes validity, enforceability or freedom to operate; the FDA list identifies patents but does not certify they block a competitor; Ipsen patent-prosecution obligations have exceptions. Maintenance status beyond the listed dates is unverified.", "es": "Desconocido: ninguna opinión legal acotada establece validez, ejecutabilidad o libertad de operación; la lista de la FDA identifica patentes pero no certifica que bloqueen a un competidor; las obligaciones de prosecución de Ipsen tienen excepciones. El estado de mantenimiento más allá de las fechas listadas no está verificado.", "source_ids": ["REG-RYTM-01", "RYTM-SUP-OB", "RYTM-SUP-USPTO-8039435"]}}], "institutional_risk": [{"category": "OFFICIAL FINDING", "agency": "US GAO / FDA", "jurisdiction": "US", "finding": {"en": "GAO found the FDA drug-inspector vacancy rate rose from 9% to 16% between November 2021 and June 2024, reducing inspections; FDA described hiring steps in March 2026.", "es": "El GAO encontró que la tasa de vacantes de inspectores de medicamentos de la FDA subió del 9% al 16% entre noviembre de 2021 y junio de 2024, reduciendo inspecciones; la FDA describió medidas de contratación en marzo de 2026.", "source_ids": ["REG-COMMON-03"]}, "company_pathway": {"en": "If a facility supplying Rhythm awaited inspection, staffing limits could delay clearance or enforcement; no company-specific delay is established.", "es": "Si una instalación que abastece a Rhythm esperara inspección, la falta de personal podría retrasar autorizaciones o fiscalización; no se establece ningún retraso específico de la compañía.", "source_ids": ["REG-COMMON-03"]}, "limitations": {"en": "Shared institutional background only; product/site-specific materiality and timing are unknown.", "es": "Solo antecedente institucional compartido; la materialidad y el calendario por producto/instalación son desconocidos.", "source_ids": ["REG-COMMON-03"]}}, {"category": "DOCUMENTED FACT", "agency": "FDA", "jurisdiction": "US", "finding": {"en": "On 2026-07-28 FDA published 17 revised draft product-specific guidances on generic peptides, including obesity/diabetes agents; these are drafts, not approvals of a generic.", "es": "El 28-07-2026 la FDA publicó 17 guías revisadas de borrador sobre genéricos peptídicos, incluyendo agentes de obesidad/diabetes; son borradores, no aprobaciones de un genérico.", "source_ids": ["REG-COMMON-05"]}, "company_pathway": {"en": "May clarify evidence for eventual ANDAs on setmelanotide where applicable patent/exclusivity constraints lapse; no generic filing or launch date is established.", "es": "Puede aclarar la evidencia para eventuales ANDA sobre setmelanotida cuando venzan las restricciones aplicables de patente/exclusividad; no hay solicitud de genérico ni fecha de lanzamiento establecida.", "source_ids": ["REG-COMMON-05", "RYTM-SUP-OB"]}, "limitations": {"en": "Draft status; product-specific applicability to IMCIVREE and any ANDA timing are unknown.", "es": "Estado de borrador; la aplicabilidad específica a IMCIVREE y el calendario de cualquier ANDA son desconocidos.", "source_ids": ["REG-COMMON-05"]}}, {"category": "DOCUMENTED FACT", "agency": "EMA", "jurisdiction": "EU", "finding": {"en": "EMA's revised Policy 0044 (effective 2025-05-01) excluded experts with current product/condition interests and aligned a three-year cooling-off period, following CJEU impartiality rulings; it is not a finding of corruption.", "es": "La Política 0044 revisada de la EMA (vigente desde el 01-05-2025) excluyó a expertos con intereses actuales en el producto/condición y unificó un período de enfriamiento de tres años, tras sentencias de imparcialidad del TJUE; no es un hallazgo de corrupción.", "source_ids": ["REG-COMMON-07"]}, "company_pathway": {"en": "Expert eligibility can affect the composition or timing of a CHMP assessment for future EU filings such as IMCIVREE lifecycle work; no covered-product conflict is established.", "es": "La elegibilidad de expertos puede afectar la composición o el calendario de una evaluación del CHMP para futuras presentaciones en la UE, como trabajos de ciclo de vida de IMCIVREE; no se establece conflicto en producto cubierto.", "source_ids": ["REG-COMMON-07", "C-RYTM-3"]}, "limitations": {"en": "Procedural background; no company-specific expert restriction or review failure documented.", "es": "Antecedente de procedimiento; no hay restricción de expertos ni fallo de revisión específico de la compañía documentado.", "source_ids": ["REG-COMMON-07"]}}], "scenarios": [{"type": "bear", "assumption": {"en": "Assumes acquisition-HO uptake disappoints, the 2026 guidance range of USD 363–397m opex persists, and pipeline readouts (RM-718, bivamelagon, PWS) fail or slip.", "es": "Asume que la captación en OH adquirida decepcione, que el rango de opex guiado de USD 363–397m persista y que las lecturas del pipeline (RM-718, bivamelagon, PWS) fracasen o se retrasen.", "source_ids": ["RYTM-F2", "RYTM-SUP-04", "RYTM-SUP-PIPE"]}, "trigger": {"en": "Weak IMCIVREE adoption data, failed or delayed registrational initiation, or renewed financing needs against the USD 106.102m royalty obligation.", "es": "Datos débiles de adopción de IMCIVREE, inicio registracional fallido o retrasado, o necesidades renovadas de financiación frente a la obligación de regalías de USD 106,102m.", "source_ids": ["RYTM-F1", "RYTM-F2"]}, "affected_drug_territory": {"en": "Setmelanotide across US/EU markets; pipeline programs globally.", "es": "Setmelanotida en los mercados de EE. UU./UE; programas del pipeline globalmente.", "source_ids": ["C-RYTM-1", "C-RYTM-3"]}, "economic_consequence": {"en": "Revenue growth below the rare-disease pool implied by issuer estimates (~10,000 US, ~10,000 EU4/UK/NL, 5,000–8,000 Japan acquired-HO patients) would pressure an already cash-consuming P&L; no probability or price target is assigned.", "es": "Un crecimiento de ingresos por debajo del pool de enfermedad rara implícito en las estimaciones del emisor (~10.000 EE. UU., ~10.000 UE4/UK/PB, 5.000–8.000 Japón con OH adquirida) presionaría una P&L ya consumidora de caja; no se asigna probabilidad ni precio objetivo.", "source_ids": ["RYTM-SUP-EPI", "RYTM-F1"]}, "timing_and_indicators": {"en": "Quarterly IMCIVREE revenue and adoption disclosures, bivamelagon initiation by year-end 2026, and runway commentary.", "es": "Ingresos trimestrales de IMCIVREE y divulgaciones de adopción, inicio de bivamelagon a finales de 2026 y comentarios sobre liquidez.", "source_ids": ["RYTM-F2", "RYTM-SUP-04"]}}, {"type": "base", "assumption": {"en": "Assumes approved indications (biallelic deficiencies, BBS, acquired HO age 4+) are commercialized per label, EMANATE expansion is not recovered, and rights plus listed exclusivities hold through their dated expiries.", "es": "Asume que las indicaciones aprobadas (deficiencias bialélicas, BBS, OH adquirida desde los 4 años) se comercializan según etiqueta, que la expansión de EMANATE no se recupera, y que los derechos y exclusividades listadas se mantienen hasta sus vencimientos fechados.", "source_ids": ["C-RYTM-1", "C-RYTM-5", "C-RYTM-6", "RYTM-SUP-OB"]}, "trigger": {"en": "Ordinary-course execution: acquired-HO launch ramp,TRANSCEND-supported uptake, and stated development plans proceeding.", "es": "Ejecución en curso ordinario: rampa de lanzamiento en OH adquirida, adopción respaldada por TRANSCEND y planes de desarrollo declarados avanzando.", "source_ids": ["C-RYTM-4", "ID-RYTM-02", "RYTM-SUP-04"]}, "affected_drug_territory": {"en": "IMCIVREE in US and EU approved indications.", "es": "IMCIVREE en indicaciones aprobadas de EE. UU. y UE.", "source_ids": ["C-RYTM-1", "C-RYTM-3"]}, "economic_consequence": {"en": "Continued rare-disease revenue growth from the USD 71.3m Q2 2026 base, with Ipsen/LGC royalties and the deferred royalty obligation reducing retained economics; magnitude not quantified here.", "es": "Continuo crecimiento de ingresos de enfermedad rara desde la base de USD 71,3m del Q2 2026, con regalías a Ipsen/LGC y la obligación de regalías diferida reduciendo la economía retenida; magnitud no cuantificada aquí.", "source_ids": ["RYTM-F2", "RYTM-SUP-04"]}, "timing_and_indicators": {"en": "Quarterly results, bivamelagon registrational initiation by year-end 2026 (company plan), and label/adopton disclosures.", "es": "Resultados trimestrales, inicio registracional de bivamelagon a finales de 2026 (plan de la compañía) y divulgaciones de etiqueta/adopción.", "source_ids": ["RYTM-F2", "RYTM-SUP-04"]}}, {"type": "bull", "assumption": {"en": "Assumes acquired-HO adoption exceeds issuer-population expectations and one pipeline asset (weekly RM-718 or oral bivamelagon) generates pivotal success; both are unproven.", "es": "Asume que la adopción en OH adquirida supera las expectativas de población del emisor y que un activo del pipeline (RM-718 semanal o bivamelagon oral) logra éxito pivotal; ambos no probados.", "source_ids": ["RYTM-SUP-EPI", "RYTM-SUP-PIPE", "RYTM-SUP-04"]}, "trigger": {"en": "Positive controlled pivotal data or regulatory filings for RM-718/bivamelagon, or faster IMCIVREE penetration in the newly acquired-HO label.", "es": "Datos pivotes controlados positivos o presentaciones regulatorias de RM-718/bivamelagon, o penetración más rápida de IMCIVREE en la nueva etiqueta de OH adquirida.", "source_ids": ["RYTM-SUP-PIPE", "C-RYTM-2"]}, "affected_drug_territory": {"en": "Setmelanotide US/EU commercial base plus investigational MC4R programs globally.", "es": "Base comercial de setmelanotida en EE. UU./UE más programas MC4R investigacionales globalmente.", "source_ids": ["ID-RYTM-01"]}, "economic_consequence": {"en": "Broader revenue base within rare-disease pricing; still constrained by Ipsen/LGC royalties and unproven enforceability; no probabilities or prices invented.", "es": "Base de ingresos más amplia dentro de precios de enfermedad rara; aún limitada por regalías a Ipsen/LGC y ejecutabilidad no probada; no se inventan probabilidades ni precios.", "source_ids": ["RYTM-SUP-04", "REG-RYTM-01"]}, "timing_and_indicators": {"en": "Bivamelagon registrational initiation by year-end 2026 (company plan), further RM-718 dataset expansion, and quarterly IMCIVREE adoption trends.", "es": "Inicio registracional de bivamelagon a finales de 2026 (plan de la compañía), expansión de los datos de RM-718 y tendencias trimestrales de adopción de IMCIVREE.", "source_ids": ["RYTM-SUP-04", "RYTM-SUP-PIPE"]}}], "risk_scenarios": [{"kind": "regulatory_downside", "trigger": {"en": "FDA/EMA requests additional efficacy, safety or CMC evidence, restricts a label, or a manufacturing inspection finds deficiencies.", "es": "FDA/EMA solicita evidencia adicional de eficacia, seguridad o CMC, restringe una etiqueta, o una inspección de fabricación encuentra deficiencias.", "source_ids": ["REG-COMMON-03", "C-RYTM-5"]}, "affected_drug_territory": {"en": "Setmelanotide in US/EU, approved and future filings.", "es": "Setmelanotida en EE. UU./UE, aprobadas y futuras presentaciones.", "source_ids": ["C-RYTM-1", "C-RYTM-3"]}, "economic_consequence": {"en": "Review delay or label limits could postpone launches, constrain eligible patients (FDA already narrowed the acquired-HO population and warns on renal impairment, sexual-arousal disturbance, depression/suicidality and pigmentation) or raise spending; no numerical effect assigned.", "es": "Un retraso de revisión o límites de etiqueta podrían posponer lanzamientos, restringir pacientes elegibles (la FDA ya acotó la población de OH adquirida y advierte sobre insuficiencia renal grave, disturbo de excitación sexual, depresión/suicidio y pigmentación) o aumentar el gasto; sin efecto numérico asignado.", "source_ids": ["C-RYTM-1", "C-RYTM-5"]}, "timing_and_indicators": {"en": "Next filing/inspection or postmarketing review; drug-specific schedule unknown. Indicators: FDA/EMA decision letters, inspection findings, company filing updates.", "es": "Próxima presentación/inspección o revisión postcomercialización; calendario específico desconocido. Indicadores: cartas de decisión de FDA/EMA, hallazgos de inspección, actualizaciones de la compañía.", "source_ids": ["REG-COMMON-03"]}, "mitigation_or_counterevidence": {"en": "Approved indications remain authorized; additional clinical data, CMC remediation and alternative markets are possible mitigations, subject to regulator acceptance.", "es": "Las indicaciones aprobadas siguen autorizadas; datos clínicos adicionales, remediación CMC y mercados alternativos son mitigaciones posibles, sujetas a aceptación regulatoria.", "source_ids": ["C-RYTM-1", "C-RYTM-3"]}}, {"kind": "ip_loss", "trigger": {"en": "A relevant patent/exclusivity expires, is narrowed or invalidated, or a lawful competing molecule/formulation gains authorization; FDA's revised draft generic-peptide guidances could clarify an ANDA pathway.", "es": "Una patente/exclusividad relevante vence, se acota o invalida, o una molécula/formulación competidora legal obtiene autorización; las guías revisadas de genéricos peptídicos de la FDA podrían aclarar una vía de ANDA.", "source_ids": ["REG-COMMON-05", "RYTM-SUP-OB"]}, "affected_drug_territory": {"en": "Setmelanotide, primarily US where listed patents (2027–2034) and exclusivities (to 2029–2031) apply; territory scope of each right not fully reconciled.", "es": "Setmelanotida, principalmente EE. UU. donde aplican las patentes listadas (2027–2034) y exclusividades (hasta 2029–2031); el alcance territorial de cada derecho no está totalmente conciliado.", "source_ids": ["RYTM-SUP-OB", "RYTM-SUP-FDA-ZIP"]}, "economic_consequence": {"en": "Loss or bypass of a legal barrier may increase price and volume competition against the USD 71.3m quarterly revenue base; effect depends on substitutable efficacy and surviving rights; no haircut or probability assigned.", "es": "La pérdida o eludir una barrera legal puede aumentar la competencia de precio y volumen frente a la base trimestral de USD 71,3m; el efecto depende de eficacia sustituible y derechos supervivientes; sin descuento ni probabilidad asignados.", "source_ids": ["RYTM-F2", "REG-RYTM-01"]}, "timing_and_indicators": {"en": "Listed expiries run 2027–2034; exact timing of any challenge is unknown. Indicators: patent-office/court records, FDA generic or alternative approvals, issuer disclosures.", "es": "Los vencimientos listados van de 2027 a 2034; el calendario exacto de cualquier desafío es desconocido. Indicadores: registros de oficinas de patentes/tribunales, aprobaciones genéricas de la FDA, divulgaciones del emisor.", "source_ids": ["RYTM-SUP-OB", "RYTM-SUP-FDA-ZIP"]}, "mitigation_or_counterevidence": {"en": "Layered patents (US11129869 to 2034), dated exclusivities, peptide complexity and distribution may partly offset; none presumed decisive, and enforceability remains unverified.", "es": "Patentes en capas (US11129869 hasta 2034), exclusividades fechadas, complejidad peptídica y distribución pueden compensar parcialmente; ninguna se presume decisiva y la ejecutabilidad sigue sin verificar.", "source_ids": ["RYTM-SUP-OB", "RYTM-SUP-USPTO-8039435"]}}], "ratings": [{"dimension": "clinical_evidence", "rating": "GOOD", "reason": {"en": "Randomized pivotal TRANSCEND evidence (BMI −16.5% vs +3.3%, p<.001) supports active approvals, though all four EMANATE endpoints missed and long-term/outside-trial outcomes remain unestablished.", "es": "La evidencia pivotal aleatorizada de TRANSCEND (IMC −16,5% vs +3,3%, p<0,001) respalda aprobaciones vigentes, aunque los cuatro criterios de EMANATE fracasaron y los resultados a largo plazo/fuera del ensayo siguen sin establecerse.", "source_ids": ["C-RYTM-4", "C-RYTM-1", "C-RYTM-6"]}}, {"dimension": "ip_economic_defensibility", "rating": "FAIR", "reason": {"en": "FDA-listed patents to 2032–2034 and dated exclusivities are strong identification, but enforceability/FTO are unverified, Ipsen/LGC royalties take a share of economics, and the generic-peptide pathway is being clarified.", "es": "Las patentes listadas por la FDA hasta 2032–2034 y exclusividades fechadas son una identificación fuerte, pero ejecutabilidad/FTO no están verificadas, Ipsen/LGC se llevan parte de la economía, y la vía de genéricos peptídicos se está aclarando.", "source_ids": ["RYTM-SUP-OB", "REG-COMMON-05", "RYTM-SUP-04", "REG-RYTM-01"]}}, {"dimension": "financial_strength", "rating": "FAIR", "reason": {"en": "USD 330.897m of June cash/investments and a management-stated 24-month runway are offset by USD 53.3m H1 operating burn, a USD 106.102m royalty obligation, USD 116.457m preferred preference and 2026 opex guidance of USD 363–397m.", "es": "USD 330,897m de caja/inversiones de junio y una liquidez declarada de 24 meses se compensan con USD 53,3m de quema operativa en el S1, una obligación de regalías de USD 106,102m, una preferencia preferente de USD 116,457m y guía de opex 2026 de USD 363–397m.", "source_ids": ["RYTM-F1", "RYTM-F2"]}}, {"dimension": "regulatory_exposure", "rating": "FAIR", "reason": {"en": "Approvals are in hand across US/EU including the March 2026 acquired-HO expansion, but FDA narrowed the studied population and the label carries sexual-arousal, depression/suicidality and pigmentation warnings plus a severe-renal-impairment caveat.", "es": "Hay aprobaciones en EE. UU./UE, incluida la expansión de OH adquirida de marzo de 2026, pero la FDA acotó la población estudiada y la etiqueta lleva advertencias de excitación sexual, depresión/suicidio y pigmentación, además de una cautela por insuficiencia renal grave.", "source_ids": ["C-RYTM-1", "C-RYTM-2", "C-RYTM-3", "C-RYTM-5"]}}, {"dimension": "competitive_position", "rating": "FAIR", "reason": {"en": "No licensed acquired-HO competitor is documented and exenatide missed BMI in ECHO, but general-obesity efficacy cannot be transferred to rare HO and GLP-1 spillover into hypothalamic obesity is untested here.", "es": "No hay competidor autorizado en OH adquirida documentado y la exenatida fracasó en IMC en ECHO, pero la eficacia en obesidad general no puede transferirse a la OH rara y el derrame de GLP-1 en obesidad hipotalámica no está probado aquí.", "source_ids": ["RYTM-SUP-RIVAL", "RYTM-SUP-EPI"]}}, {"dimension": "valuation_attractiveness", "rating": "UNKNOWN", "reason": {"en": "A dated price (USD 90.78) and transparent market-cap/EV calculations (~USD 6.14–6.25bn on stated bases) exist, but with no forward earnings basis or forecast, attractiveness cannot be judged.", "es": "Existe un precio fechado (USD 90,78) y cálculos transparentes de capitalización/EV (~USD 6,14–6,25 mm en bases declaradas), pero sin base de beneficios futuros ni pronóstico, el atractivo no puede juzgarse.", "source_ids": ["RYTM-SUP-01", "RYTM-SUP-02", "RYTM-SUP-05"]}}, {"dimension": "catalyst_quality", "rating": "FAIR", "reason": {"en": "Bivamelagon registrational initiation is planned by year-end 2026 and RM-718 showed preliminary BMI reduction (11.6% at week 16, n=7, uncontrolled), but these are plans and small datasets; commercial adoption is the more grounded catalyst.", "es": "El inicio registracional de bivamelagon está previsto para finales de 2026 y RM-718 mostró reducción preliminar de IMC (11,6% en semana 16, n=7, no controlado), pero son planes y datos pequeños; la adopción comercial es el catalizador más sólido.", "source_ids": ["RYTM-SUP-04", "RYTM-SUP-PIPE"]}}], "unknowns": [{"en": "Patent validity, enforceability and freedom to operate, plus exact indication-to-exclusivity-code legal scope, are unestablished; an FDA listing does not prove a granted valid claim blocks a competitor.", "es": "La validez de patentes, ejecutabilidad y libertad de operación, más el alcance legal exacto de indicación a código de exclusividad, no están establecidos; un listado de la FDA no prueba que un reclamo válido otorgado bloquee a un competidor.", "source_ids": ["RYTM-SUP-OB", "RYTM-SUP-FDA-ZIP", "REG-RYTM-01"]}, {"en": "Prader-Willi pivotal efficacy and approval are unknown — only an uncontrolled n=18 Phase 2 interim exists — as are long-term comparative outcomes beyond TRANSCEND's 52 weeks.", "es": "La eficacia pivotal en Prader-Willi y su aprobación son desconocidas —solo existe un interino Fase 2 no controlado de n=18—, al igual que los resultados comparativos a largo plazo más allá de las 52 semanas de TRANSCEND.", "source_ids": ["C-RYTM-7", "C-RYTM-4"]}, {"en": "Same-day October cash, share count and fully diluted economic ownership cannot be reconstructed; the market cap and EV figures use mismatched dated inputs.", "es": "La caja de octubre al día, el número de acciones y la propiedad económica totalmente diluida no pueden reconstruirse; las cifras de capitalización y EV usan insumos fechados no coincidentes.", "source_ids": ["RYTM-SUP-01", "RYTM-SUP-02", "RYTM-SUP-05"]}, {"en": "Broker accessibility: Interactive Brokers publicly lists Costa Rica as an eligible country, but individual acceptance and exact orderability of this Nasdaq security remain unverified.", "es": "Accesibilidad de corredor: Interactive Brokers lista públicamente a Costa Rica como país elegible, pero la aceptación individual y la ordenabilidad exacta de este valor del Nasdaq siguen sin verificar.", "source_ids": ["RYTM-SUP-03"]}], "coverage_boundary": {"en": "Bounded packet covering commercial setmelanotide only: RM-718 (early peptide) was not separately mapped for IP/exclusivity, bivamelagon is an oral small molecule excluded from peptide clinical claims, and the failed 53,000-patient EMANATE estimate must not be treated as an established opportunity. No investment price target or probability is implied.", "es" lization rights from Novartis in 2018; Oczyesa launched in Germany in November 2025.", "es": "Camurus recuperó de Novartis en 2018 los derechos mundiales de CAM2029; Oczyesa se lanzó en Alemania en noviembre de 2025.", "source_ids": ["CAMX-NEW-08", "ID-CAMX-02"]}, "enforceability_and_FTO": {"en": "Google indexes the patent as active with adjusted expiry 2029-08-25 but disclaims legal-status accuracy; fee maintenance, enforceability and full FTO are unverified.", "es": "Google indexa la patente como activa con vencimiento ajustado 25-08-2029 pero niega exactitud del estatus legal; mantenimiento de tasas, exigibilidad y FTO completo no están verificados.", "source_ids": ["CAMX-NEW-10", "CAMX-NEW-09"]}}, {"drug": "CAM2056 (monthly semaglutide depot)", "molecule": {"en": "Semaglutide, a licensed GLP-1 peptide; Camurus contributes the depot formulation, not the molecule.", "es": "Semaglutida, un péptido GLP-1 con licencia; Camurus aporta la formulación de depósito, no la molécula.", "source_ids": ["CAMX-NEW-02"]}, "composition_of_matter": {"en": "None identified for Camurus; semaglutide composition rights sit with the originator, so protection would rest on formulation.", "es": "Ninguna identificada para Camurus; los derechos de composición de semaglutida corresponden al originador, por lo que la protección descansaría en la formulación.", "source_ids": ["CAMX-NEW-02"]}, "additional_protection": {"en": "FluidCrystal platform know-how; product-specific patent claims were not retrieved.", "es": "Know-how de la plataforma FluidCrystal; no se recuperaron reivindicaciones de patente específicas del producto.", "source_ids": ["ID-CAMX-01"]}, "regulatory_exclusivity": {"en": "None — phase 1b only; EU phase 2b authorized 2026-09-09 with recruitment pending, per a secondary registry mirror.", "es": "Ninguna — solo fase 1b; la fase 2b de la UE autorizada el 09-09-2026 con reclutamiento pendiente, según un espejo secundario de registro.", "source_ids": ["CAMX-NEW-02", "CAMX-STATUS-3"]}, "competitive_workarounds": {"en": "Weekly and oral incretins are established alternatives; the 10 mg regimen's -9.3% versus -5.2% for weekly semaglutide at day 85 comes from a small, short study that does not prove commercial differentiation.", "es": "Los incretinas semanales y orales son alternativas establecidas; el -9,3% del régimen de 10 mg frente a -5,2% de semaglutida semanal al día 85 proviene de un estudio pequeño y corto que no prueba diferenciación comercial.", "source_ids": ["CAMX-NEW-02"]}, "licensing_and_territory": {"en": "The separate Lilly FluidCrystal incretin collaboration covers up to four Lilly compounds with contingent payments; CAM2056-specific territorial constraints are not documented in retrieved evidence.", "es": "La colaboración separada con Lilly sobre incretinas FluidCrystal cubre hasta cuatro compuestos de Lilly con pagos contingentes; las restricciones territoriales específicas de CAM2056 no están documentadas en la evidencia recuperada.", "source_ids": ["CAMX-NEW-06"]}, "enforceability_and_FTO": {"en": "Complete semaglutide freedom-to-operate is explicitly unresolved; no enforceability conclusion is possible from retrieved sources.", "es": "La libertad de operación completa en semaglutida está explícitamente sin resolver; ninguna conclusión de exigibilidad es posible con las fuentes recuperadas.", "source_ids": ["CAMX-NEW-02"]}}, {"drug": "Buvidal / Brixadi (buprenorphine depot)", "molecule": {"en": "Buprenorphine, a non-peptide; this established commercial product sits outside the peptide universe.", "es": "Buprenorfina, no peptídica; este producto comercial consolidado queda fuera del universo de péptidos.", "source_ids": ["CAMX-NEW-07", "ID-CAMX-01"]}, "composition_of_matter": {"en": "Not retrieved; protection rests on the depot formulation and know-how rather than the molecule.", "es": "No recuperado; la protección descansa en la formulación de depósito y el know-how, no en la molécula.", "source_ids": ["CAMX-NEW-07"]}, "add {"en": "If US9974861B2 expires around its adjusted 2029-08-25 date, lapses for non-payment, or is narrowed or invalidated, competitors could copy or design around the octreotide FluidCrystal formulation.", "es": "Si US9974861B2 vence alrededor de su fecha ajustada 25-08-2029, caduca por falta de pago, o se reduce o invalida, los competidores podrían copiar o sortear la formulación FluidCrystal de octreótido.", "source_ids": ["CAMX-NEW-09", "CAMX-NEW-10"]}, "affected_drug_territory": {"en": "Oczyesa and CAM2029 in jurisdictions covered by the WO2008/152401 family (US, EP2173325B1, JP5557738B2, CN101842082B); CAM2056 faces separate unresolved semaglutide FTO.", "es": "Oczyesa y CAM2029 en jurisdicciones de la familia WO2008/152401 (US, EP2173325B1, JP5557738B2, CN101842082B); CAM2056 enfrenta un FTO de semaglutida separado y sin resolver.", "source_ids": ["CAMX-NEW-10"]}, "economic_consequence": {"en": "Loss of formulation exclusivity would expose the acromegaly depot franchise to copies and workarounds, including the authorized oral paltusotine, eroding royalty-like economics on owned products.", "es": "La pérdida de exclusividad de formulación expondría la franquicia de depósitos en acromegalia a copias y alternativas, incluida la paltusotina oral autorizada, erosionando la economía de los productos propios.", "source_ids": ["CAMX-NEW-11", "CAMX-NEW-10"]}, "timing_and_indicators": {"en": "Indicators are maintenance-fee lapses, litigation or opposition filings, and the 2029-08-25 adjusted expiry; the patent already carries a 438-day term adjustment subject to disclaimer.", "es": "Los indicadores son lapsos de mantenimiento, litigios u oposiciones, y el vencimiento ajustado 25-08-2029; la patente ya lleva un ajuste de plazo de 438 días sujeto a disclaimer.", "source_ids": ["CAMX-NEW-09", "CAMX-NEW-10"]}, "mitigation_or_counterevidence": {"en": "The granted US document verified assignment to Camurus and specific formulation claims; Google lists it as active with the 2029-08-25 adjusted expiry, but this is a secondary database that disclaims legal-status accuracy.", "es": "El documento otorgado en EE. UU. verificó la asignación a Camurus y reivindicaciones específicas de formulación; Google lo lista como activo con vencimiento ajustado 25-08-2029, pero es una base secundaria que niega exactitud del estatus legal.", "source_ids": ["CAMX-NEW-09", "CAMX-NEW-10"]}}], "ratings": [{"dimension": "clinical_evidence", "rating": "FAIR", "reason": {"en": "Oczyesa has official EU approval with ~72% versus ~38% IGF-1 normalization in a 72-patient maintenance trial, but CAM2056 rests on one small, short phase 1b and key late-stage readouts are pending.", "es": "Oczyesa tiene aprobación oficial en la UE con ~72% frente a ~38% de normalización de IGF-1 en un estudio de mantenimiento de 72 pacientes, pero CAM2056 descansa en una fase 1b pequeña y corta, y lecturas clave de fases tardías están pendientes.", "source_ids": ["CAMX-NEW-01", "CAMX-NEW-02", "CAMX-NEW-05"]}}, {"dimension": "ip_economic_defensibility", "rating": "MIDDLING", "reason": {"en": "A granted formulation patent runs to an adjusted 2029-08-25 per a secondary index, but it is formulation-only, enforceability and maintenance are unverified, and semaglutide FTO is unresolved.", "es": "Una patente de formulación otorgada corre hasta el 25-08-2029 ajustado según un índice secundario, pero es solo de formulación, la exigibilidad y el mantenimiento no están verificados y el FTO de semaglutida está sin resolver.", "source_ids": ["CAMX-NEW-09", "CAMX-NEW-10"]}}, {"dimension": "financial_strength", "rating": "GOOD", "reason": {"en": "SEK 4,068.607m cash at 2026-06-30, SEK 460.903m H1 operating profit and positive after-working-capital cash flow with no financial borrowings line — though October balances are unknown.", "es": "SEK 4.068,607m de caja al 30-06-2026, SEK 460,903mn de beneficio operativo en 1S y flujo de caja positivo tras capital circulante sin línea de deuda financiera — aunque los saldos de octubre son desconocidos.", "source_ids": ["CAMX-NEW-03"]}}, {"dimension": "regulatory_exposure", "rating": "FAIR", "reason": {"en": "The June 2026 cGMP-driven CRL was followed by an accepted resubmission with a 2026-12-18 target, but acceptance is not approval and the FDA's own conclusions are not public.", "es": "La CRL de junio 2026 por cGMP fue seguida por una re-presentación aceptada con objetivo 18-12-2026, pero la aceptación no es aprobación y las conclusiones de la FDA no son públicas.", "source_ids": ["CAMX-NEW-04"]}}, {"dimension": "competitive_position", "rating": "MIDDLING", "reason": {"en": "The depot offers trained self-administration, but oral paltusotine was EU-authorized in April 2026, and different trial designs forbid cross-trial superiority claims.", "es": "El depósito ofrece autoadministración capacitada, pero la paltusotina oral fue autorizada en la UE en abril de 2026, y los distintos diseños de estudio prohíben afirmaciones de superioridad entre estudios.", "source_ids": ["CAMX-NEW-01", "CAMX-NEW-11"]}}, {"dimension": "valuation_attractiveness", "rating": "UNKNOWN", "reason": {"en": "A mixed-dates calculation yields ~SEK 38.1bn equity and ~SEK 34.2bn lease-inclusive EV, but no forecast basis or comparable exists in the evidence to judge attractiveness.", "es": "Un cálculo con fechas mixtas da ~SEK 38.100mn de capital y ~SEK 34.200mn de EV con arrendamientos, pero no existe base de pronóstico ni comparable en la evidencia para juzgar el atractivo.", "source_ids": ["CAMX-NEW-03", "CAMX-NEW-13", "CAMX-NEW-16"]}}, {"dimension": "catalyst_quality", "rating": "FAIR", "reason": {"en": "Dated near-term events exist — FDA action targeted 2026-12-18 and the SORENTO event threshold in Q4 2026 — but each is binary, sponsor-forecast, and the phase 2b start is not yet confirmed.", "es": "Existen eventos cercanos con fecha — acción de la FDA prevista 18-12-2026 y umbral de eventos de SORENTO en T4 2026 — pero cada uno es binario, pronóstico del patrocinador, y el inicio de la fase 2b aún no está confirmado.", "source_ids": ["CAMX-NEW-04", "CAMX-NEW-05", "CAMX-STATUS-3"]}}], "unknowns": [{"en": "October 2026 balance sheet and fully diluted share count are unavailable; June 2026 inputs are used only as approximations with an October 9 price.", "es": "El balance de octubre 2026 y el recuento totalmente diluido no están disponibles; los datos de junio 2026 se usan solo como aproximaciones con el precio del 9 de octubre.", "source_ids": ["CAMX-NEW-03", "CAMX-NEW-16"]}, {"en": "The actual FDA CRL letter and the latest inspection outcome for CAM2029 were not publicly obtained; only the sponsor's characterization exists.", "es": "La carta real de CRL de la FDA y el resultado más reciente de inspección para CAM2029 no se obtuvieron públicamente; solo existe la caracterización del patrocinador.", "source_ids": ["CAMX-NEW-04"]}, {"en": "CAM2056 phase 2b initiation is unconfirmed: the registry mirror shows authorization on 2026-09-09 with recruitment pending, and no primary first-patient announcement exists.", "es": "El inicio de la fase 2b de CAM2056 no está confirmado: el espejo de registro muestra autorización el 09-09-2026 con reclutamiento pendiente, y no existe anuncio primario de primeros pacientes.", "source_ids": ["CAMX-STATUS-1", "CAMX-STATUS-2", "CAMX-STATUS-3"]}, {"en": "Patent fee-maintenance status, enforceability, and complete CAM2056 semaglutide freedom-to-operate remain unverified; the secondary legal-status index disclaims accuracy.", "es": "El estado de mantenimiento de tasas, la exigibilidad de la patente y la libertad de operación completa en semaglutida para CAM2056 siguen sin verificar; el índice secundario de estatus legal niega exactitud.", "source_ids": ["CAMX-NEW-09", "CAMX-NEW-10"]}, {"en": "Whether the investor's specific broker account can buy this exact CAMX security is unverified; only country support and historical venue listings were found.", "es": "Si la cuenta específica del inversor puede comprar esta acción exacta CAMX no está verificado; solo se hallaron soporte por país y listados históricos de venues.", "source_ids": ["CAMX-NEW-14", "CAMX-NEW-15"]}], "coverage_boundary": {"en": "Evidence runs to the 2026-10-11 cutoff from company filings and releases, EMA documents, a patent grant and secondary index, a secondary historical price table, and broker reference pages, mostly as selected paraphrased extracts rather than full snapshots; no broker-specific trading eligibility, live quote, or enforceability opinion was established, and identity and eligibility remain provisional.", "es": "La evidencia llega al corte del 11-10-2026 desde informes y comunicados de la compañía, documentos de la EMA, una patente otorgada y un índice secundario, una tabla secundaria de precios históricos y páginas de referencia de brókeres, mayormente como extractos parafraseados seleccionados y no instantáneas completas; no se estableció elegibilidad específica de bróker, cotización en vivo ni opinión de exigibilidad, y la identidad y elegibilidad siguen siendo provisionales.", "source_ids": ["CAMX-NEW-13", "CAMX-NEW-14", "CAMX-NEW-15", "ID-CAMX-01", "ID-CAMX-02"]}}, {"ticker": "1276", "company": "Jiangsu Hengrui Pharmaceuticals Co., Ltd.", "class": "established_commercial_pharma", "cutoff": "2026-10-11", "regulatory_chips": [], "card": {"what_you_buy": {"en": "You buy Hengrui's H share (1276, HKD), a profitable diversified Chinese pharma whose lead peptide ribupatide (HRS9531, GLP-1/GIP) achieved 17.7% treatment-policy weight loss at 6 mg over 48 weeks in the phase 3 GEMINI-1 trial (n=567, China, no head-to-head with tirzepatide/semaglutide), with the China obesity NDA accepted September 2025 and still pending as of July 2026; it is not yet approved.", "es": "Usted compra la acción H de Hengrui (1276, HKD), una farmacéutica china diversificada y rentable cuyo péptido principal ribupatida (HRS9531, GLP-1/GIP) logró una pérdida de peso de 17,7% con criterio de tratamiento a 6 mg en 48 semanas en el ensayo de fase 3 GEMINI-1 (n=567, China, sin comparación directa con tirzepatida/semaglutida), con la NDA de obesidad en China aceptada en septiembre de 2025 y aún pendiente a julio de 2026; aún no está aprobada.", "source_ids": ["1276-NEW-01", "1276-NEW-02", "1276-NEW-03", "ID-1276-01"]}, "why_it_could_work": {"en": "Hengrui retains Greater China rights to ribupatide while Kailera develops ex-Greater China, so approved China sales plus milestones and royalties (up to USD5.725bn commercial milestones plus tiered royalties from Kailera, USD300m upfront from Novo for HRS1596) could add durable value on top of an already profitable base; the main dependency is China approval and reimbursement, neither of which is assured.", "es": "Hengrui conserva los derechos de ribupatida en la Gran China mientras Kailera la desarrolla fuera, por lo que las ventas aprobadas en China más hitos y regalías (hasta USD5.725 millones en hitos comerciales y regalías escalonadas de Kailera, USD300 millones por adelantado de Novo por HRS1596) podrían añadir valor duradero sobre una base ya rentable; la dependencia principal es la aprobación y el reembolso en China, nada de ello garantizado.", "source_ids": ["ID-1276-02", "1276-NEW-12", "1276-NEW-13", "1276-NEW-06"]}, "what_can_kill_it": {"en": "Established facts: the NDA is pending, not approved, and competition already exists (approved mazdutide and ecnoglutide in China). Conditional scenarios: regulatory rejection or restrictive label, failure of the global phase 3 versus semaglutide (readout estimated 2028), loss or non-enforceability of the compound patent family, or the discovery that peptide economics are immaterial within the diversified group.", "es": "Hechos establecidos: la NDA está pendiente, no aprobada, y ya existe competencia (mazdutida y ecnoglutida aprobadas en China). Escenarios condicionales: rechazo regulatorio o etiqueta restrictiva, fracaso de la fase 3 global frente a semaglutida (lectura estimada 2028), pérdida o inaplicabilidad de la familia de patentes de la molécula, o descubrir que la economía del péptido es inmaterial dentro del grupo diversificado.", "source_ids": ["1276-NEW-03", "1276-NEW-18", "1276-NEW-17", "1276-REG-NCT07284979", "1276-NEW-14", "1276-NEW-15"]}, "financial_strength": {"en": "H1 2026 revenue was RMB15,455.584m with owners' profit RMB4,465.439m and cash equivalents of RMB38,031.524m at June 30, with no outstanding bank borrowing line disclosed, so funding risk for the pipeline is low.", "es": "Los ingresos del S1 2026 fueron de RMB15.455,584 millones con beneficio atribuible de RMB4.465,439 millones y equivalentes de efectivo de RMB38.031,524 millones al 30 de junio, sin línea de préstamos bancarios pendiente divulgada, por lo que el riesgo de financiación del pipeline es bajo.", "source_ids": ["1276-NEW-07"]}, "valuation": {"en": "Class-specific basic equity value derives to roughly CNY308.93bn (A shares at CNY46.85, H shares at HKD48.00 on 2026-10-09, at central parity 0.85798), or about CNY270.96bn adjusted for June cash and leases; whether that is attractive given pipeline contribution is unknown because standalone peptide economics are not quantified.", "es": "El valor patrimonial básico por clase deriva en unos CNY308.930 millones (acciones A a CNY46,85, acciones H a HKD48,00 el 09-10-2026, a la paridad central 0,85798), o unos CNY270.960 millones ajustado por efectivo y arrendamientos de junio; si eso es atractivo dado la contribución del pipeline es desconocido porque la economía del péptido no está cuantificada.", "source_ids": ["1276-NEW-08", "1276-NEW-09", "1276-NEW-10", "1276-NEW-11", "1276-NEW-07"]}, "next_catalyst": {"en": "The issuer expects potential China approval of injectable ribupatide for obesity in early 2027 (sponsor forecast, not assured); later indicators include higher-dose phase 2 results mid-2027 and the global phase 3 versus semaglutide, with estimated primary completion March 2028.", "es": "El emisor espera una posible aprobación en China de ribupatida inyectable para obesidad a principios de 2027 (pronóstico del patrocinador, no garantizado); indicadores posteriores incluyen resultados de fase 2 de dosis altas a mediados de 2027 y la fase 3 global frente a semaglutida, con finalización primaria estimada en marzo de 2028.", "source_ids": ["1276-NEW-06", "1276-REG-NCT07284979"]}}, "valuation_inputs": [{"label": {"en": "H share (1276) closing price", "es": "Precio de cierre de la acción H (1276)"}, "value": 48.0, "unit": "HKD", "as_of": "2026-10-09", "source_ids": ["1276-NEW-10", "1276-NEW-09"], "unknown_reason": null}, {"label": {"en": "A share (600276) quoted price; distinct trading line, not interchangeable with the H share", "es": "Precio cotizado de la acción A (600276); línea de negociación distinta, no intercambiable con la acción H"}, "value": 46.85, "unit": "CNY", "as_of": "2026-10-09", "source_ids": ["1276-NEW-09"], "unknown_reason": null}, {"label": {"en": "H shares outstanding (zero treasury)", "es": "Acciones H en circulación (sin autocartera)"}, "value": 258197600, "unit": "shares", "as_of": "2026-09-30", "source_ids": ["1276-NEW-08"], "unknown_reason": null}, {"label": {"en": "A shares outstanding excluding 12,016,250 treasury shares", "es": "Acciones A en circulación excluyendo 12.016.250 autocarterizadas"}, "value": 6366986024, "unit": "shares", "as_of": "2026-09-30", "source_ids": ["1276-NEW-08"], "unknown_reason": null}, {"label": {"en": "Combined A+H shares excluding treasury; basic issued, not fully diluted", "es": "Acciones A+H combinadas excluyendo autocartera; básicas emitidas, no totalmente diluidas"}, "value": 6625183624, "unit": "shares", "as_of": "2026-09-30", "source_ids": ["1276-NEW-08"], "unknown_reason": null}, {"label": {"en": "FX central parity used for conversion", "es": "Paridad central de divisa usada para conversión"}, "value": 0.85798, "unit": "CNY per HKD", "as_of": "2026-10-09", "source_ids": ["1276-NEW-11"], "unknown_reason": null}, {"label": {"en": "Derived combined basic equity value (A CNY298.29bn + H HKD12.39bn converted); simplified bridge, not definitive", "es": "Valor patrimonial básico combinado derivado (A CNY298.290M + H HKD12.390M convertidos); puente simplificado, no definitivo"}, "value": 308926657313.1, "unit": "CNY", "as_of": "prices 2026-10-09; shares 2026-09-30", "source_ids": ["1276-NEW-07", "1276-NEW-08", "1276-NEW-09", "1276-NEW-10", "1276-NEW-11"], "unknown_reason": null}, {"label": {"en": "Derived cash-and-lease-adjusted value: combined equity minus June cash equivalents 38,031.524m plus June leases 67.984m; excludes NCI, other investments and post-June changes", "es": "Valor ajustado por efectivo y arrendamientos: patrimonio combinado menos equivalentes de efectivo de junio 38.031,524M más arrendamientos 67,984M; excluye participaciones minoritarias, otras inversiones y cambios posteriores a junio"}, "value": 270963117313.1, "unit": "CNY", "as_of": "prices 2026-10-09; balance sheet 2026-06-30", "source_ids": ["1276-NEW-07", "1276-NEW-08", "1276-NEW-09", "1276-NEW-10", "1276-NEW-11"], "unknown_reason": null}, {"label": {"en": "Cash equivalents at June 30 (plus interest receivable 690.109m = 38,721.633m bank/cash); June accounts, not October cash", "es": "Equivalentes de efectivo al 30 de junio (más intereses a recibir 690,109M = 38.721,633M banco/efectivo); cuentas de junio, no efectivo de octubre"}, "value": 38031.524, "unit": "RMB million", "as_of": "2026-06-30", "source_ids": ["1276-NEW-07"], "unknown_reason": null}, {"label": {"en": "H1 revenue including licensing 1,422.302m; innovative drug revenue 8,809.344m", "es": "Ingresos del S1 incluidos 1.422,302M por licencias; ingresos de fármacos innovadores 8.809,344M"}, "value": 15455.584, "unit": "RMB million", "as_of": "H1 2026", "source_ids": ["1276-NEW-07"], "unknown_reason": null}, {"label": {"en": "Profit attributable to owners; includes RMB821m Kailera fair-value gain; May BMS upfront not recognized as H1 revenue", "es": "Beneficio atribuible a los propietarios; incluye ganancia de valor razonable de Kailera de RMB821M; el adelanto de BMS de mayo no reconocido como ingreso del S1"}, "value": 4465.439, "unit": "RMB million", "as_of": "H1 2026", "source_ids": ["1276-NEW-07", "1276-NEW-06"], "unknown_reason": null}, {"label": {"en": "Operating cashflow generated; prior-period licensing receipts affect the comparison with 4,300.453m", "es": "Flujo de caja operativo generado; los cobros de licencias del período previo afectan la comparación con 4.300,453M"}, "value": 1987.004, "unit": "RMB million", "as_of": "H1 2026", "source_ids": ["1276-NEW-07"], "unknown_reason": null}, {"label": {"en": "Separately reported outstanding bank borrowings at June 30 (none shown; leases separately disclosed)", "es": "Préstamos bancarios pendientes declarados por separado al 30 de junio (ninguno; arrendamientos por separado)"}, "value": 0, "unit": "RMB million", "as_of": "2026-06-30", "source_ids": ["1276-NEW-07"], "unknown_reason": null}], "defensibility": [{"drug": "HRS9531 / ribupatide (injectable and oral GLP-1/GIP dual agonist peptide)", "molecule": {"en": "Chemically synthesized GLP-1/GIP dual agonist polypeptide, discovered by Hengrui; half-life 7–8 days in first-in-human testing (n=90).", "es": "Polipéptido agonista dual GLP-1/GIP sintetizado químicamente, descubierto por Hengrui; vida media de 7–8 días en primera administración en humanos (n=90).", "source_ids": ["1276-NEW-05"]}, "composition_of_matter": {"en": "Patent family WO2021239082A1 (PCT filed 2021-05-28, earliest priority 2020-05-29) includes US patent 12,653,865 granted 2026-06-16 to Jiangsu Hengrui; it protects specified modified GLP-1 polypeptide structures, not all GLP-1/GIP biology. Issuer states six ribupatide patent families with expected statutory compound expiry 2041 (sponsor disclosure, not legal opinion).", "es": "La familia de patentes WO2021239082A1 (PCT presentada 28-05-2021, prioridad más antigua 29-05-2020) incluye la patente estadounidense 12.653.865 concedida el 16-06-2026 a Jiangsu Hengrui; protege estructuras específicas de polipéptidos GLP-1 modificados, no toda la biología GLP-1/GIP. El emisor indica seis familias de patentes de ribupatida con caducidad de compuesto esperada en 2041 (divulgación del patrocinador, no dictamen legal).", "source_ids": ["1276-NEW-14", "1276-NEW-15", "1276-NEW-12"]}, "additional_protection": {"en": "Patent families reportedly cover compound, formulation and use; this is sponsor portfolio disclosure, and the mapping of the commercial sequence to granted claims is unverified.", "es": "Las familias de patentes cubrirían compuesto, formulación y uso; esto es divulgación del portafolio del patrocinador, y el mapeo de la secuencia comercial a las reivindicaciones concedidas no está verificado.", "source_ids": ["1276-NEW-12"]}, "regulatory_exclusivity": {"en": "China obesity NDA accepted September 2025, pending as of the July 2026 release; no regulatory exclusivity period is documented in the retrieved evidence.", "es": "NDA de obesidad en China aceptada en septiembre de 2025, pendiente según la publicación de julio de 2026; el período de exclusividad regulatoria no está documentado en la evidencia recuperada.", "source_ids": ["1276-NEW-03"]}, "competitive_workarounds": {"en": "Competitors already exist: mazdutide (approved GLP-1/glucagon, June 2025) and ecnoglutide (approved 2026-03); label and mechanism differences preclude simple cross-trial ranking, and rivals can design around the specific claimed structures.", "es": "Ya existen competidores: mazdutida (GLP-1/glucagón aprobada, junio 2025) y ecnoglutida (aprobada 06-03-2026); las diferencias de etiqueta y mecanismo impiden una clasificación simple entre ensayos, y los rivales pueden diseñar alrededor de las estructuras reivindicadas específicas.", "source_ids": ["1276-NEW-18", "1276-NEW-17", "1276-NEW-14"]}, "licensing_and_territory": {"en": "May 15, 2024 license gives Kailera exclusive ex-Greater China rights; Hengrui retains Greater China and receives USD100m upfront plus USD10m transfer, 5,677,603 Kailera preferred shares (valued USD96.4m at issuance), up to USD200m clinical/regulatory and USD5.725bn commercial milestones, and tiered royalties from mid-single-digit to low-tens percent; Kailera funds overseas development.", "es": "La licencia del 15 de mayo de 2024 otorga a Kailera derechos exclusivos fuera de la Gran China; Hengrui conserva la Gran China y recibe USD100M por adelantado más USD10M de transferencia, 5.677.603 acciones preferentes de Kailera (valoradas en USD96,4M a la emisión), hasta USD200M en hitos clínicos/regulatorios y USD5.725M en hitos comerciales, y regalías escalonadas de un dígito medio a decenas bajas por ciento; Kailera financia el desarrollo en el extranjero.", "source_ids": ["1276-NEW-12", "ID-1276-02"]}, "enforceability_and_FTO": {"en": "Unknown: Google legal-status data is expressly not authoritative, and live national maintenance/assignment records plus the exact commercial sequence-to-claim chart remain unverified; freedom to operate has not been established.", "es": "Desconocido: los datos de estado legal de Google no son autoritativos expresamente, y los registros nacionales vigentes de mantenimiento/cesión y el cuadro exacto de secuencia comercial a reivindicaciones siguen sin verificar; la libertad de operación no ha sido establecida.", "source_ids": ["1276-NEW-14", "1276-NEW-15"]}}, {"drug": "HRS-7535 (oral small-molecule GLP-1 agonist, non-peptide)", "molecule": {"en": "Oral small-molecule GLP-1 agonist, distinct from the peptides; global phase 2 began April 2026 with results expected 2027 (sponsor forecast).", "es": "Agonista oral de GLP-1 de molécula pequeña, distinto de los péptidos; la fase 2 global comenzó en abril de 2026 con resultados esperados en 2027 (pronóstico del patrocinador).", "source_ids": ["1276-NEW-06"]}, "composition_of_matter": {"en": "Unknown: no retrieved evidence identifies the compound patent family for HRS-7535.", "es": "Desconocido: ninguna evidencia recuperada identifica la familia de patentes del compuesto de HRS-7535.", "source_ids": ["1276-NEW-06"]}, "additional_protection": {"en": "Unknown: no retrieved evidence on formulation, use or know-how protection for HRS-7535.", "es": "Desconocido: ninguna evidencia recuperada sobre protección de formulación, uso o know-how para HRS-7535.", "source_ids": ["1276-NEW-06"]}, "regulatory_exclusivity": {"en": "Unknown: no approval or filing status for HRS-7535 is documented in the retrieved evidence.", "es": "Desconocido: no hay estado de aprobación o presentación de HRS-7535 documentado en la evidencia recuperada.", "source_ids": ["1276-NEW-06"]}, "competitive_workarounds": {"en": "Oral GLP-1 competition is expected from multiple sponsors, but no specific HRS-7535 competitive comparison exists in the retrieved evidence.", "es": "Se espera competencia oral de GLP-1 de múltiples patrocinadores, pero no existe una comparación competitiva específica de HRS-7535 en la evidencia recuperada.", "source_ids": ["1276-NEW-06"]}, "licensing_and_territory": {"en": "Licensed to Kailera ex-Greater China as KAI7535 under the May 2024 agreement; economics are analogous to ribupatide per the same license terms.", "es": "Licenciado a Kailera fuera de la Gran China como KAI7535 bajo el acuerdo de mayo de 2024; la economía es análoga a la de ribupatida según los mismos términos de licencia.", "source_ids": ["1276-NEW-12"]}, "enforceability_and_FTO": {"en": "Unknown: no patent or freedom-to-operate evidence for HRS-7535 was retrieved.", "es": "Desconocido: no se recuperó evidencia de patentes ni de libertad de operación para HRS-7535.", "source_ids": ["1276-NEW-06"]}}], "institutional_risk": [], "scenarios": [{"type": "bear", "assumption": {"en": "If China regulators reject or materially restrict the ribupatide obesity NDA, or the global phase 3 fails to beat semaglutide.", "es": "Si los reguladores chinos rechazan o restringen materialmente la NDA de obesidad de ribupatida, o la fase 3 global no supera a la semaglutida.", "source_ids": ["1276-NEW-03", "1276-REG-NCT07284979"]}, "trigger": {"en": "An NDA rejection or approval delay beyond the issuer's early-2027 expectation, or negative head-to-head global results.", "es": "Un rechazo de la NDA o un retraso de aprobación más allá de la expectativa de principios de 2027 del emisor, o resultados globales desfavorables de comparación directa.", "source_ids": ["1276-NEW-06", "1276-REG-NCT07284979"]}, "affected_drug_territory": {"en": "Ribupatide in Greater China primarily; ex-Greater China value via Kailera and HRS1596/Novo would also be repriced.", "es": "Ribupatida principalmente en la Gran China; el valor fuera de la Gran China vía Kailera y HRS1596/Novo también se reevaluaría.", "source_ids": ["1276-NEW-12", "1276-NEW-13"]}, "economic_consequence": {"en": "Obesity-pipeline contribution to the CNY308.93bn derived equity value would be impaired; the profitable base business (H1 revenue RMB15,455.584m) would limit but not eliminate the loss.", "es": "La contribución del pipeline de obesidad al valor patrimonial derivado de CNY308.930 millones se vería afectada; el negocio base rentable (ingresos del S1 de RMB15.455,584M) limitaría pero no eliminaría la pérdida.", "source_ids": ["1276-NEW-07", "1276-NEW-08", "1276-NEW-09", "1276-NEW-11"]}, "timing_and_indicators": {"en": "Watch NDA review status through 2026–2027, any CHNPA inspection issues, and the global trial's estimated primary completion in March 2028.", "es": "Vigilar el estado de revisión de la NDA durante 2026–2027, cualquier problema de inspección, y la finalización primaria estimada del ensayo global en marzo de 2028.", "source_ids": ["1276-REG-NCT07284979", "1276-NEW-06"]}}, {"type": "base", "assumption": {"en": "If the obesity NDA is approved in early 2027 as the issuer expects, at a commercially viable price with reimbursement following later.", "es": "Si la NDA de obesidad se aprueba a principios de 2027 como espera el emisor, a un precio comercialmente viable con reembolso posterior.", "source_ids": ["1276-NEW-06"]}, "trigger": {"en": "China approval announcement and subsequent pricing/reimbursement decisions.", "es": "Anuncio de aprobación en China y decisiones posteriores de precio/reembolso.", "source_ids": ["1276-NEW-03"]}, "affected_drug_territory": {"en": "Injectable ribupatide, Greater China obesity indication.", "es": "Ribupatida inyectable, indicación de obesidad en la Gran China.", "source_ids": ["1276-NEW-03"]}, "economic_consequence": {"en": "New product revenue within a group already earning RMB4,465.439m owners' profit in H1; magnitude depends on China GLP-1 pricing competition against approved mazdutide and ecnoglutide.", "es": "Nuevos ingresos de producto dentro de un grupo que ya ganó RMB4.465,439M de beneficio atribuible en el S1; la magnitud depende de la competencia de precios de GLP-1 en China frente a mazdutida y ecnoglutida aprobadas.", "source_ids": ["1276-NEW-07", "1276-NEW-18", "1276-NEW-17"]}, "timing_and_indicators": {"en": "NDA outcome expected around early 2027 per the issuer; indicators are approval announcements, launch pricing and reimbursement listings.", "es": "Se espera un resultado de la NDA alrededor de principios de 2027 según el emisor; los indicadores son anuncios de aprobación, precios de lanzamiento y inclusión en reembolso.", "source_ids": ["1276-NEW-06"]}}, {"type": "bull", "assumption": {"en": "If China approval arrives, oral ribupatide phase 3 succeeds, and the global head-to-head versus semaglutide (estimated primary completion March 2028) shows competitive efficacy, ex-Greater China milestones and royalties plus additional licensing (like the USD300m Novo HRS1596 upfront) could compound.", "es": "Si llega la aprobación en China, la fase 3 de ribupatida oral tiene éxito y la comparación global frente a semaglutida (finalización primaria estimada marzo 2028) muestra eficacia competitiva, los hitos y regalías fuera de la Gran China más licencias adicionales (como el adelanto de USD300M de Novo por HRS1596) podrían acumularse.", "source_ids": ["1276-NEW-06", "1276-REG-NCT07284979", "1276-NEW-13"]}, "trigger": {"en": "Approvals, positive global phase 3 data, and new ex-Greater China licensing deals with disclosed upfronts.", "es": "Aprobaciones, datos globales positivos de fase 3, y nuevos acuerdos de licencia fuera de la Gran China con adelantos divulgados.", "source_ids": ["1276-NEW-06", "1276-REG-NCT07284979", "1276-NEW-13"]}, "affected_drug_territory": {"en": "Ribupatide globally (via Kailera), HRS-7535, HRS4729 and HRS1596 ex-Greater China.", "es": "Ribupatida globalmente (vía Kailera), HRS-7535, HRS4729 y HRS1596 fuera de la Gran China.", "source_ids": ["1276-NEW-12", "1276-NEW-13", "1276-NEW-06"]}, "economic_consequence": {"en": "Milestone income up to USD5.725bn commercial plus royalties from Kailera, further Novo-type deals, and China sales would raise group earnings, but no quantified upside value is supported by the evidence.", "es": "Ingresos por hitos de hasta USD5.725M comerciales más regalías de Kailera, más acuerdos tipo Novo y ventas en China elevarían las ganancias del grupo, pero ninguna cifra de potencial alcista está respaldada por la evidencia.", "source_ids": ["1276-NEW-12", "1276-NEW-13"]}, "timing_and_indicators": {"en": "Higher-dose phase 2 results mid-2027, oral phase 3 global start planned H1 2027, global phase 3 results 2028; all are sponsor forecasts.", "es": "Resultados de fase 2 de dosis altas a mediados de 2027, inicio global de fase 3 oral planificado para el S1 de 2027, resultados globales de fase 3 en 2028; todos son pronósticos del patrocinador.", "source_ids": ["1276-NEW-06"]}}], "risk_scenarios": [{"kind": "regulatory_downside", "trigger": {"en": "If the pending China obesity NDA is rejected, delayed, or approved with a restrictive label, or if the T2D filing planned on the 302 results fails.", "es": "Si la NDA de obesidad pendiente en China es rechazada, retrasada o aprobada con etiqueta restrictiva, o si la presentación de DT2 planificada sobre los resultados del 302 fracasa.", "source_ids": ["1276-NEW-03", "1276-NEW-06"]}, "affected_drug_territory": {"en": "Injectable and oral ribupatide in Greater China; Kailera's ex-Greater China programs depend on the same safety/efficacy database.", "es": "Ribupatida inyectable y oral en la Gran China; los programas de Kailera fuera de la Gran China dependen de la misma base de seguridad/eficacia.", "source_ids": ["1276-NEW-12", "1276-NEW-03"]}, "economic_consequence": {"en": "Loss or deferral of the early-2027 launch revenue the issuer anticipates and pressure on pipeline-linked value, while the diversified profitable base (H1 revenue RMB15,455.584m) continues.", "es": "Pérdida o aplazamiento de los ingresos de lanzamiento de principios de 2027 que el emisor anticipa y presión sobre el valor vinculado al pipeline, mientras la base diversificada rentable (ingresos del S1 de RMB15.455,584M) continúa.", "source_ids": ["1276-NEW-06", "1276-NEW-07"]}, "timing_and_indicators": {"en": "NDA under review since September 2025 acceptance; indicators are review-extension notices, inspection findings, or approval absent by the issuer's early-2027 window.", "es": "NDA en revisión desde la aceptación en septiembre de 2025; los indicadores son avisos de extensión de revisión, hallazgos de inspección, o ausencia de aprobación en la ventana de principios de 2027 del emisor.", "source_ids": ["1276-NEW-03", "1276-NEW-06"]}, "mitigation_or_counterevidence": {"en": "GEMINI-1 showed 17.7% treatment-policy weight loss with manageable discontinuation (1.4%) and the T2D 302 trial met HbA1c endpoints, supporting the filings; but submission is not approval.", "es": "GEMINI-1 mostró una pérdida de peso de 17,7% con criterio de tratamiento con discontinuación manejable (1,4%) y el ensayo 302 de DT2 cumplió los objetivos de HbA1c, apoyando las presentaciones; pero la presentación no es aprobación.", "source_ids": ["1276-NEW-01", "1276-NEW-03", "1276-NEW-02"]}}, {"kind": "ip_loss", "trigger": {"en": "If the granted US patent 12,653,865 or the family WO2021239082A1 is invalidated, lapses for non-payment, or is found not to cover the commercial ribupatide sequence.", "es": "Si la patente estadounidense concedida 12.653.865 o la familia WO2021239082A1 es invalidada, caduca por falta de pago, o se determina que no cubre la secuencia comercial de ribupatida.", "source_ids": ["1276-NEW-15", "1276-NEW-14"]}, "affected_drug_territory": {"en": "Ribupatide in the US and other family jurisdictions; Greater China and ex-Greater China economics under the Kailera license would both be affected.", "es": "Ribupatida en EE. UU. y otras jurisdicciones de la familia; la economía en la Gran China y fuera de ella bajo la licencia de Kailera se vería afectada.", "source_ids": ["1276-NEW-12"]}, "economic_consequence": {"en": "Loss of composition-of-matter protection would expose the 2041 expected expiry to generic/biosimilar entry and undermine royalty terms in the Kailera and Novo agreements.", "es": "La pérdida de protección de composición de la molécula expondría la caducidad esperada de 2041 a la entrada de genéricos/biosimilares y socavaría los términos de regalías en los acuerdos de Kailera y Novo.", "source_ids": ["1276-NEW-12", "1276-NEW-13"]}, "timing_and_indicators": {"en": "Indicators would be opposition or litigation filings against the US grant or national-phase members, or a claim-chart gap between the marketed sequence and the granted claims.", "es": "Los indicadores serían presentaciones de oposición o litigios contra la concesión estadounidense o los miembros de la fase nacional, o una brecha en el cuadro de reivindicaciones entre la secuencia comercializada y las reivindicaciones concedidas.", "source_ids": ["1276-NEW-15", "1276-NEW-14"]}, "mitigation_or_counterevidence": {"en": "A US grant exists in the family (June 2026, assignee Jiangsu Hengrui) and the issuer discloses six patent families with expected compound expiry 2041; but Google legal-status data is expressly not authoritative and enforceability/FTO remain unverified.", "es": "Existe una concesión estadounidense en la familia (junio de 2026, titular Jiangsu Hengrui) y el emisor divulga seis familias de patentes con caducidad de compuesto esperada en 2041; pero los datos de estado legal de Google no son autoritativos expresamente y la aplicabilidad/FTO siguen sin verificar.", "source_ids": ["1276-NEW-15", "1276-NEW-12", "1276-NEW-14"]}}], "ratings": [{"dimension": "clinical_evidence", "rating": "GOOD", "reason": {"en": "Two China phase 3 readouts (GEMINI-1 obesity, 302 T2D) show strong placebo-controlled efficacy, but no head-to-head against tirzepatide or semaglutide has reported.", "es": "Dos lecturas de fase 3 en China (GEMINI-1 obesidad, 302 DT2) muestran fuerte eficacia controlada con placebo, pero no se ha publicado comparación directa con tirzepatida o semaglutida.", "source_ids": ["1276-NEW-01", "1276-NEW-02", "1276-NEW-03"]}}, {"dimension": "ip_economic_defensibility", "rating": "MIDDLING", "reason": {"en": "A US composition-of-matter grant exists with expected 2041 expiry, but the sequence-to-claim mapping, live legal status and enforceability are unverified.", "es": "Existe una concesión estadounidense de composición de la molécula con caducidad esperada en 2041, pero el mapeo secuencia-reivindicación, el estado legal vigente y la aplicabilidad no están verificados.", "source_ids": ["1276-NEW-15", "1276-NEW-14", "1276-NEW-12"]}}, {"dimension": "financial_strength", "rating": "GOOD", "reason": {"en": "RMB38,031.524m cash equivalents, H1 profit of RMB4,465.439m and no disclosed outstanding bank borrowing make funding risk low.", "es": "RMB38.031,524M en equivalentes de efectivo, beneficio del S1 de RMB4.465,439M y sin préstamos bancarios pendientes divulgados hacen que el riesgo de financiación sea bajo.", "source_ids": ["1276-NEW-07"]}}, {"dimension": "regulatory_exposure", "rating": "MIDDLING", "reason": {"en": "The obesity NDA has been pending since September 2025 with approval only expected early 2027, and approval, pricing and reimbursement must not be presumed.", "es": "La NDA de obesidad está pendiente desde septiembre de 2025 con aprobación solo esperada a principios de 2027, y no debe presumirse la aprobación, el precio ni el reembolso.", "source_ids": ["1276-NEW-03", "1276-NEW-06"]}}, {"dimension": "competitive_position", "rating": "MIDDLING", "reason": {"en": "Ribupatide's 17.7% is numerically strong but not head-to-head, and approved competitors mazdutide and ecnoglutide already occupy the Chinese market.", "es": "El 17,7% de ribupatida es numéricamente fuerte pero sin comparación directa, y los competidores aprobados mazdutida y ecnoglutida ya ocupan el mercado chino.", "source_ids": ["1276-NEW-01", "1276-NEW-18", "1276-NEW-17"]}}, {"dimension": "valuation_attractiveness", "rating": "UNKNOWN", "reason": {"en": "A derived basic equity value of about CNY308.93bn exists, but standalone peptide economics within the diversified group are not quantified, so attractiveness cannot be judged.", "es": "Existe un valor patrimonial básico derivado de unos CNY308.930 millones, pero la economía del péptido dentro del grupo diversificado no está cuantificada, por lo que no se puede juzgar el atractivo.", "source_ids": ["1276-NEW-08", "1276-NEW-09", "1276-NEW-11", "1276-NEW-07"]}}, {"dimension": "catalyst_quality", "rating": "FAIR", "reason": {"en": "A dated, evidence-backed catalyst exists (potential China approval early 2027 per the issuer), with the bigger global phase 3 readout not before 2028; both are forecasts with execution risk.", "es": "Existe un catalizador fechado y respaldado por evidencia (posible aprobación en China a principios de 2027 según el emisor), con la mayor lectura global de fase 3 no antes de 2028; ambos son pronósticos con riesgo de ejecución.", "source_ids": ["1276-NEW-06", "1276-REG-NCT07284979"]}}], "unknowns": [{"en": "Standalone peptide revenue and retained economics within the listed group are not quantified, so peptide materiality to the share cannot be judged.", "es": "Los ingresos del péptido por separado y la economía retenida dentro del grupo cotizado no están cuantificados, por lo que no se puede juzgar la materialidad del péptido para la acción.", "source_ids": ["ID-1276-01", "1276-NEW-07"]}, {"en": "The exact mapping of the commercial ribupatide sequence to granted patent claims, and live national legal status, remain unverified.", "es": "El mapeo exacto de la secuencia comercial de ribupatida a las reivindicaciones de patentes concedidas, y el estado legal nacional vigente, siguen sin verificar.", "source_ids": ["1276-NEW-14", "1276-NEW-15"]}, {"en": "The HRS1596 royalty rate to Novo and its compound patent family are not disclosed in the retrieved agreement announcement.", "es": "La tasa de regalías de HRS1596 a Novo y su familia de patentes del compuesto no están divulgadas en el anuncio del acuerdo recuperado.", "source_ids": ["1276-NEW-13"]}, {"en": "Account-specific broker permission, lot size, funding and FX for buying the HKD H share are not established by the public availability evidence.", "es": "El permiso específico de la cuenta del corredor, el tamaño del lote, la financiación y la divisa para comprar la acción H en HKD no están establecidos por la evidencia pública de disponibilidad.", "source_ids": ["1276-NEW-19", "1276-NEW-20"]}], "coverage_boundary": {"en": "This judgment covers only the HK-listed H share (1276) of Jiangsu Hengrui Pharmaceuticals as of 2026-10-11, based on the retrieved sources; it excludes the A share (600276) as an investment, does not verify broker account permissions, relies on issuer and registry data with some paraphrase captures, and the broad oncology portfolio was not individually assessed.", "es": "Este juicio cubre solo la acción H cotizada en Hong Kong (1276) de Jiangsu Hengrui Pharmaceuticals al 11-10-2026, basada en las fuentes recuperadas; excluye la acción A (600276) como inversión, no verifica permisos de cuentas de corredores, se basa en datos del emisor y registros con algunas capturas parafraseadas, y el amplio portafolio de oncología no fue evaluado individualmente.", "source_ids": ["ID-1276-01", "ID-1276-02", "1276-NEW-07"]}}, {"ticker": "1801", "company": "Innovent Biologics, Inc.", "class": "emerging_commercial", "cutoff": "2026-10-11", "regulatory_chips": [], "card": {"what_you_buy": {"en": "You buy exposure to mazdutide, a weekly GLP-1/glucagon dual-agonist peptide approved in China for weight management (2025-06-24) and type 2 diabetes (2025-09-16) at 4/6 mg maintenance doses: in the published phase 3 GLORY-1 (n=610, NEJM), 6 mg cut weight 14.01% vs 0.3% on placebo at 48 weeks, and published GLORY-2 (n=461, JAMA) showed -16.65% at 60 weeks on 9 mg; the 9 mg dose remains under China review, and the DREAMS-3 semaglutide head-to-head is a sponsor announcement, not yet peer-reviewed here.", "es": "Usted compra exposición a mazdutida, un péptido dual agonista GLP-1/glucagón semanal aprobado en China para manejo de peso (2025-06-24) y diabetes tipo 2 (2025-09-16) con dosis de mantenimiento de 4/6 mg: en la fase 3 publicada GLORY-1 (n=610, NEJM), 6 mg redujo el peso 14.01% vs 0.3% con placebo a 48 semanas, y GLORY-2 publicada (n=461, JAMA) mostró -16.65% a 60 semanas con 9 mg; la dosis de 9 mg sigue en revisión en China, y el cara-a-cara DREAMS-3 contra semaglutida es un anuncio del patrocinador, aún sin revisión por pares aquí.", "source_ids": ["1801-NEW-01", "1801-NEW-02", "1801-NEW-03", "1801-NEW-07", "ID-1801-02"]}, "why_it_could_work": {"en": "Innovent holds exclusive China development and commercialization rights licensed from Lilly (2019), so approved-label sales of a differentiated dual agonist in a huge overweight/obese Chinese population could generate durable group profit; the main dependency is undisclosed Lilly license economics and intensifying Chinese GLP-1 competition.", "es": "Innovent posee los derechos exclusivos de desarrollo y comercialización de mazdutida en China bajo licencia de Lilly (2019), de modo que las ventas de un agonista dual diferenciado, con etiqueta aprobada, en una enorme población china con sobrepeso u obesidad podrían generar beneficio grupal durable; la dependencia principal son los términos económicos no divulgados de la licencia de Lilly y la creciente competencia china de GLP-1.", "source_ids": ["1801-NEW-04", "1801-NEW-11", "1801-NEW-15", "ID-1801-02"]}, "what_can_kill_it": {"en": "Fact: approved rivals already compete in China (Wegovy since 2024, tirzepatide in the 2024 guideline, ecnoglutide approved 2026-03) and UBT251 showed up to -19.7% in phase 2. Scenario: price/volume erosion, 9 mg rejection or delay, unproven patent enforceability, undisclosed Innovent-Lilly royalties compressing margins, frequent GI adverse events, and no ex-China rights to offset any China failure.", "es": "Hecho: rivales aprobados ya compiten en China (Wegovy desde 2024, tirzepatida en la guía 2024, ecnoglutida aprobado el 2026-03) y UBT251 mostró hasta -19.7% en fase 2. Escenario: erosión de precio/volumen, rechazo o retraso de la dosis de 9 mg, patentabilidad no demostrada en ejecución, regalías Innovent-Lilly no divulgadas que compriman márgenes, frecuentes eventos adversos gastrointestinales y sin derechos fuera de China para compensar un fracaso en China.", "source_ids": ["1801-NEW-02", "1801-NEW-08", "1801-NEW-09", "1801-NEW-10", "1801-NEW-11", "1801-NEW-12", "1801-NEW-13", "1801-NEW-14", "1801-NEW-18", "ID-1801-02"]}, "financial_strength": {"en": "The group is self-funding today: H1 2026 revenue RMB 8,617.801m, IFRS profit RMB 1,253.142m and operating cash flow RMB 3,588.344m (including a RMB 2,127.42m contract-liability increase), with cash equivalents RMB 4,523.941m plus >3-month deposits RMB 13,932.203m at 2026-06-30; these are group
